<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Card Collections | ASCRL</title>
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 

    <style>
        /* --- BINDER SYSTEM STYLES --- */
        :root {
            --binder-texture: url("https://www.transparenttextures.com/patterns/leather.png");
            --page-bg: #f4f4f4;
            --slot-border: rgba(0, 0, 0, 0.1);
            --plastic-sheen: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1) 100%);
        }

        body {
            background-color: #111;
            background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            margin: 0;
            font-family: 'Arial Black', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #nav-placeholder { position: relative; z-index: 10000; }

        /* SHELF LAYOUT */
        .shelf {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 50px 20px;
            flex-wrap: wrap;
            perspective: 2500px; /* Essential for 3D */
            flex: 1;
        }

        /* --- BINDER COMPONENT --- */
        .binder {
            position: relative;
            width: 500px; /* Folded width */
            height: 650px;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            margin-bottom: 50px;
        }

        /* Styling for specific binders */
        .binder.winners .cover, .binder.winners .spine { background-color: #D4AF37; /* Gold */ }
        .binder.roster .cover, .binder.roster .spine { background-color: #800000; /* Red */ }

        /* Closed State */
        .binder.closed {
            transform: rotateY(-25deg) rotateX(10deg);
        }
        /* Open State */
        .binder.open {
            transform: translateX(250px) rotateY(0deg); /* Shift right to center the open spread */
        }

        /* SPINE */
        .spine {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 50px;
            background-image: var(--binder-texture);
            transform-origin: left;
            transform: rotateY(-90deg);
            display: flex; align-items: center; justify-content: center;
            border-radius: 5px 0 0 5px;
        }
        .spine span {
            transform: rotate(90deg);
            white-space: nowrap;
            color: rgba(255,255,255,0.7);
            font-size: 2rem;
            letter-spacing: 5px;
        }

        /* PAGES */
        .page {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s;
            border: 2px solid #222;
        }

        /* Front Cover */
        .cover {
            background-image: var(--binder-texture);
            z-index: 10;
            transform-origin: left;
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            backface-visibility: hidden; /* Important */
            border-radius: 5px 10px 10px 5px;
        }
        
        .binder.open .cover { transform: rotateY(-180deg); }

        /* The Inside Left Page (Back of Cover) */
        .inside-cover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            transform-origin: left;
            transform: rotateY(-180deg); /* Starts flipped */
            z-index: 5;
            backface-visibility: hidden; /* Hides when closed */
            display: flex; justify-content: center; align-items: center;
        }
        .binder.open .inside-cover { 
            transform: rotateY(-180deg); /* Stays put relative to spine, looks "flat" */
            z-index: 11; /* Pop above right page */
        }

        /* The Right Page (Base) */
        .base-page {
            background: #fff;
            z-index: 1;
            border-radius: 0 10px 10px 0;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }

        /* SHEET GRID */
        .sheet {
            width: 90%; height: 95%;
            background: var(--page-bg);
            margin: 2.5% auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        /* CARD SLOTS */
        .slot {
            background: #fff;
            border: 1px solid var(--slot-border);
            position: relative;
            cursor: pointer;
            transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .slot:hover { transform: scale(1.05); z-index: 20; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        .slot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

        /* Plastic Sheen */
        .slot::after {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: var(--plastic-sheen); pointer-events: none;
        }

        /* --- CARD INSPECTION MODAL --- */
        .card-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 20000;
            display: none;
            justify-content: center; align-items: center;
            perspective: 1000px;
        }

        .big-card-container {
            width: 400px; height: 560px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .big-card-container.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(255,255,255,0.1);
        }

        .card-face img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }
        
        .card-back { transform: rotateY(180deg); background: #111; display: flex; align-items: center; justify-content: center; color: #fff; }

        .close-modal {
            position: absolute; top: 30px; right: 30px;
            color: #fff; font-size: 2rem; cursor: pointer;
            z-index: 20001;
        }

        .instruction { text-align: center; color: #666; padding: 20px; }

        @media (max-width: 1100px) {
            .shelf { flex-direction: column; perspective: none; }
            .binder { margin-bottom: 50px; width: 90vw; height: 120vw; max-width: 500px; max-height: 650px; }
            .binder.open { transform: none; }
            .binder.open .cover { display: none; } /* Hide cover on mobile open for simplicity */
            .binder.open .inside-cover { transform: none; display: none; } /* Hide left page on mobile to show right */
            .big-card-container { width: 90vw; height: 125vw; }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="shelf">

        <div class="binder closed winners" onclick="toggleBinder(this)">
            <div class="spine"><span>WINNERS</span></div>
            
            <div class="page cover">
                <img src="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96" style="width:80px; margin-bottom:15px; filter: drop-shadow(0 0 5px #000);">
                <h1>VICTORY LANE</h1>
                <p>2026 SEASON COLLECTION</p>
            </div>

            <div class="page inside-cover">
                <div class="sheet" id="winners-sheet-left"></div>
            </div>

            <div class="page base-page">
                <div class="sheet" id="winners-sheet-right"></div>
            </div>
        </div>

        <div class="binder closed roster" onclick="toggleBinder(this)">
            <div class="spine"><span>ROSTER</span></div>
            
            <div class="page cover">
                <img src="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96" style="width:80px; margin-bottom:15px; filter: drop-shadow(0 0 5px #000);">
                <h1>THE ROSTER</h1>
                <p>2026 OFFICIAL DRIVER CARDS</p>
            </div>

            <div class="page inside-cover">
                <div class="sheet" id="roster-sheet-left"></div>
            </div>

            <div class="page base-page">
                <div class="sheet" id="roster-sheet-right"></div>
            </div>
        </div>

    </div>

    <div class="instruction">CLICK BINDER TO OPEN • CLICK CARD TO INSPECT • CLICK INSPECTED CARD TO FLIP</div>

    <div id="card-modal" class="card-modal">
        <div class="close-modal" onclick="closeCard()">&times;</div>
        <div class="big-card-container" id="big-card" onclick="flipCard()">
            <div class="card-face card-front">
                <img id="modal-img-front" src="">
            </div>
            <div class="card-face card-back">
                <img id="modal-img-back" src="">
            </div>
        </div>
        <div style="position: absolute; bottom: 50px; color: #fff; font-size: 0.8rem; letter-spacing: 2px;">TAP CARD TO FLIP</div>
    </div>

    <script>
        // 1. Load Nav
        fetch('nav.html').then(r=>r.text()).then(d=>document.getElementById('nav-placeholder').innerHTML=d);
        function toggleMenu() { document.getElementById('nav-menu').classList.toggle('open'); }

        // --- DATA SECTION: PASTE YOUR CARD LINKS HERE ---
        
        // BINDER 1: WINNERS COLLECTION
        const winnersData = [
            // { front: "URL", back: "URL" }
            // Example:
            // { front: "https://...win1.jpg", back: "https://...win1-back.jpg" },
        ];

        // BINDER 2: ROSTER COLLECTION
        const rosterData = [
             { 
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/4d823416402c0d2038c7dfa0646e69182fd8d624/DakotaThomas24.jpg", 
                back: "https://placehold.co/400x600/000/FFF/png?text=Dakota+Stats" // Replace with real back image
            },
            { 
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/b10a9f64e5ac0b6874791209c8cd1f090df473d0/HockeyDeckOut71.jpg", 
                back: "https://placehold.co/400x600/000/FFF/png?text=Hockey+Stats" 
            },
            // Add more drivers here...
        ];

        // --- LOGIC ---

        function toggleBinder(el) {
            // Close others first
            document.querySelectorAll('.binder').forEach(b => {
                if(b !== el) b.classList.add('closed');
                if(b !== el) b.classList.remove('open');
            });
            el.classList.toggle('closed');
            el.classList.toggle('open');
        }

        function fillBinder(data, leftSheetId, rightSheetId) {
            const leftEl = document.getElementById(leftSheetId);
            const rightEl = document.getElementById(rightSheetId);
            
            // Fill Left (First 9)
            for (let i = 0; i < 9; i++) {
                createSlot(data[i], leftEl);
            }
            // Fill Right (Next 9)
            for (let i = 9; i < 18; i++) {
                createSlot(data[i], rightEl);
            }
        }

        function createSlot(cardData, parent) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            
            if (cardData) {
                const img = document.createElement('img');
                img.src = cardData.front;
                slot.appendChild(img);
                slot.onclick = (e) => {
                    e.stopPropagation(); // Prevent binder closing
                    inspectCard(cardData);
                };
            }
            parent.appendChild(slot);
        }

        // Modal Logic
        function inspectCard(cardData) {
            const modal = document.getElementById('card-modal');
            const front = document.getElementById('modal-img-front');
            const back = document.getElementById('modal-img-back');
            const container = document.getElementById('big-card');

            front.src = cardData.front;
            // Use a default back image if none provided
            back.src = cardData.back || "https://placehold.co/400x560/1a1a1a/FFF/png?text=ASCRL+2026"; 
            
            container.classList.remove('flipped'); // Reset flip
            modal.style.display = 'flex';
        }

        function flipCard() {
            document.getElementById('big-card').classList.toggle('flipped');
        }

        function closeCard() {
            document.getElementById('card-modal').style.display = 'none';
        }

        // Initialize
        fillBinder(winnersData, 'winners-sheet-left', 'winners-sheet-right');
        fillBinder(rosterData, 'roster-sheet-left', 'roster-sheet-right');

    </script>
</body>
</html>
