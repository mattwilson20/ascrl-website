<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams | American Stock Car Racing League</title>
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #000;
            --card-bg: #0d0d0d;
            --border: #1a1a1a;
            --text-muted: #a0a0a0;
            --transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            
            /* Series Colors */
            --cup-blue: #0077ff;
            --xfinity-purple: #8000b0;
            --truck-red: #c00;
            --menards-yellow: #fff200;
        }

        body { 
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            background-color: #333333; 
            background-image: 
                radial-gradient(transparent 0%, #000 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.35'/%3E%3C/svg%3E");
            background-attachment: fixed;
            color: #fff; 
            overflow-x: hidden; 
        }

        /* --- MODULAR NAVIGATION STYLES --- */
        #nav-placeholder { position: relative; z-index: 2000; }
        
        .nav-overlay { 
            position: fixed; top: 0; left: -100%; width: 100%; max-width: 350px; 
            height: 100vh; background: #050505; transition: left 0.5s ease; 
            z-index: 1999; padding-top: 100px; border-right: 1px solid var(--primary); 
        }
        .nav-overlay.open { left: 0; }
        .nav-links { display: flex; flex-direction: column; padding: 0 3rem; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-size: 1.2rem; padding: 1.2rem 0; 
            border-bottom: 1px solid var(--border); transition: var(--transition); letter-spacing: 2px; 
        }
        .nav-links a:hover { color: var(--primary); padding-left: 10px; }

        /* --- HERO --- */
        .hero { 
            background: radial-gradient(circle at center, #222 0%, #000 100%); 
            padding: 12rem 1rem 8rem; 
            text-align: center; 
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: clamp(3rem, 10vw, 5rem); margin: 0; letter-spacing: -2px; line-height: 0.9; }
        .hero p { color: var(--primary); letter-spacing: 5px; text-transform: uppercase; font-size: 0.9rem; margin-top: 1rem; }

        /* --- TEAM STANDINGS SECTION --- */
        .standings-section {
            background: #050505;
            padding: 3rem 2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4rem;
        }
        .standings-controls {
            text-align: center;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .series-btn {
            background: #111; border: 1px solid #333; color: #fff; 
            padding: 15px 30px; font-family: 'Arial Black', sans-serif; 
            text-transform: uppercase; font-size: 1rem; letter-spacing: 1px;
            cursor: pointer; transition: var(--transition); min-width: 150px;
            position: relative; overflow: hidden;
        }
        .series-btn:hover { transform: translateY(-3px); }
        .series-btn.active { border-color: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        .series-btn[data-series="Cup"].active { background: var(--cup-blue); border-color: var(--cup-blue); }
        .series-btn[data-series="Xfinity"].active { background: var(--xfinity-purple); border-color: var(--xfinity-purple); }
        .series-btn[data-series="Truck"].active { background: var(--truck-red); border-color: var(--truck-red); }
        .series-btn[data-series="Menards"].active { background: var(--menards-yellow); border-color: var(--menards-yellow); color: #000; }

        select { 
            background: #111; color: #fff; border: 1px solid var(--border); 
            padding: 1rem 2rem; font-family: 'Arial Black', sans-serif; 
            text-transform: uppercase; cursor: pointer; min-width: 250px;
            font-size: 1rem;
        }
        select:focus { border-color: var(--primary); outline: none; }

        .standings-table {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-collapse: collapse;
        }
        .standings-table th {
            text-align: left;
            padding: 1rem;
            color: var(--primary);
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border);
        }
        .standings-table td {
            padding: 1rem;
            border-bottom: 1px solid #111;
            font-family: sans-serif;
        }
        .rank-cell { font-family: 'Arial Black'; color: #fff; width: 50px; text-align: center; }
        .points-cell { font-family: 'Arial Black'; color: var(--accent); text-align: right; }
        .leader-row td { background: rgba(204,0,0,0.1); color: #fff; }

        /* --- TEAMS GRID --- */
        .container { max-width: 1300px; margin: 0 auto; padding: 0 2rem 4rem; }
        
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 3rem;
        }

        .team-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }
        .team-card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .team-header {
            background: #111;
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .team-header h2 { font-size: 1.5rem; margin: 0; text-transform: uppercase; color: #fff; letter-spacing: -1px; }
        .team-header p { margin: 0.5rem 0 0; color: var(--text-muted); font-family: sans-serif; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; }

        .team-roster {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .team-driver {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: #050505;
            border: 1px solid #222;
            transition: 0.2s;
            cursor: pointer;
        }
        .team-driver:hover { border-color: var(--primary); background: #111; }

        .car-number {
            font-size: 1.5rem;
            color: var(--accent);
            width: 50px;
            text-align: center;
            font-weight: 900;
        }
        
        .driver-details { flex-grow: 1; }
        .driver-name { font-size: 1.1rem; display: block; line-height: 1; margin-bottom: 4px; }
        .driver-manuf { font-family: sans-serif; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }

        /* --- MODAL --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); justify-content: center; align-items: center; z-index: 3000; }
        .modal-content { 
            background: #000; padding: 4rem; width: 100%; max-width: 800px; 
            border: 1px solid var(--primary); position: relative; max-height: 90vh; overflow-y: auto;
        }
        .close { position: absolute; top: 2rem; right: 2rem; font-size: 1rem; cursor: pointer; color: #fff; opacity: 0.5; border: 1px solid #fff; padding: 5px 15px; }
        .close:hover { opacity: 1; background: #fff; color: #000; }

        .modal-body h4 { color: var(--primary); text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-top: 3rem; }
        .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 1.5rem 0; }
        .stat-box { border-left: 2px solid #222; padding-left: 15px; }
        .stat-box small { font-size: 0.6rem; text-transform: uppercase; color: var(--text-muted); display: block; font-family: sans-serif; }
        .stat-box span { font-size: 1.4rem; color: var(--accent); font-family: 'Arial Black'; }

        /* --- FOOTER --- */
        footer { 
            padding: 4rem 1rem; 
            text-align: center; 
            border-top: 1px solid var(--border); 
            color: #333; 
            font-size: 0.8rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 1.5rem; 
        }

        .social-links { display: flex; gap: 2rem; justify-content: center; }
        .social-icon { 
            color: #555; font-size: 1.8rem; transition: 0.3s ease; 
            display: flex; align-items: center; justify-content: center; text-decoration: none;
        }
        .social-icon:hover { transform: translateY(-3px); }
        .social-icon.facebook:hover { color: #1877F2; } 
        .social-icon.x-twitter:hover { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .social-icon.email:hover { color: var(--primary); }

        @media (max-width: 768px) {
            .hero { padding: 10rem 1rem 4rem; }
            .stat-row { grid-template-columns: 1fr 1fr; }
            .modal-content { padding: 2rem; }
            .standings-controls { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="hamburger" onclick="toggleMenu()">
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
    </div>

    <nav class="nav-overlay" id="nav-menu">
        <div class="nav-links">
            <a href="index.html" id="nav-index">DASHBOARD</a>
            <a href="news.html" id="nav-news">LATEST NEWS</a>
            <a href="standings.html" id="nav-standings">STANDINGS</a>
            <a href="results.html" id="nav-results">RESULTS</a>
            <a href="schedule.html" id="nav-schedule">CALENDAR</a>
            <a href="teams.html" id="nav-teams">TEAMS</a>
            <a href="drivers.html" id="nav-drivers">ROSTER</a>
            <a href="rules.html" id="nav-rules">REGULATIONS</a>
        </div>
    </nav>

    <header class="hero">
        <p>Constructors Championship</p>
        <h1>TEAMS</h1>
    </header>

    <div class="standings-section">
        <div class="standings-controls">
            <select id="season-select" onchange="loadSeasonData(this.value)">
                <option value="Season_1" selected>Season 1 (2025-26)</option>
                <option value="Season_2">Season 2</option>
            </select>

            <div class="tabs-container">
                <button class="series-btn active" data-series="Cup" onclick="switchSeries('Cup')">Cup</button>
                <button class="series-btn" data-series="Xfinity" onclick="switchSeries('Xfinity')">Xfinity</button>
                <button class="series-btn" data-series="Truck" onclick="switchSeries('Truck')">Truck</button>
                <button class="series-btn" data-series="Menards" onclick="switchSeries('Menards')">Menards</button>
            </div>
        </div>
        
        <table class="standings-table">
            <thead>
                <tr>
                    <th style="text-align:center;">RANK</th>
                    <th>TEAM</th>
                    <th style="text-align:right;">TOTAL POINTS</th>
                </tr>
            </thead>
            <tbody id="standings-body">
                <tr><td colspan="3" style="text-align:center; padding:2rem; color:#666;">Loading Standings...</td></tr>
            </tbody>
        </table>
    </div>

    <main class="container">
        <h2 style="text-align: center; margin-bottom: 2rem; font-size: 1.2rem; color: var(--text-muted);">FULL TEAM GARAGE</h2>
        <div id="teams-container" class="teams-grid"></div>
    </main>

    <div id="driver-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('driver-modal').style.display='none'">CLOSE</span>
            <div id="modal-data" class="modal-body"></div>
        </div>
    </div>

    <footer>
        <div style="margin-bottom: 0.5rem; letter-spacing: 2px; color: #fff;">
            © 2025-2026 AMERICAN STOCK CAR RACING LEAGUE
        </div>
        <div style="font-size: 0.65rem; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 2rem; text-transform: uppercase;">
            OWNED AND OPERATED BY <span style="color: #fff; font-weight: bold;">A&M PRODUCTIONS LLC</span>
        </div>
        <div class="social-links">
            <a href="https://www.facebook.com/share/14PeZVCH1hL/" target="_blank" class="social-icon facebook"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://x.com/ASCRWeekly" target="_blank" class="social-icon x-twitter"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="mailto:contact.ascrl@gmail.com" class="social-icon email"><i class="fa-solid fa-envelope"></i></a>
        </div>
        <div style="font-size: 0.6rem; color: #444; margin-top: 20px; font-style: italic;">*ai generated images may be used</div>
    </footer>

    <script>
        // --- 1. NAV LOGIC ---
        const navLink = document.getElementById('nav-teams');
        if(navLink) {
            navLink.style.color = "var(--primary)";
            navLink.style.borderLeft = "4px solid var(--primary)";
            navLink.style.paddingLeft = "15px";
        }

        function toggleMenu() {
            const m = document.getElementById('nav-menu');
            if(m) m.classList.toggle('open');
        }

        // --- 2. DATA LOADING ---
        let driversData = {}; 
        let teamStandings = {}; 
        let currentSeries = 'Cup';

        document.addEventListener('DOMContentLoaded', () => {
            loadSeasonData("Season_1");
        });

        async function fetchWithFallback(filename) {
            const local = filename;
            const github = `https://raw.githubusercontent.com/mattwilson20/ascrl-website/main/${filename}`;
            try {
                let response = await fetch(local);
                if (response.ok) return await response.json();
                console.warn(`Local fetch failed for ${local}, trying GitHub...`);
                response = await fetch(github);
                if (response.ok) return await response.json();
                throw new Error("404 Not Found");
            } catch (err) {
                return null; // Return null if fail so Promise.all doesn't crash
            }
        }

        async function loadSeasonData(season) {
            document.getElementById('standings-body').innerHTML = '<tr><td colspan="3" style="text-align:center; padding:2rem; color:#666;">Accessing Data Feed...</td></tr>';
            
            // Load both files safely
            const [dData, tData] = await Promise.all([
                fetchWithFallback(`drivers_${season}.json`),
                fetchWithFallback(`ASCRL_Team_Standings_${season}.json`)
            ]);

            driversData = dData || {};
            teamStandings = tData || {};

            updateUI();
        }

        function switchSeries(seriesName) {
            currentSeries = seriesName;
            document.querySelectorAll('.series-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.series === seriesName) btn.classList.add('active');
            });
            updateUI();
        }

        function updateUI() {
            updateStandingsTable();
            renderGarage();
        }

        // --- 3. STANDINGS TABLE (WITH CALCULATION FALLBACK) ---
        function updateStandingsTable() {
            const tbody = document.getElementById('standings-body');
            tbody.innerHTML = '';

            let rows = [];

            // 1. Try Official Team Standings File first
            const seriesKey = Object.keys(teamStandings).find(k => k.toLowerCase() === currentSeries.toLowerCase());
            if (seriesKey && teamStandings[seriesKey]) {
                rows = teamStandings[seriesKey];
            } 
            
            // 2. If file is missing/empty, CALCULATE FROM DRIVERS DATA (The Fix)
            if (rows.length === 0 && Object.keys(driversData).length > 0) {
                rows = calculateTeamsFromDrivers(currentSeries);
            }

            if(rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:2rem; color:#666;">No active teams for ${currentSeries}.</td></tr>`;
                return;
            }

            rows.forEach((team, index) => {
                const isLeader = index === 0 ? 'class="leader-row"' : '';
                tbody.innerHTML += `
                    <tr ${isLeader}>
                        <td class="rank-cell">${index + 1}</td>
                        <td style="font-weight:bold; letter-spacing:1px; color:#fff;">${team.team}</td>
                        <td class="points-cell">${team.points}</td>
                    </tr>
                `;
            });
        }

        // --- HELPER: CALCULATE TEAMS FROM DRIVER DATA ---
        function calculateTeamsFromDrivers(seriesName) {
            const teamsMap = {};

            for (const [id, driver] of Object.entries(driversData)) {
                const sKey = Object.keys(driver.series || {}).find(k => k.toLowerCase() === seriesName.toLowerCase());
                if (!sKey) continue;

                const sData = driver.series[sKey];
                const teamName = sData.team || "Independent";
                
                // Skip independents for the points table? Usually yes.
                if (teamName.toLowerCase().includes("independent") || !teamName) continue;

                // Sum Points
                const stats = sData.stats || {};
                const pts = parseInt(stats.points || stats.Points || stats.pts || 0);

                if (!teamsMap[teamName]) teamsMap[teamName] = 0;
                teamsMap[teamName] += pts;
            }

            // Convert to array and sort
            return Object.entries(teamsMap)
                .map(([name, points]) => ({ team: name, points: points }))
                .sort((a, b) => b.points - a.points);
        }

        // --- 4. GARAGE GRID ---
        function renderGarage() {
            const container = document.getElementById('teams-container');
            container.innerHTML = '';

            if (Object.keys(driversData).length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#666;">Loading garage...</p>';
                return;
            }

            const garageTeams = {};

            Object.entries(driversData).forEach(([id, driver]) => {
                if(!driver.series) return;
                const sKey = Object.keys(driver.series).find(k => k.toLowerCase() === currentSeries.toLowerCase());
                if (!sKey) return;

                const sData = driver.series[sKey];
                let teamName = sData.team || "Independent";
                if (!teamName || teamName.trim() === "") teamName = "Independent";

                if (!garageTeams[teamName]) garageTeams[teamName] = [];

                garageTeams[teamName].push({
                    id: id,
                    name: driver.display_name || id,
                    number: sData.number || "N/A",
                    manuf: sData.manufacturer || "N/A"
                });
            });

            const sortedTeamNames = Object.keys(garageTeams).sort((a, b) => {
                if(a.includes("Independent")) return 1;
                if(b.includes("Independent")) return -1;
                return a.localeCompare(b);
            });

            if (sortedTeamNames.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#666;">No teams found in garage.</p>';
                return;
            }

            sortedTeamNames.forEach(team => {
                const roster = garageTeams[team];
                roster.sort((a, b) => parseInt(a.number) - parseInt(b.number));

                const rosterHtml = roster.map(d => `
                    <div class="team-driver" onclick="openProfile('${d.id}')">
                        <div class="car-number">#${d.number}</div>
                        <div class="driver-details">
                            <span class="driver-name">${d.name}</span>
                            <span class="driver-manuf">${d.manuf}</span>
                        </div>
                    </div>
                `).join('');

                const card = `
                    <div class="team-card">
                        <div class="team-header">
                            <h2>${team}</h2>
                            <p>${roster.length} CAR${roster.length > 1 ? 'S' : ''}</p>
                        </div>
                        <div class="team-roster">
                            ${rosterHtml}
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // --- 5. MODAL LOGIC ---
        function openProfile(id) {
            const driver = driversData[id]; 
            const modal = document.getElementById('driver-modal');
            const dataDiv = document.getElementById('modal-data');
            
            if(!driver) return;

            let displayName = driver.display_name || id;
            let html = `<h2 style="font-size:3rem; margin:0; line-height:1;">${displayName}</h2>`;
            
            const seriesOrder = ["Cup", "Xfinity", "Truck", "Menards"];
            const seriesKeys = Object.keys(driver.series).sort((a, b) => {
                let ia = seriesOrder.indexOf(a); let ib = seriesOrder.indexOf(b);
                if (ia === -1) ia = 99; if (ib === -1) ib = 99;
                return ia - ib;
            });

            seriesKeys.forEach(sName => {
                const s = driver.series[sName];
                const st = s.stats || {};
                
                let avgFin = st.avg;
                if (typeof avgFin === 'number') avgFin = avgFin.toFixed(1);
                else if (!isNaN(parseFloat(avgFin))) avgFin = parseFloat(avgFin).toFixed(1);
                else avgFin = "N/A";
                
                const pts = parseInt(st.points || st.Points || st.pts || 0);
                const wins = parseInt(st.wins || st.Wins || 0);
                const t5 = parseInt(st.top5 || st.Top5 || 0);
                const t10 = parseInt(st.top10 || st.Top10 || 0);
                const poles = parseInt(st.poles || st.Poles || 0);

                html += `
                    <h4>${sName} Series / #${s.number} ${s.manufacturer}</h4>
                    <p style="font-family:sans-serif; font-size:0.9rem; color:#666;">Team: ${s.team || 'Independent'}</p>
                    <div class="stat-row">
                        <div class="stat-box"><small>Points</small><span>${pts}</span></div>
                        <div class="stat-box"><small>Wins</small><span>${wins}</span></div>
                        <div class="stat-box"><small>Top 5s</small><span>${t5}</span></div>
                        <div class="stat-box"><small>Top 10s</small><span>${t10}</span></div>
                        <div class="stat-box"><small>Poles</small><span>${poles}</span></div>
                        <div class="stat-box"><small>Avg. Fin</small><span>${avgFin}</span></div>
                    </div>
                `;
            });

            dataDiv.innerHTML = html;
            modal.style.display = 'flex';
        }

        window.onclick = function(e) {
            if (e.target.className === 'modal') {
                document.getElementById('driver-modal').style.display = 'none';
            }
        }
    </script>
</body>
</html>
