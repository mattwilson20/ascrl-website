<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams | American Stock Car Racing League</title>
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #c00; --accent: #ff0; --bg-dark: #000; --card-bg: #0d0d0d; --border: #1a1a1a;
            --text-muted: #a0a0a0; --transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            --cup-blue: #0077ff; --xfinity-purple: #8000b0; --truck-red: #c00; --menards-yellow: #fff200;
        }

        body { 
            margin: 0; font-family: 'Arial Black', sans-serif; background-color: #333; 
            background-image: radial-gradient(transparent 0%, #000 100%), url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.35'/%3E%3C/svg%3E");
            background-attachment: fixed; color: #fff; overflow-x: hidden; 
        }

        /* --- MODULAR NAVIGATION STYLES --- */
        #nav-placeholder { position: relative; z-index: 2000; }
        
        .nav-overlay { 
            position: fixed; top: 0; left: -100%; width: 100%; max-width: 350px; 
            height: 100vh; background: #050505; transition: left 0.5s ease; 
            z-index: 1999; padding-top: 100px; border-right: 1px solid var(--primary); 
        }
        .nav-overlay.open { left: 0; }
        .nav-links { display: flex; flex-direction: column; padding: 0 3rem; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-size: 1.2rem; padding: 1.2rem 0; 
            border-bottom: 1px solid var(--border); transition: var(--transition); letter-spacing: 2px; 
        }
        .nav-links a:hover { color: var(--primary); padding-left: 10px; }

        
        /* HERO & LAYOUT */
        .hero { background: radial-gradient(circle at center, #222 0%, #000 100%); padding: 12rem 1rem 8rem; text-align: center; border-bottom: 1px solid var(--border); }
        h1 { font-size: clamp(3rem, 10vw, 5rem); margin: 0; letter-spacing: -2px; }
        
        .standings-section { background: #050505; padding: 3rem 2rem; border-bottom: 1px solid var(--border); margin-bottom: 4rem; min-height: 60vh;}
        .standings-controls { text-align: center; margin-bottom: 2rem; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        
        .series-btn { background: #111; border: 1px solid #333; color: #fff; padding: 15px 30px; font-family: 'Arial Black', sans-serif; text-transform: uppercase; cursor: pointer; min-width: 150px; }
        .series-btn.active { border-color: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .series-btn[data-series="Cup"].active { background: var(--cup-blue); border-color: var(--cup-blue); }
        .series-btn[data-series="Xfinity"].active { background: var(--xfinity-purple); border-color: var(--xfinity-purple); }
        .series-btn[data-series="Truck"].active { background: var(--truck-red); border-color: var(--truck-red); }
        .series-btn[data-series="Menards"].active { background: var(--menards-yellow); border-color: var(--menards-yellow); color: #000; }
        
        select { background: #111; color: #fff; border: 1px solid var(--border); padding: 1rem 2rem; font-family: 'Arial Black'; text-transform: uppercase; cursor: pointer; min-width: 250px; }

        /* TABLE */
        .standings-table { width: 100%; max-width: 900px; margin: 0 auto; border-collapse: collapse; }
        .standings-table th { text-align: left; padding: 1rem; color: var(--primary); border-bottom: 1px solid var(--border); }
        
        /* Main Team Row */
        .team-row { cursor: pointer; transition: background 0.2s; }
        .team-row:hover { background: #1a1a1a; }
        .team-row td { padding: 1.5rem 1rem; border-bottom: 1px solid #222; font-family: sans-serif; vertical-align: middle; }
        .team-row.active-row td { border-bottom: none; background: #111; }
        
        .rank-cell { font-family: 'Arial Black'; text-align: center; width: 50px; }
        .points-cell { font-family: 'Arial Black'; color: var(--accent); text-align: right; font-size: 1.2rem; }
        .leader-row td { background: rgba(204,0,0,0.1); }
        
        .toggle-icon { margin-left: 10px; font-size: 0.8rem; color: #666; transition: 0.3s; }
        .active-row .toggle-icon { transform: rotate(180deg); color: var(--primary); }

        /* Dropdown Details */
        .details-row { display: none; background: #0a0a0a; }
        .details-row.show { display: table-row; animation: fadeIn 0.3s ease; }
        .details-content { padding: 1rem 2rem 2rem; border-bottom: 1px solid var(--primary); }
        
        .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 10px; }
        .driver-chip { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #151515; border: 1px solid #333; padding: 10px; 
        }
        .chip-left { display: flex; align-items: center; gap: 10px; }
        .chip-num { font-family: 'Arial Black'; color: var(--accent); font-style: italic; }
        .chip-name { font-size: 0.9rem; font-weight: bold; }
        .chip-pts { font-family: 'Arial Black'; color: #fff; font-size: 0.9rem; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        footer { padding: 4rem 1rem; text-align: center; border-top: 1px solid var(--border); color: #333; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
        .social-links { display: flex; gap: 2rem; justify-content: center; }
        .social-icon { color: #555; font-size: 1.8rem; transition: 0.3s; }
        .social-icon:hover { color: #fff; }

        /* DEBUG BOX */
        #debug-log { display: none; background: #220000; color: #ffaaaa; padding: 20px; margin: 20px auto; max-width: 800px; border: 1px solid red; font-family: monospace; text-align: left; }
    </style>
</head>
<body>

    <div class="hamburger" onclick="toggleMenu()">
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
    </div>

    <nav class="nav-overlay" id="nav-menu">
        <div class="nav-links">
            <a href="index.html" id="nav-index">DASHBOARD</a>
            <a href="news.html" id="nav-news">LATEST NEWS</a>
            <a href="standings.html" id="nav-standings">STANDINGS</a>
            <a href="results.html" id="nav-results">RESULTS</a>
            <a href="schedule.html" id="nav-schedule">CALENDAR</a>
            <a href="teams.html" id="nav-teams">TEAMS</a>
            <a href="drivers.html" id="nav-drivers">ROSTER</a>
            <a href="rules.html" id="nav-rules">REGULATIONS</a>
        </div>
    </nav>

    <header class="hero">
        <p>Constructors Championship</p>
        <h1>TEAMS</h1>
    </header>

    <div id="debug-log"></div>

    <div class="standings-section">
        <div class="standings-controls">
            <select id="season-select" onchange="loadSeasonData()">
                <option value="Season_1" selected>Season 1 (2025-26)</option>
            </select>

            <div class="tabs-container">
                <button class="series-btn active" data-series="Cup" onclick="switchSeries('Cup')">Cup</button>
                <button class="series-btn" data-series="Xfinity" onclick="switchSeries('Xfinity')">Xfinity</button>
                <button class="series-btn" data-series="Truck" onclick="switchSeries('Truck')">Truck</button>
                <button class="series-btn" data-series="Menards" onclick="switchSeries('Menards')">Menards</button>
            </div>
        </div>
        
        <table class="standings-table">
            <thead>
                <tr>
                    <th style="text-align:center;">RANK</th>
                    <th>TEAM</th>
                    <th style="text-align:right;">TOTAL POINTS</th>
                </tr>
            </thead>
            <tbody id="standings-body">
                <tr><td colspan="3" style="text-align:center; padding:2rem; color:#666;">Loading Standings...</td></tr>
            </tbody>
        </table>
    </div>

    <footer>
        <div style="margin-bottom: 0.5rem; letter-spacing: 2px; color: #fff;">
            © 2025-2026 AMERICAN STOCK CAR RACING LEAGUE
        </div>
        
        <div style="font-size: 0.65rem; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 2rem; text-transform: uppercase;">
            OWNED AND OPERATED BY <span style="color: #fff; font-weight: bold;">A&M PRODUCTIONS LLC</span>
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/share/14PeZVCH1hL/" target="_blank" class="social-icon facebook" aria-label="Facebook">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="https://x.com/ASCRWeekly" target="_blank" class="social-icon x-twitter" aria-label="X (Twitter)">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            
            <a href="mailto:contact.ascrl@gmail.com" class="social-icon email" aria-label="Email A&M Productions">
                <i class="fa-solid fa-envelope"></i>
            </a>
        </div>
        
        <div style="font-size: 0.6rem; color: #444; margin-top: 20px; font-style: italic;">*ai generated images may be used</div>
    </footer>

    <script>
        // 1. NAV LOGIC
        const navLink = document.getElementById('nav-teams');
        if(navLink) {
            navLink.style.color = "var(--primary)";
            navLink.style.borderLeft = "4px solid var(--primary)";
            navLink.style.paddingLeft = "15px";
        }
        function toggleMenu() { document.getElementById('nav-menu').classList.toggle('open'); }

        // 2. DATA LOADING
        let driversData = {}; 
        let currentSeries = 'Cup';

        const FILE_DRIVERS = "drivers.json";

        document.addEventListener('DOMContentLoaded', () => { loadSeasonData(); });

        async function fetchWithFallback(filename) {
            const local = filename;
            const github = `https://raw.githubusercontent.com/mattwilson20/ascrl-website/main/${filename}`;
            try {
                let r = await fetch(local);
                if (r.ok) return await r.json();
                console.warn(`Local failed for ${local}, trying GitHub...`);
                r = await fetch(github);
                if (r.ok) return await r.json();
                throw new Error("404 Not Found");
            } catch (err) {
                console.error(`Failed to load: ${filename}`);
                return null; 
            }
        }

        async function loadSeasonData() {
            document.getElementById('standings-body').innerHTML = '<tr><td colspan="3" style="text-align:center;">Accessing Data...</td></tr>';
            
            // We only STRICTLY need drivers.json to calculate team points + driver breakdown
            const dData = await fetchWithFallback(FILE_DRIVERS);
            driversData = dData || {};

            updateUI();
        }

        function switchSeries(s) {
            currentSeries = s;
            document.querySelectorAll('.series-btn').forEach(b => {
                b.classList.remove('active');
                if(b.dataset.series === s) b.classList.add('active');
            });
            updateUI();
        }

        function updateUI() {
            updateStandingsTable();
        }

        // 3. TABLE LOGIC
        function updateStandingsTable() {
            const tbody = document.getElementById('standings-body');
            tbody.innerHTML = '';
            
            // We calculate teams dynamically from drivers.json to ensure we have the member list
            const teams = calculateTeamsFromDrivers(currentSeries);

            if(teams.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">No active teams for ${currentSeries}.</td></tr>`;
                return;
            }

            teams.forEach((team, index) => {
                let displayTeamName = team.name;
                let logoUrl = "";
                let cleanName = displayTeamName.toUpperCase();

                // Logo mapping
                if(cleanName.includes("TOO BROKE RACING")) logoUrl = "https://cdn.discordapp.com/emojis/1438415391943692338.png";
                else if(cleanName.includes("APEX")) logoUrl = "https://cdn.discordapp.com/emojis/1438414940078870559.png";
                else if(cleanName.includes("BHG MOTORSPORTS")) logoUrl = "https://cdn.discordapp.com/emojis/1453504409119232072.webp?size=96";
                else if(cleanName.includes("GREAT LAKES RACING")) logoUrl = "https://cdn.discordapp.com/emojis/1452901033419210887.webp?size=96";
                else if(cleanName.includes("BACKROW MOTORSPORTS")) logoUrl = "https://cdn.discordapp.com/emojis/1438414138387861544.webp?size=96";
                else if(cleanName.includes("WHY IS IT SMOKING? MOTORSPORTS")) logoUrl = "https://cdn.discordapp.com/emojis/1439739464464334888.webp?size=96";
                else if(cleanName.includes("GAZOO MOTORSPORTS")) logoUrl = "https://cdn.discordapp.com/emojis/1438414850895249439.webp?size=96";
                else if(cleanName.includes("FAST AND LOOSE RACING")) logoUrl = "https://cdn.discordapp.com/emojis/1439739297761857616.webp?size=96";
                else if(cleanName.includes("OUTLAW RACING")) logoUrl = "https://cdn.discordapp.com/emojis/1456473937742397612.webp?size=44";

                if(logoUrl) displayTeamName = `<img src="${logoUrl}" style="height: 1.5em; vertical-align: middle; margin-right: 8px;"> ${displayTeamName}`;

                const rowId = `team-row-${index}`;
                const detailId = `team-detail-${index}`;

                // Create roster HTML
                const rosterHtml = team.drivers.map(d => `
                    <div class="driver-chip">
                        <div class="chip-left">
                            <span class="chip-num">#${d.number}</span>
                            <span class="chip-name">${d.name}</span>
                        </div>
                        <span class="chip-pts">${d.points} PTS</span>
                    </div>
                `).join('');

                // MAIN ROW
                const tr = document.createElement('tr');
                tr.className = `team-row ${index === 0 ? 'leader-row' : ''}`;
                tr.onclick = () => toggleDetails(rowId, detailId);
                tr.id = rowId;
                tr.innerHTML = `
                    <td class="rank-cell">${index + 1}</td>
                    <td style="font-weight:bold; letter-spacing:1px; color:#fff;">
                        ${displayTeamName} <i class="fa-solid fa-chevron-down toggle-icon"></i>
                    </td>
                    <td class="points-cell">${team.totalPoints}</td>
                `;
                tbody.appendChild(tr);

                // HIDDEN DETAILS ROW
                const trDetail = document.createElement('tr');
                trDetail.className = 'details-row';
                trDetail.id = detailId;
                trDetail.innerHTML = `
                    <td colspan="3" style="padding:0;">
                        <div class="details-content">
                            <small style="color:var(--text-muted); text-transform:uppercase; letter-spacing:1px;">Contributing Drivers</small>
                            <div class="roster-grid">
                                ${rosterHtml}
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(trDetail);
            });
        }

        function calculateTeamsFromDrivers(seriesName) {
            const teamsMap = {};
            
            for (const [id, driver] of Object.entries(driversData)) {
                if(!driver.series) continue;
                
                // Case insensitive series match
                const sKey = Object.keys(driver.series).find(k => k.toLowerCase() === seriesName.toLowerCase());
                if (!sKey) continue;
                
                const sData = driver.series[sKey];
                const teamName = sData.team || "Independent";
                
                // FILTER: Remove Independents / Nulls
                if (!teamName || teamName.toLowerCase().includes("independent") || teamName === "") continue;
                
                // POINTS CHECK
                const st = sData.stats || {};
                const pts = parseInt(st.points || st.Points || 0);
                
                if (!teamsMap[teamName]) {
                    teamsMap[teamName] = {
                        name: teamName,
                        totalPoints: 0,
                        drivers: []
                    };
                }
                
                teamsMap[teamName].totalPoints += pts;
                teamsMap[teamName].drivers.push({
                    name: driver.display_name,
                    number: sData.number,
                    points: pts
                });
            }

            // Convert map to array and sort by points
            const sortedTeams = Object.values(teamsMap).sort((a, b) => b.totalPoints - a.totalPoints);
            
            // Sort drivers inside each team by number
            sortedTeams.forEach(team => {
                team.drivers.sort((a, b) => parseInt(a.number) - parseInt(b.number));
            });

            return sortedTeams;
        }

        function toggleDetails(rowId, detailId) {
            const row = document.getElementById(rowId);
            const detail = document.getElementById(detailId);
            
            row.classList.toggle('active-row');
            detail.classList.toggle('show');
        }
    </script>

    <script>
        // 1. Disable Right Click
        document.addEventListener('contextmenu', (e) => { e.preventDefault(); });

        // 2. Disable Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key.toLowerCase()) {
                    case 'u': case 's': case 'a': case 'c':
                        e.preventDefault(); return false;
                }
                if (e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j')) {
                    e.preventDefault(); return false;
                }
            }
            if (e.key === 'F12') { e.preventDefault(); return false; }
        });
    </script>

</body>
</html>
