    <style>
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #000;
            --card-bg: #0d0d0d;
            --border: #1a1a1a;
            --text-muted: #a0a0a0;
            --transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        body { 
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            
            /* --- NASHVILLE (CONCRETE) TEXTURE --- */
            background-color: #333333; 
            
            background-image: 
                radial-gradient(transparent 0%, #000 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.35'/%3E%3C/svg%3E");
            
            background-attachment: fixed;
            color: #fff; 
            overflow-x: hidden; 
        }

        /* --- MODULAR NAVIGATION STYLES --- */
        /* Z-Index increased to 99999 to guarantee clickability */
        #nav-placeholder { position: relative; z-index: 99999; }
        
        .nav-overlay { 
            position: fixed; top: 0; left: -100%; width: 100%; max-width: 350px; 
            height: 100vh; background: #050505; transition: left 0.5s ease; 
            z-index: 100000; padding-top: 100px; border-right: 1px solid var(--primary); 
        }
        .nav-overlay.open { left: 0; }
        .nav-links { display: flex; flex-direction: column; padding: 0 3rem; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-size: 1.2rem; padding: 1.2rem 0; 
            border-bottom: 1px solid var(--border); transition: var(--transition); letter-spacing: 2px; 
        }
        .nav-links a:hover { color: var(--primary); padding-left: 10px; }

        /* --- HERO --- */
        .hero { 
            background: radial-gradient(circle at center, #222 0%, #000 100%); 
            padding: 12rem 1rem 8rem; 
            text-align: center; 
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: clamp(3rem, 10vw, 5rem); margin: 0; letter-spacing: -2px; line-height: 0.9; }
        .hero p { color: var(--primary); letter-spacing: 5px; text-transform: uppercase; font-size: 0.9rem; margin-top: 1rem; }
        
        .text-gradient {
            background: linear-gradient(to bottom, #fff 30%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- MAGAZINE LAYOUT --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 4rem 2rem; }

        .magazine-rack {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: -4rem; /* Overlap into Hero */
            position: relative;
            z-index: 10;
        }

        /* --- FEATURED ISSUE STYLES --- */
        .featured-issue {
            grid-column: 1 / -1; 
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--primary);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(204, 0, 0, 0.2);
            cursor: pointer;
            transition: var(--transition);
            height: 500px; 
        }
        .featured-issue:hover { transform: translateY(-5px); }

        .issue-cover {
            width: 40%;
            height: 100%;
            object-fit: contain;
            background: #000;
            border-right: 1px solid var(--border);
            transition: var(--transition);
        }

        .featured-issue:hover .issue-cover { transform: scale(1.02); }

        .issue-info {
            padding: 3rem;
            display: flex;
            flex-direction: column;
            text-align: left;
            overflow-y: auto; 
            flex: 1;
        }

        .issue-info::-webkit-scrollbar { width: 6px; }
        .issue-info::-webkit-scrollbar-track { background: #0d0d0d; }
        .issue-info::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .race-card {
            background: var(--card-bg);
            padding: 2rem;
            border: 1px solid var(--border);
            transition: var(--transition);
            text-align: left;
        }
        .race-card:hover { border-color: var(--primary); transform: translateY(-5px); }

        .stat-label { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; display: block; margin-bottom: 0.5rem; }
        .btn-primary { background: var(--primary); color: #fff; padding: 10px 20px; text-decoration: none; border: none; font-family: 'Arial Black'; cursor: pointer; letter-spacing: 1px; }

        /* --- READER OVERLAY --- */
        #reader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }

        .flipbook-container { 
            width: 90vw; height: 85vh; 
            max-width: 950px; display: flex; 
            justify-content: center; align-items: center; 
        }

        .page { background: #fff; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .page img { width: 100%; height: 100%; object-fit: contain; }

        .article-text-page {
            padding: 60px 50px;
            background: #fafafa;
            color: #111;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: left;
        }
        .article-content {
            font-family: 'Georgia', serif;
            font-size: 1.25rem;
            line-height: 1.8;
            color: #222;
        }

        #close-btn { position: fixed; top: 2rem; right: 2rem; z-index: 3005; }

        /* --- FOOTER & SOCIALS --- */
        footer { 
            padding: 4rem 1rem; 
            text-align: center; 
            border-top: 1px solid var(--border); 
            color: #333; 
            font-size: 0.8rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 1.5rem; 
        }

        .social-links {
            display: flex;
            gap: 2rem;
            justify-content: center;
        }

        .social-icon {
            color: #555;
            font-size: 1.8rem;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .social-icon:hover { transform: translateY(-3px); }
        .social-icon.facebook:hover { color: #1877F2; } 
        .social-icon.x-twitter:hover { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .social-icon.email:hover { color: var(--primary); }

        /* --- MOBILE ADJUSTMENTS --- */
        @media (max-width: 768px) {
            .featured-issue { flex-direction: column; height: auto; }
            .issue-cover { width: 100%; height: auto; max-height: 60vh; border-right: none; border-bottom: 1px solid var(--border); }
            .magazine-rack { margin-top: 2rem; }
            .issue-info { padding: 2rem; overflow-y: visible; }
            #close-btn { top: auto; bottom: 2rem; right: 50%; transform: translateX(50%); width: 80%; text-align: center; }
            .article-text-page { padding: 30px 20px; align-items: flex-start; overflow-y: auto; }
            .article-content { font-size: 1rem; line-height: 1.5; }
        }
    </style>
</head>

        // --- 3. RENDER LOGIC ---
        function initNews() {
            const grid = document.getElementById('magazine-grid');
            grid.innerHTML = articles.map((art, i) => {
                if(i === 0) {
                    return `
                        <div class="featured-issue" onclick="openReader(${i})">
                            <img src="${art.preview}" class="issue-cover" loading="lazy">
                            <div class="issue-info">
                                <span class="stat-label" style="color:var(--primary)">LATEST EDITION // ${art.date}</span>
                                <h2 style="font-size:2.5rem; margin:1rem 0; line-height:1;">${art.title}</h2>
                                <p style="color:var(--text-muted); margin-bottom:2rem; font-family:sans-serif; line-height:1.5;">${art.teaser}</p>
                                <span class="btn-primary" style="width:fit-content">READ MAGAZINE</span>
                            </div>
                        </div>
                    `;
                }
                return `
                    <div class="race-card" onclick="openReader(${i})" style="cursor:pointer">
                        <span class="stat-label">${art.tag}</span>
                        <h3 style="margin:1rem 0; font-size:1.2rem;">${art.title}</h3>
                        <img src="${art.preview}" style="width:100%; border-radius:4px; margin-bottom:1rem; border:1px solid #333;" loading="lazy">
                        <span class="stat-label" style="color:var(--primary); cursor:pointer;">OPEN ISSUE →</span>
                    </div>
                `;
            }).join('');
        }

        // --- 4. FLIPBOOK LOGIC ---
        let flipBook = null;

        function openReader(idx) {
            const overlay = document.getElementById('reader-overlay');
            const root = document.getElementById('flipbook-root');
            
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            root.innerHTML = `<div id="book-el">
                ${articles[idx].pages.map(content => {
                    if (content.startsWith('http')) {
                        return `<div class="page"><img src="${content}" loading="lazy"></div>`;
                    } 
                    else {
                        const formattedText = content.replace(/\n/g, '<br>');
                        return `<div class="page">
                                    <div class="article-text-page">
                                        <div class="article-content">
                                            ${formattedText}
                                        </div>
                                    </div>
                                </div>`;
                    }
                }).join('')}
            </div>`;

            setTimeout(() => {
                const el = document.getElementById('book-el');
                flipBook = new St.PageFlip(el, {
                    width: 500, height: 650,
                    size: "stretch", minWidth: 315, maxWidth: 950,
                    showCover: articles[idx].pages.length > 1, 
                    drawShadow: true
                });
                
                flipBook.loadFromHTML(el.querySelectorAll('.page'));
                document.getElementById('reader-loading').style.display = 'none';
            }, 300);
        }

        function closeReader() {
            document.getElementById('reader-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
            if (flipBook) flipBook.destroy();
            document.getElementById('reader-loading').style.display = 'block';
        }

        initNews();
    </script>

    <script>
        // 1. Disable Right Click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // 2. Disable Keyboard Shortcuts (Ctrl+U, F12, Ctrl+Shift+I, etc.)
        document.addEventListener('keydown', (e) => {
            // Check for Ctrl (or Command on Mac)
            if (e.ctrlKey || e.metaKey) {
                switch (e.key.toLowerCase()) {
                    case 'u': // View Source
                    case 's': // Save Page
                    case 'a': // Select All
                    case 'c': // Copy
                        e.preventDefault();
                        return false;
                }
                // Check for Ctrl+Shift+I or J (Developer Tools)
                if (e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j')) {
                    e.preventDefault();
                    return false;
                }
            }
            
            // Check for F12 (Developer Tools)
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });
    </script>
