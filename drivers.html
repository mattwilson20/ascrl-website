<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Roster | American Stock Car Racing League</title>
    
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #000;
            --card-bg: #0d0d0d;
            --border: #1a1a1a;
            --text-muted: #a0a0a0;
            --transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            
            /* Series Colors */
            --cup-blue: #0077ff;
            --xfinity-purple: #8000b0;
            --truck-red: #c00;
            --menards-yellow: #fff200;
        }

        body { 
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            background-color: #333333; 
            background-image: 
                radial-gradient(transparent 0%, #000 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.35'/%3E%3C/svg%3E");
            background-attachment: fixed;
            color: #fff; 
            overflow-x: hidden; 
        }

        /* --- NAVIGATION --- */
        #nav-placeholder { position: relative; z-index: 2000; }

        /* --- HERO --- */
        .hero { 
            background: radial-gradient(circle at center, #222 0%, #000 100%); 
            padding: 12rem 1rem 8rem; 
            text-align: center; 
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: clamp(3rem, 10vw, 5rem); margin: 0; letter-spacing: -2px; line-height: 0.9; }
        .hero p { color: var(--primary); letter-spacing: 5px; text-transform: uppercase; font-size: 0.9rem; margin-top: 1rem; }

        /* --- CONTROLS --- */
        .controls { 
            background: #050505; padding: 2rem 1rem; border-bottom: 1px solid var(--border); 
            position: sticky; top: 0; z-index: 100; text-align: center; 
        }
        .tabs-container { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }

        .series-btn {
            background: #111; border: 1px solid #333; color: #fff; 
            padding: 15px 30px; font-family: 'Arial Black', sans-serif; 
            text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px;
            cursor: pointer; transition: var(--transition); min-width: 140px;
        }
        .series-btn:hover { transform: translateY(-3px); }
        .series-btn.active { border-color: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .series-btn[data-series="Cup"].active { background: var(--cup-blue); border-color: var(--cup-blue); }
        .series-btn[data-series="Xfinity"].active { background: var(--xfinity-purple); border-color: var(--xfinity-purple); }
        .series-btn[data-series="Truck"].active { background: var(--truck-red); border-color: var(--truck-red); }
        .series-btn[data-series="Menards"].active { background: var(--menards-yellow); border-color: var(--menards-yellow); color: #000; }

        /* --- DRIVER GRID --- */
        .container { max-width: 1300px; margin: 0 auto; padding: 4rem 1rem; }
        
        .driver-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* --- DRIVER CARD STYLE --- */
        .roster-card {
            background-color: #000;
            border: 1px solid #333;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            height: 400px;
            transition: transform 0.3s, border-color 0.3s;
            cursor: pointer;
        }
        
        .roster-card:hover { transform: translateY(-10px); border-color: var(--primary); }

        .card-image {
            width: 100%; height: 100%;
            background-size: cover; background-position: center top;
            transition: transform 0.5s;
        }
        
        .roster-card:hover .card-image { transform: scale(1.05); }

        .card-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
            padding: 1.5rem; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: flex-end;
            height: 50%;
        }

        .card-number {
            font-size: 3rem; font-weight: 900; color: rgba(255,255,255,0.2); 
            font-style: italic; line-height: 1; margin-bottom: 5px;
            position: absolute; top: 20px; right: 20px; pointer-events: none;
        }

        .card-name { font-size: 1.5rem; margin: 0; line-height: 1; text-transform: uppercase; text-shadow: 0 2px 5px #000; }
        .card-team { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; margin-top: 5px; font-family: sans-serif; }

        /* --- MODAL (Copied from Standings) --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; justify-content: center; align-items: center; }
        .modal-content { background: #0d0d0d; border: 1px solid #333; padding: 0; width: 90%; max-width: 500px; position: relative; border-radius: 8px; overflow: hidden; }
        .close-modal { position: absolute; top: 15px; right: 15px; font-size: 1.5rem; color: #fff; cursor: pointer; z-index: 20; background: rgba(0,0,0,0.5); width: 40px; height: 40px; border-radius: 50%; text-align: center; line-height: 40px; transition: 0.3s; }
        .close-modal:hover { background: var(--primary); }

        .hero-card-modal { display: flex; flex-direction: column; position: relative; min-height: 650px; background-color: #000; }
        .hero-card-header { position: absolute; top: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 10; box-sizing: border-box; }
        .hero-series-badge { background: var(--primary); color: #fff; font-size: 0.8rem; padding: 5px 15px; text-transform: uppercase; font-weight: bold; clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%); }
        .hero-car-number { font-size: 4rem; font-weight: 900; color: rgba(255,255,255,0.2); font-style: italic; }
        .hero-image-container { width: 100%; height: 400px; background-size: cover; background-position: center top; background-repeat: no-repeat; position: relative; margin-top: 50px; }
        .hero-image-container::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(to top, #0d0d0d 0%, transparent 100%); }
        .hero-details { padding: 1.5rem; text-align: center; background: #0d0d0d; position: relative; z-index: 5; margin-top: -50px; }
        .hero-name { font-size: 1.8rem; margin: 0; line-height: 1; text-transform: uppercase; }
        .hero-team { color: var(--primary); font-family: sans-serif; font-size: 0.9rem; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        .hero-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px 5px; margin-top: 1.5rem; border-top: 1px solid #333; padding-top: 1.5rem; }
        .hero-stat-box { display: flex; flex-direction: column; }
        .stat-val { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .stat-lbl { font-size: 0.6rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }

        .badge-Cup { background: var(--cup-blue); }
        .badge-Xfinity { background: var(--xfinity-purple); }
        .badge-Truck { background: var(--truck-red); }
        .badge-Menards { background: var(--menards-yellow); color: #000; }

        /* Spinner */
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Footer */
        footer { padding: 4rem 1rem; text-align: center; border-top: 1px solid var(--border); color: #333; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
        .social-links { display: flex; gap: 2rem; justify-content: center; }
        .social-icon { color: #555; font-size: 1.8rem; transition: 0.3s ease; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .social-icon:hover { transform: translateY(-3px); }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="spinner"></div></div>
    <div id="nav-placeholder"></div>

    <header class="hero">
        <p>Season 2025-26</p>
        <h1>DRIVER ROSTER</h1>
    </header>

    <div class="controls">
        <div class="tabs-container">
            <button class="series-btn active" data-series="Cup" onclick="switchSeries('Cup')">Cup Series</button>
            <button class="series-btn" data-series="Xfinity" onclick="switchSeries('Xfinity')">Xfinity</button>
            <button class="series-btn" data-series="Truck" onclick="switchSeries('Truck')">Trucks</button>
            <button class="series-btn" data-series="Menards" onclick="switchSeries('Menards')">Menards</button>
        </div>
    </div>

    <main class="container">
        <h2 id="series-title" style="text-align:center; margin-bottom:2rem; font-size:1.5rem; color:#666;">CUP SERIES DRIVERS</h2>
        <div class="driver-grid" id="roster-grid">
            </div>
    </main>

    <div id="driverModal" class="modal" onclick="closeDriverModal(event)">
        <div class="modal-content">
            <div class="close-modal" onclick="document.getElementById('driverModal').style.display='none'">&times;</div>
            <div class="hero-card-modal">
                <div class="hero-card-header">
                    <div id="modal-series-badge" class="hero-series-badge">SERIES</div>
                    <div id="modal-number" class="hero-car-number">00</div>
                </div>
                
                <div id="modal-image" class="hero-image-container"></div>
                
                <div class="hero-details">
                    <h2 id="modal-name" class="hero-name">Driver Name</h2>
                    <div id="modal-team" class="hero-team">Team Name</div>
                    
                    <div class="hero-stats-grid">
                        <div class="hero-stat-box"><span id="modal-points" class="stat-val">0</span><span class="stat-lbl">Points</span></div>
                        <div class="hero-stat-box"><span id="modal-behind" class="stat-val">--</span><span class="stat-lbl">Behind</span></div>
                        <div class="hero-stat-box"><span id="modal-starts" class="stat-val">0</span><span class="stat-lbl">Starts</span></div>
                        <div class="hero-stat-box"><span id="modal-wins" class="stat-val">0</span><span class="stat-lbl">Wins</span></div>
                        <div class="hero-stat-box"><span id="modal-top5" class="stat-val">0</span><span class="stat-lbl">Top 5</span></div>
                        <div class="hero-stat-box"><span id="modal-top10" class="stat-val">0</span><span class="stat-lbl">Top 10</span></div>
                        <div class="hero-stat-box"><span id="modal-poles" class="stat-val">0</span><span class="stat-lbl">Poles</span></div>
                        <div class="hero-stat-box"><span id="modal-avg" class="stat-val">0</span><span class="stat-lbl">Avg Fin</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div style="margin-bottom: 0.5rem; letter-spacing: 2px; color: #fff;">
            © 2025-2026 AMERICAN STOCK CAR RACING LEAGUE
        </div>
        <div style="font-size: 0.65rem; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 2rem; text-transform: uppercase;">
            OWNED AND OPERATED BY <span style="color: #fff; font-weight: bold;">A&M PRODUCTIONS LLC</span>
        </div>
        <div class="social-links">
            <a href="https://www.facebook.com/share/14PeZVCH1hL/" target="_blank" class="social-icon facebook"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://x.com/ASCRWeekly" target="_blank" class="social-icon x-twitter"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="mailto:contact.ascrl@gmail.com" class="social-icon email"><i class="fa-solid fa-envelope"></i></a>
        </div>
    </footer>

    <script>
        const STANDINGS_FILE = 'drivers.json';
        let rawData = {}; 
        let currentSeries = 'Cup';

        // 1. NAVIGATION
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                // Highlight Driver Link if it exists in nav
                const activeLink = document.getElementById('nav-drivers');
                if (activeLink) {
                    activeLink.style.color = "var(--primary)";
                    activeLink.style.borderLeft = "4px solid var(--primary)";
                    activeLink.style.paddingLeft = "15px";
                }
            });

        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            if(menu) menu.classList.toggle('open');
        }

        // --- HELPER: GET DRIVER IMAGE ---
        function getDriverImage(driverName) {
            const nameLower = driverName.toLowerCase();
            if (nameLower.includes('dakotathomas1994')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/720d39d80f598430f8f4d7aa2a03360db2627230/IMG_7125.jpg";
            if (nameLower.includes('orangeman96')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/70b5243e68e9c7f7a596f6695677d8d3520e89e1/IMG_7160.jpg";
            if (nameLower.includes('ant_was_he')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/602e91f22a89c294308d1e79473121daa8e777e7/ant_was_he_hero_card.jpg";
            if (nameLower.includes('c0mpl1c8ted')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/099805ff88fcc2ba2a1cc2e8b5aba8f515a716a6/C0mpl1c8ted_hero_card.jpg";
            if (nameLower.includes('on-a-mission')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/446d56688b6fdf55420d2c5e52b6a764e873fab6/Mission_Hero_card.jpg";
            if (nameLower.includes('banishedcrayon')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/d42bcd32df90441f1b5f24da75a77074ea2186fe/Banished_Crayon_hero_Card.jpg";
            if (nameLower.includes('sithwarrioruno')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/3e992547a13fe5d73940648e83df80d97df41f90/SithWarriorUno_Hero_Card.jpg";
            if (nameLower.includes('majorblaze33')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/77807b78b078188862cb490d2b95d2f846d237bf/Blaze_Hero_Card.jpg";
            if (nameLower.includes('thereaperrhino')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/6ba07383a20109b63eec703c34fedc30f7a191bf/Rhino_Hero_Card.jpg";
            if (nameLower.includes('daltongregson')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/ec988478a8132f49d9d6b596e7ed258e2c2dd482/DaltonGregson_Hero_Card.jpg";
            if (nameLower.includes('singular_nacho')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/f311b21127533ca6128a4408f36edaf9612d59b1/Singular_Nacho_Hero_Card.jpg";
            if (nameLower.includes('callmemillion')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/e86926900f4957c57588db9a14beae7d6329a794/CallMeMillion_Hero_Card.jpg";
            if (nameLower.includes('mattwilson20')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/6686ee35c988cd1b0ae305d099ff4e31c652a49f/mattwilson20_Hero_Card.jpg";
            if (nameLower.includes('hockeydeckout')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/81df81de5161ea2f590ee32c370d3e99675cdbaa/Hockey_Hero_Card.png";
            
            return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/ad657026d44e8f66292dddbee7b21b0568631461/1766598509726.jpg";
        }

        // 2. INITIALIZE
        async function init() {
            try {
                const res = await fetch(STANDINGS_FILE);
                if (!res.ok) throw new Error("Drivers file not found.");
                rawData = await res.json();
                
                renderRoster();
                document.getElementById('loading-screen').style.opacity = 0;
                setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
            } catch (err) {
                document.getElementById('loading-screen').style.display = 'none';
                console.error(err);
            }
        }

        // 3. SWITCH SERIES
        function switchSeries(seriesName) {
            currentSeries = seriesName;
            document.getElementById('series-title').innerText = seriesName.toUpperCase() + " SERIES DRIVERS";
            
            document.querySelectorAll('.series-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.series === seriesName) btn.classList.add('active');
            });
            renderRoster();
        }

        // 4. RENDER ROSTER
        function renderRoster() {
            const grid = document.getElementById('roster-grid');
            grid.innerHTML = '';

            let drivers = Object.entries(rawData).map(([id, data]) => ({ id, ...data }));
            drivers = drivers.filter(d => d.series && d.series[currentSeries]);
            
            // Sort alphabetically by name
            drivers.sort((a, b) => a.display_name.localeCompare(b.display_name));

            if (drivers.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#666;">No drivers found for this series.</p>';
                return;
            }

            drivers.forEach(driver => {
                const sData = driver.series[currentSeries];
                let teamName = sData.team;
                if (!teamName || teamName === "" || teamName === "null") teamName = "Independent";
                
                const imgUrl = getDriverImage(driver.display_name);

                const card = document.createElement('div');
                card.className = 'roster-card';
                card.onclick = () => openDriverModal(driver.id);
                
                card.innerHTML = `
                    <div class="card-image" style="background-image: url('${imgUrl}');"></div>
                    <div class="card-number">${sData.number}</div>
                    <div class="card-overlay">
                        <h3 class="card-name">${driver.display_name}</h3>
                        <div class="card-team">${teamName}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 5. MODAL LOGIC (Reused from Standings)
        function openDriverModal(driverId) {
            const driver = rawData[driverId];
            if (!driver) return;

            const sData = driver.series[currentSeries];
            if (!sData) return;

            // Recalculate Leader Points to determine "Behind"
            let driversList = Object.values(rawData).filter(d => d.series && d.series[currentSeries]);
            driversList.sort((a, b) => (b.series[currentSeries].stats.points || 0) - (a.series[currentSeries].stats.points || 0));
            const leaderPoints = driversList[0].series[currentSeries].stats.points || 0;
            
            let behind = leaderPoints - sData.stats.points;
            if (behind === 0 && driversList[0].display_name === driver.display_name) behind = "--";
            else behind = "-" + behind;

            // Populate Modal
            document.getElementById('modal-name').innerText = driver.display_name;
            document.getElementById('modal-team').innerText = sData.team || "Independent";
            document.getElementById('modal-number').innerText = sData.number;
            document.getElementById('modal-series-badge').innerText = currentSeries + " SERIES";
            const badge = document.getElementById('modal-series-badge');
            badge.className = `hero-series-badge badge-${currentSeries}`;

            // Populate Stats
            document.getElementById('modal-points').innerText = sData.stats.points;
            document.getElementById('modal-behind').innerText = behind;
            document.getElementById('modal-starts').innerText = sData.stats.starts;
            document.getElementById('modal-wins').innerText = sData.stats.wins;
            document.getElementById('modal-top5').innerText = sData.stats.top5;
            document.getElementById('modal-top10').innerText = sData.stats.top10;
            document.getElementById('modal-poles').innerText = sData.stats.poles || 0;
            document.getElementById('modal-avg').innerText = sData.stats.avg ? sData.stats.avg.toFixed(1) : '-';

            const imgUrl = getDriverImage(driver.display_name);
            document.getElementById('modal-image').style.backgroundImage = `url('${imgUrl}')`;

            document.getElementById('driverModal').style.display = 'flex';
        }

        function closeDriverModal(e) {
            if (e.target.id === 'driverModal') document.getElementById('driverModal').style.display = 'none';
        }

        init();
    </script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (['u','s','a','c'].includes(e.key.toLowerCase())) return e.preventDefault();
                if (e.shiftKey && ['i','j'].includes(e.key.toLowerCase())) return e.preventDefault();
            }
            if (e.key === 'F12') return e.preventDefault();
        });
    </script>

</body>
</html>
