<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL Roster | American Stock Car Racing League</title>
    
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #000;
            --card-bg: #0d0d0d;
            --border: #1a1a1a;
            --text-muted: #a0a0a0;
            --transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);

            /* Series Colors */
            --cup-blue: #0077ff;
            --xfinity-purple: #8000b0;
            --truck-red: #c00;
            --menards-yellow: #fff200;
        }

        body { 
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            background-color: #333333; 
            background-image: 
                radial-gradient(transparent 0%, #000 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.35'/%3E%3C/svg%3E");
            background-attachment: fixed;
            color: #fff; 
            overflow-x: hidden; 
        }

        /* --- MODULAR NAVIGATION STYLES --- */
        #nav-placeholder { position: relative; z-index: 99999; }
        
        .nav-overlay { 
            position: fixed; top: 0; left: -100%; width: 100%; max-width: 350px; 
            height: 100vh; background: #050505; transition: left 0.5s ease; 
            z-index: 100000; padding-top: 100px; border-right: 1px solid var(--primary); 
        }
        .nav-overlay.open { left: 0; }
        .nav-links { display: flex; flex-direction: column; padding: 0 3rem; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-size: 1.2rem; padding: 1.2rem 0; 
            border-bottom: 1px solid var(--border); transition: var(--transition); letter-spacing: 2px; 
        }
        .nav-links a:hover { color: var(--primary); padding-left: 10px; }

        /* --- HERO --- */
        .hero { 
            background: radial-gradient(circle at center, #222 0%, #000 100%); 
            padding: 12rem 1rem 8rem; 
            text-align: center; 
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: clamp(3rem, 10vw, 5rem); margin: 0; letter-spacing: -2px; line-height: 0.9; }
        .hero p { color: var(--primary); letter-spacing: 5px; text-transform: uppercase; font-size: 0.9rem; margin-top: 1rem; }

        /* --- SERIES TABS --- */
        .controls { background: #050505; padding: 2rem 1rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .series-btn {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 15px 30px;
            font-family: 'Arial Black', sans-serif;
            text-transform: uppercase;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            min-width: 150px;
            position: relative;
            overflow: hidden;
        }

        .series-btn:hover { transform: translateY(-3px); }
        .series-btn.active { border-color: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        .series-btn[data-series="Cup"].active { background: var(--cup-blue); border-color: var(--cup-blue); }
        .series-btn[data-series="Xfinity"].active { background: var(--xfinity-purple); border-color: var(--xfinity-purple); }
        .series-btn[data-series="Truck"].active { background: var(--truck-red); border-color: var(--truck-red); }
        .series-btn[data-series="Menards"].active { background: var(--menards-yellow); border-color: var(--menards-yellow); color: #000; }

        /* --- ROSTER GRID --- */
        .container { max-width: 1400px; margin: 0 auto; padding: 4rem 2rem; }
        .roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }

        .driver-card {
            background-color: #111;
            border: 1px solid #222;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; 
            min-height: 450px; 
            cursor: pointer;
        }

        .card-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            z-index: 0; 
            transition: transform 0.3s ease;
        }

        .driver-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.95) 90%);
            z-index: 1; 
        }

        .driver-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(204, 0, 0, 0.2);
        }

        .cup-hover:hover { border-color: var(--cup-blue) !important; box-shadow: 0 10px 30px rgba(0, 119, 255, 0.2); }
        .xfinity-hover:hover { border-color: var(--xfinity-purple) !important; box-shadow: 0 10px 30px rgba(128, 0, 176, 0.2); }
        .truck-hover:hover { border-color: var(--truck-red) !important; box-shadow: 0 10px 30px rgba(204, 0, 0, 0.2); }
        .menards-hover:hover { border-color: var(--menards-yellow) !important; box-shadow: 0 10px 30px rgba(255, 242, 0, 0.2); }

        .bg-number {
            position: absolute;
            top: 10px;
            right: 15px; 
            font-size: 3.5rem; 
            font-weight: 900;
            color: rgba(255, 255, 255, 0.25); 
            z-index: 2; 
            line-height: 1;
            pointer-events: none;
        }

        .card-content {
            position: relative;
            z-index: 3; 
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .win-flags-container {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
            min-height: 24px;
        }

        .flag-icon { font-size: 1.2rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,1)); }
        
        .flag-cup { color: var(--cup-blue); }
        .flag-xfinity { color: var(--xfinity-purple); }
        .flag-truck { color: var(--truck-red); }
        .flag-menards { color: var(--menards-yellow); }

        .driver-name {
            font-size: 1.5rem; 
            margin: 0 0 0.5rem;
            line-height: 1.1;
            word-wrap: break-word;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            width: 100%;
        }

        .team-name {
            font-family: sans-serif;
            font-size: 0.85rem;
            color: #ddd;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            text-shadow: 0 2px 5px rgba(0,0,0,1);
        }

        /* --- CHAMPION BADGES (NEW) --- */
        .badge-container {
            display: flex;
            gap: 5px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .champ-badge {
            background: linear-gradient(45deg, #ffd700, #b8860b);
            color: #000;
            font-size: 0.6rem;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            border: 1px solid #fff;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .stats-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.8);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #fff;
            margin-top: auto;
            backdrop-filter: blur(5px);
        }
        .stat-divider { width: 1px; height: 12px; background: #666; }

        /* --- PROFESSIONAL PROFILE MODAL STYLES --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 3000; overflow-y: auto; }
        .modal-content { 
            background: #0d0d0d; margin: 2rem auto; width: 95%; max-width: 1000px; 
            border: 1px solid var(--primary); position: relative; min-height: 500px;
        }
        .close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; z-index: 20; text-shadow: 0 0 10px #000; }
        
        /* Profile Hero */
        .p-hero { display: flex; flex-wrap: wrap; background: linear-gradient(135deg, #111, #000); border-bottom: 4px solid var(--primary); padding: 40px; align-items: center; gap: 40px; }
        .p-img-container { width: 200px; height: 260px; position: relative; flex-shrink: 0; border: 1px solid #333; overflow: hidden; background: #000; }
        .p-img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
        .p-info { flex: 1; position: relative; }
        .p-number { font-size: 6rem; line-height: 1; color: rgba(255,255,255,0.05); font-weight: 900; position: absolute; right: 10px; top: -20px; z-index: 0; }
        .p-name { font-size: 3rem; line-height: 1; margin: 0; text-transform: uppercase; position: relative; z-index: 1; }
        .p-team { font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; display: block; position: relative; z-index: 1; font-weight: bold; }
        
        /* Stats Tabs */
        .p-tabs { display: flex; background: #1a1a1a; border-bottom: 1px solid #333; }
        .p-tab-btn { flex: 1; background: transparent; border: none; color: #888; padding: 20px; cursor: pointer; font-family: 'Arial Black'; font-size: 0.9rem; text-transform: uppercase; transition: 0.3s; }
        .p-tab-btn:hover { background: #222; color: #fff; }
        .p-tab-btn.active { background: #0d0d0d; color: #fff; border-bottom: 3px solid var(--primary); }

        /* Tables */
        .p-panel { display: none; padding: 30px; }
        .p-panel.active { display: block; animation: fadeIn 0.3s; }
        
        .stat-table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 0.9rem; }
        .stat-table th { text-align: left; color: #666; padding: 15px; border-bottom: 2px solid #333; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px; }
        .stat-table td { padding: 15px; border-bottom: 1px solid #222; color: #ddd; }
        .stat-table tr:hover { background: #141414; }
        .st-year { font-weight: bold; color: var(--primary); font-family: 'Arial Black'; }
        .st-points { color: var(--accent); font-weight: bold; }

        /* --- BINDER COLLECTION STYLES (NEW) --- */
        .binder-page {
            background-color: #f4f4f4;
            padding: 20px;
            border-radius: 5px;
            min-height: 400px;
            display: flex;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }
        
        .binder-holes {
            width: 40px;
            border-right: 1px solid #ccc;
            margin-right: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }
        .hole { width: 15px; height: 15px; background: #333; border-radius: 50%; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8); }

        .binder-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            align-content: flex-start;
        }

        .mini-card {
            aspect-ratio: 5/7;
            background: #fff;
            border: 1px solid #ccc;
            position: relative;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
        }
        .mini-card:hover { transform: scale(1.05); z-index: 10; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); }
        .mini-card img { width: 100%; height: 100%; object-fit: cover; }

        .achievement-card {
            background: linear-gradient(135deg, #000, #222);
            border: 2px solid #ffd700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            color: #ffd700;
        }
        .shiny-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- FOOTER & SOCIALS --- */
        footer { 
            padding: 4rem 1rem; 
            text-align: center; 
            border-top: 1px solid var(--border); 
            color: #333; 
            font-size: 0.8rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 1.5rem; 
        }

        .social-links { display: flex; gap: 2rem; justify-content: center; }
        .social-icon { color: #555; font-size: 1.8rem; transition: 0.3s ease; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .social-icon:hover { transform: translateY(-3px); }
        .social-icon.facebook:hover { color: #1877F2; } 
        .social-icon.x-twitter:hover { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        @media (max-width: 768px) {
            .hero { padding: 10rem 1rem 4rem; }
            .series-btn { width: 45%; padding: 10px; font-size: 0.8rem; }
            
            /* Modal Mobile */
            .p-hero { flex-direction: column; text-align: center; padding: 20px; }
            .p-img-container { margin: 0 auto; width: 150px; height: 180px; }
            .p-number { font-size: 4rem; top: 10px; right: 10px; opacity: 0.3; }
            .p-name { font-size: 2rem; }
            .badge-container { justify-content: center; }
            .stat-table { font-size: 0.8rem; }
            .stat-table th, .stat-table td { padding: 10px 5px; }
            /* Hide less important columns on mobile */
            .stat-table th:nth-child(5), .stat-table td:nth-child(5), 
            .stat-table th:nth-child(6), .stat-table td:nth-child(6) { display: none; }
            
            .binder-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <header class="hero">
        <p>Official League Roster</p>
        <h1>THE GRID</h1>
        <p style="color:#666; font-size:0.8rem; margin-top:5px;">2026 SEASON</p>
    </header>

    <div class="controls">
        <div class="tabs-container">
            <button class="series-btn active" data-series="Cup" onclick="filterSeries('Cup')">Cup Series</button>
            <button class="series-btn" data-series="Xfinity" onclick="filterSeries('Xfinity')">Xfinity</button>
            <button class="series-btn" data-series="Truck" onclick="filterSeries('Truck')">Trucks</button>
            <button class="series-btn" data-series="Menards" onclick="filterSeries('Menards')">Menards</button>
        </div>
    </div>

    <main class="container">
        <div id="roster-grid" class="roster"></div>
    </main>

    <div id="driver-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-inject">
                </div>
        </div>
    </div>

     <footer>
        <div style="margin-bottom: 0.5rem; letter-spacing: 2px; color: #fff;">
            © 2025-2026 AMERICAN STOCK CAR RACING LEAGUE
        </div>
        
        <div style="font-size: 0.65rem; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 2rem; text-transform: uppercase;">
            OWNED AND OPERATED BY <span style="color: #fff; font-weight: bold;">A&M PRODUCTIONS LLC</span>
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/share/14PeZVCH1hL/" target="_blank" class="social-icon facebook" aria-label="Facebook">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="https://x.com/ASCRWeekly" target="_blank" class="social-icon x-twitter" aria-label="X (Twitter)">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            
            <a href="mailto:contact.ascrl@gmail.com" class="social-icon email" aria-label="Email A&M Productions">
                <i class="fa-solid fa-envelope"></i>
            </a>
        </div>
        
        <div style="font-size: 0.6rem; color: #444; margin-top: 20px; font-style: italic;">*ai generated images may be used</div>
    </footer>

    <script>
        // --- 1. MODULAR NAVIGATION LOGIC ---
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                const currentPage = window.location.pathname.split("/").pop() || "index.html";
                const navID = "nav-" + currentPage.split(".")[0];
                const activeLink = document.getElementById(navID);
                if (activeLink) {
                    activeLink.style.color = "var(--primary)";
                    activeLink.style.borderLeft = "4px solid var(--primary)";
                    activeLink.style.paddingLeft = "15px";
                }
            })
            .catch(err => console.error("Nav load error:", err));

        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            if (menu) menu.classList.toggle('open');
        }

        // --- 2. ROSTER LOGIC ---
        let allDriversData = {}; 
        let currentSeries = 'Cup';

        document.addEventListener('DOMContentLoaded', () => {
            loadDrivers(); 
        });

        function loadDrivers() {
            const grid = document.getElementById('roster-grid');
            grid.innerHTML = '<p style="text-align:center; padding:2rem; color:#666;">Accessing Data Feed...</p>';
            
            // Only fetching drivers.json as requested
            fetch("drivers.json")
                .then(r => r.json())
                .then(data => {
                    allDriversData = data; 
                    filterSeries('Cup'); 
                })
                .catch(err => {
                    console.error(err);
                    grid.innerHTML = `<p style="text-align:center; padding:2rem; color:#c00;">Unable to load roster.</p>`;
                });
        }

        function filterSeries(seriesName) {
            currentSeries = seriesName;
            
            // Update Buttons UI
            document.querySelectorAll('.series-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.series === seriesName) btn.classList.add('active');
            });

            const grid = document.getElementById('roster-grid');
            grid.innerHTML = '';

            const filteredList = [];

            // Iterate through the Dictionary
            for (const [id, driverInfo] of Object.entries(allDriversData)) {
                let dName = driverInfo.display_name || id;

                if (driverInfo.series) {
                    const sKey = Object.keys(driverInfo.series).find(k => k.toLowerCase() === seriesName.toLowerCase());
                    
                    if (sKey) {
                        const sData = driverInfo.series[sKey];
                        filteredList.push({
                            id: id,
                            name: dName,
                            fullData: driverInfo,
                            seriesData: sData, 
                            seriesName: sKey,
                            badges: driverInfo.badges || []
                        });
                    }
                }
            }

            // Sort by Points
            filteredList.sort((a, b) => {
                const statsA = a.seriesData.current_stats || {points:0};
                const statsB = b.seriesData.current_stats || {points:0};
                
                const ptsA = statsA.points || 0;
                const ptsB = statsB.points || 0;
                
                if(ptsA !== ptsB) return ptsB - ptsA;
                return a.name.localeCompare(b.name);
            });

            if (filteredList.length === 0) {
                grid.innerHTML = '<p style="text-align:center; padding:2rem; width:100%; grid-column: 1/-1;">No drivers registered for this series yet.</p>';
                return;
            }

            const maxPoints = Math.max(...filteredList.map(i => {
                const s = i.seriesData.current_stats || {points:0};
                return s.points || 0;
            }));

            // Render Cards
            filteredList.forEach(item => {
                const sData = item.seriesData;
                const stats = sData.current_stats || {points:0, wins:0};
                const points = stats.points || 0;
                const wins = stats.wins || 0;
                
                let carNum = sData.number;
                if (!carNum || carNum === "N/A") {
                      const match = (item.name).match(/^#(\d+)/);
                      carNum = match ? match[1] : '';
                }

                const driverImage = getDriverImage(item.name);

                // Checkered Flags
                let flagsHtml = '';
                let flagClass = 'flag-truck'; 
                if(seriesName.toLowerCase() === 'cup') flagClass = 'flag-cup';
                if(seriesName.toLowerCase() === 'xfinity') flagClass = 'flag-xfinity';
                if(seriesName.toLowerCase() === 'menards') flagClass = 'flag-menards';

                for(let i=0; i<wins; i++) {
                    flagsHtml += `<i class="fa-solid fa-flag-checkered flag-icon ${flagClass}"></i>`;
                }

                // Badges HTML
                let badgesHtml = '';
                if(item.badges && item.badges.length > 0) {
                    badgesHtml = '<div class="badge-container">';
                    item.badges.forEach(b => {
                        badgesHtml += `<div class="champ-badge"><i class="fa-solid fa-trophy"></i> ${b}</div>`;
                    });
                    badgesHtml += '</div>';
                }

                const isLeader = (points > 0 && points === maxPoints);
                const hoverClass = seriesName.toLowerCase() + '-hover';

                const card = document.createElement('div');
                card.className = `driver-card ${hoverClass}`;
                card.onclick = () => openProfile(item.id, item.fullData);
                
                card.innerHTML = `
                    <img src="${driverImage}" alt="${item.name} Driver Card" class="card-bg-img" loading="lazy">
                    <div class="bg-number">${carNum}</div>
                    
                    <div class="card-content">
                        <div class="win-flags-container">
                            ${flagsHtml}
                        </div>

                        ${isLeader ? '<i class="fa-solid fa-crown" style="color:#ffd700; font-size:1.5rem; margin-bottom:0.5rem; display:block; filter: drop-shadow(0 2px 4px #000);"></i>' : ''}
                        
                        <h3 class="driver-name">${item.name}</h3>
                        <div class="team-name">${sData.team || 'Independent'}</div>
                        
                        ${badgesHtml} 

                        <div class="stats-pill">
                            <span>#${carNum}</span>
                            <div class="stat-divider"></div>
                            <span>${points} PTS</span>
                            <div class="stat-divider"></div>
                            <span>${wins} WINS</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- 3. PROFESSIONAL PROFILE MODAL LOGIC (With Collection Tab) ---
        function openProfile(id, driverData) {
            const modal = document.getElementById('driver-modal');
            const dataDiv = document.getElementById('modal-inject');
            
            let dName = driverData.display_name;
            if (!dName) dName = id.replace(/^#\d+\s+/, '').trim();

            // Get Current Series Data
            const sData = driverData.series[currentSeries];
            const currStats = sData.current_stats || {points:0, wins:0, top5:0, top10:0, poles:0, starts:0, avg:0};
            
            // Build Badges
            let badgesHtml = '';
            let collectionCards = '';

            // 1. Add Main Hero Card to Collection
            collectionCards += `
                <div class="mini-card" title="${dName} - ${currentSeries} Card">
                    <img src="${getDriverImage(dName)}">
                    <div class="shiny-overlay"></div>
                </div>
            `;

            if(driverData.badges) {
                driverData.badges.forEach(b => {
                    // Profile Header Badge
                    badgesHtml += `<div class="champ-badge"><i class="fa-solid fa-trophy"></i> ${b}</div>`;
                    
                    // Collection "Achievement Card"
                    collectionCards += `
                        <div class="mini-card achievement-card" title="${b}">
                            <i class="fa-solid fa-trophy" style="font-size:3rem; margin-bottom:15px; color:#ffd700;"></i>
                            <div style="font-size:0.7rem; font-weight:bold; line-height:1.2; text-transform:uppercase;">${b}</div>
                            <div class="shiny-overlay"></div>
                        </div>
                    `;
                });
            }

            // Build History Rows
            let historyRows = '';
            if (sData.history && Array.isArray(sData.history)) {
                sData.history.forEach(h => {
                    let hStats = h.stats;
                    historyRows += `
                    <tr>
                        <td class="st-year">${h.season}</td>
                        <td>${currentSeries}</td>
                        <td class="st-points">${hStats.points}</td>
                        <td>${hStats.wins}</td>
                        <td>${hStats.top5}</td>
                        <td>${hStats.top10}</td>
                        <td>${hStats.avg}</td>
                    </tr>`;
                });
            } else {
                 historyRows = `<tr><td colspan="7" style="text-align:center; padding:20px; color:#666;">No historical data available.</td></tr>`;
            }

            // Build HTML
            const html = `
                <div class="p-hero">
                    <div class="p-img-container">
                        <img src="${getDriverImage(dName)}" class="p-img">
                    </div>
                    <div class="p-info">
                        <div class="p-number">${sData.number}</div>
                        <div class="p-badges" style="margin-bottom:10px; display:flex; gap:5px;">${badgesHtml}</div>
                        <span class="p-team">${sData.team} // #${sData.number} ${sData.manufacturer || 'N/A'}</span>
                        <h1 class="p-name">${dName}</h1>
                    </div>
                </div>

                <div class="p-tabs">
                    <button class="p-tab-btn active" onclick="switchModalTab('season')">Current Season</button>
                    <button class="p-tab-btn" onclick="switchModalTab('career')">Career History</button>
                    <button class="p-tab-btn" onclick="switchModalTab('collection')">Collection</button>
                </div>

                <div id="mod-tab-season" class="p-panel active">
                    <h3 style="border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:20px; color:#fff;">2026 SEASON STATS</h3>
                    <table class="stat-table">
                        <tr>
                            <th>Starts</th>
                            <th>Wins</th>
                            <th>Top 5</th>
                            <th>Top 10</th>
                            <th>Poles</th>
                            <th>Avg Fin</th>
                            <th>Points</th>
                        </tr>
                        <tr>
                            <td>${currStats.starts}</td>
                            <td>${currStats.wins}</td>
                            <td>${currStats.top5}</td>
                            <td>${currStats.top10}</td>
                            <td>${currStats.poles}</td>
                            <td>${currStats.avg}</td>
                            <td class="st-points" style="font-size:1.5rem;">${currStats.points}</td>
                        </tr>
                    </table>
                </div>

                <div id="mod-tab-career" class="p-panel">
                    <h3 style="border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:20px; color:#fff;">CAREER RESULTS</h3>
                    <table class="stat-table">
                        <thead>
                            <tr>
                                <th>Year</th>
                                <th>Series</th>
                                <th>Points</th>
                                <th>Wins</th>
                                <th>Top 5</th>
                                <th>Top 10</th>
                                <th>Avg Fin</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="st-year">2026</td>
                                <td>${currentSeries}</td>
                                <td class="st-points">${currStats.points}</td>
                                <td>${currStats.wins}</td>
                                <td>${currStats.top5}</td>
                                <td>${currStats.top10}</td>
                                <td>${currStats.avg}</td>
                            </tr>
                            ${historyRows}
                        </tbody>
                    </table>
                </div>

                <div id="mod-tab-collection" class="p-panel">
                    <h3 style="border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:20px; color:#fff;">DRIVER BINDER</h3>
                    <div class="binder-page">
                        <div class="binder-holes">
                            <div class="hole"></div><div class="hole"></div><div class="hole"></div>
                        </div>
                        <div class="binder-grid">
                            ${collectionCards}
                        </div>
                    </div>
                </div>
            `;

            dataDiv.innerHTML = html;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('driver-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function switchModalTab(tab) {
            document.querySelectorAll('.p-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.p-tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('mod-tab-'+tab).classList.add('active');
            event.target.classList.add('active');
        }

        window.onclick = function(e) {
            if (e.target.className === 'modal') closeModal();
        }

        // 1. Disable Right Click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // 2. Disable Keyboard Shortcuts (Ctrl+U, F12, Ctrl+Shift+I, etc.)
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key.toLowerCase()) {
                    case 'u': case 's': case 'a': case 'c': e.preventDefault(); return false;
                }
                if (e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j')) {
                    e.preventDefault(); return false;
                }
            }
            if (e.key === 'F12') { e.preventDefault(); return false; }
        });
    </script>
