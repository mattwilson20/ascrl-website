<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL Roster | American Stock Car Racing League</title>
    
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #000;
            --card-bg: #0d0d0d;
            --border: #1a1a1a;
            --text-muted: #a0a0a0;
            --transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            
            /* Series Colors */
            --cup-blue: #0077ff;
            --xfinity-purple: #8000b0;
            --truck-red: #c00;
            --menards-yellow: #fff200;

            /* 3D BINDER ASSETS */
            --binder-texture: url("https://www.transparenttextures.com/patterns/leather.png");
            --gold-foil: linear-gradient(45deg, #ffd700, #ffcc00, #ffeb3b, #d4af37);
            --stitch-color: rgba(255, 255, 255, 0.3);
        }

        body { 
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            background-color: #333333; 
            background-image: 
                radial-gradient(transparent 0%, #000 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.35'/%3E%3C/svg%3E");
            background-attachment: fixed;
            color: #fff; 
            overflow-x: hidden; 
        }

        #nav-placeholder { position: relative; z-index: 99999; }

        /* --- HERO --- */
        .hero { 
            background: radial-gradient(circle at center, #222 0%, #000 100%); 
            padding: 12rem 1rem 8rem; 
            text-align: center; 
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: clamp(3rem, 10vw, 5rem); margin: 0; letter-spacing: -2px; line-height: 0.9; }
        .hero p { color: var(--primary); letter-spacing: 5px; text-transform: uppercase; font-size: 0.9rem; margin-top: 1rem; }

        /* --- CONTROLS --- */
        .controls { background: #050505; padding: 2rem 1rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .tabs-container { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        
        .series-btn {
            background: #111; border: 1px solid #333; color: #fff; padding: 15px 30px;
            font-family: 'Arial Black', sans-serif; text-transform: uppercase; font-size: 1rem;
            letter-spacing: 1px; cursor: pointer; transition: var(--transition); min-width: 150px;
        }
        .series-btn:hover { transform: translateY(-3px); }
        .series-btn.active { border-color: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .series-btn[data-series="Cup"].active { background: var(--cup-blue); border-color: var(--cup-blue); }
        .series-btn[data-series="Xfinity"].active { background: var(--xfinity-purple); border-color: var(--xfinity-purple); }
        .series-btn[data-series="Truck"].active { background: var(--truck-red); border-color: var(--truck-red); }
        .series-btn[data-series="Menards"].active { background: var(--menards-yellow); border-color: var(--menards-yellow); color: #000; }

        /* --- ROSTER GRID --- */
        .container { max-width: 1400px; margin: 0 auto; padding: 4rem 2rem; }
        .roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }

        .driver-card {
            background-color: #111; border: 1px solid #222; padding: 2rem; position: relative;
            overflow: hidden; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end; 
            min-height: 450px; cursor: pointer;
        }
        .card-bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; z-index: 0; }
        .driver-card::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.95) 90%); z-index: 1; }
        .driver-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(204, 0, 0, 0.2); }
        
        /* Card Internals */
        .bg-number { position: absolute; top: 10px; right: 15px; font-size: 3.5rem; font-weight: 900; color: rgba(255, 255, 255, 0.25); z-index: 2; pointer-events: none; }
        .card-content { position: relative; z-index: 3; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .win-flags-container { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-bottom: 0.5rem; min-height: 24px; }
        .flag-icon { font-size: 1.2rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,1)); }
        .flag-cup { color: var(--cup-blue); } .flag-xfinity { color: var(--xfinity-purple); } .flag-truck { color: var(--truck-red); } .flag-menards { color: var(--menards-yellow); }
        .driver-name { font-size: 1.5rem; margin: 0 0 0.5rem; line-height: 1.1; text-shadow: 0 2px 10px rgba(0,0,0,0.8); width: 100%; }
        .team-name { font-family: sans-serif; font-size: 0.85rem; color: #ddd; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem; text-shadow: 0 2px 5px rgba(0,0,0,1); }
        .stats-pill { display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; color: #fff; margin-top: auto; backdrop-filter: blur(5px); }
        .stat-divider { width: 1px; height: 12px; background: #666; }

        .badge-container { display: flex; gap: 5px; margin-bottom: 1.5rem; flex-wrap: wrap; justify-content: center; }
        .champ-badge { background: linear-gradient(45deg, #ffd700, #b8860b); color: #000; font-size: 0.6rem; font-weight: 900; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); border: 1px solid #fff; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

        /* --- MODAL STYLES --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 3000; overflow-y: auto; }
        .modal-content { background: #0d0d0d; margin: 2rem auto; width: 95%; max-width: 1000px; border: 1px solid var(--primary); position: relative; min-height: 500px; }
        .close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; z-index: 20; text-shadow: 0 0 10px #000; }
        
        .p-hero { display: flex; flex-wrap: wrap; background: linear-gradient(135deg, #111, #000); border-bottom: 4px solid var(--primary); padding: 40px; align-items: center; gap: 40px; }
        .p-img-container { width: 200px; height: 260px; position: relative; flex-shrink: 0; border: 1px solid #333; overflow: hidden; background: #000; }
        .p-img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
        .p-info { flex: 1; position: relative; }
        .p-number { font-size: 6rem; line-height: 1; color: rgba(255,255,255,0.05); font-weight: 900; position: absolute; right: 10px; top: -20px; z-index: 0; }
        .p-name { font-size: 3rem; line-height: 1; margin: 0; text-transform: uppercase; position: relative; z-index: 1; }
        .p-team { font-size: 1rem; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; display: block; position: relative; z-index: 1; font-weight: bold; }
        
        /* Stats Tabs */
        .p-tabs { display: flex; background: #1a1a1a; border-bottom: 1px solid #333; }
        .p-tab-btn { flex: 1; background: transparent; border: none; color: #888; padding: 20px; cursor: pointer; font-family: 'Arial Black'; font-size: 0.9rem; text-transform: uppercase; transition: 0.3s; }
        .p-tab-btn:hover { background: #222; color: #fff; }
        .p-tab-btn.active { background: #0d0d0d; color: #fff; border-bottom: 3px solid var(--primary); }

        /* Panels */
        .p-panel { display: none; padding: 30px; }
        .p-panel.active { display: block; animation: fadeIn 0.3s; }
        
        /* TABLE STYLES (Fixed for Mobile) */
        .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 20px; }
        .stat-table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 0.9rem; min-width: 500px; /* Forces scroll on small screens */ }
        .stat-table th { text-align: left; color: #666; padding: 15px; border-bottom: 2px solid #333; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px; }
        .stat-table td { padding: 15px; border-bottom: 1px solid #222; color: #ddd; }
        .stat-table tr:hover { background: #141414; }
        .st-year { font-weight: bold; color: var(--primary); font-family: 'Arial Black'; }
        .st-points { color: var(--accent); font-weight: bold; }

        /* ================================================================= */
        /* --- 3D BINDER CSS --- */
        /* ================================================================= */
        .shelf-modal {
            perspective: 3000px;
            display: flex; justify-content: center;
            padding: 40px 0;
            overflow: visible;
        }

        .binder-modal {
            position: relative;
            width: 400px; height: 560px; /* Slightly smaller for modal */
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            max-width: 85vw; /* Mobile Safe */
        }

        .binder-modal.open { transform: translateX(200px); }

        /* FLIPPING MECHANISM */
        .m-flip-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-style: preserve-3d; transform-origin: left;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
            cursor: pointer;
        }
        .binder-modal.closed .m-flip-wrapper { transform: rotateY(-15deg); }
        .binder-modal.open .m-flip-wrapper { transform: rotateY(-180deg); }

        /* FACES */
        .m-face { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 5px 15px 15px 5px; }
        
        .m-front {
            z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff;
            background-color: #800000; /* Default Red */
            background-image: var(--binder-texture);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }
        /* Stitching */
        .m-front::after {
            content: ''; position: absolute; top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 2px dashed var(--stitch-color); border-radius: 5px; pointer-events: none;
        }
        
        /* Gold Text */
        .m-front h1 {
            font-family: 'Arial Black', sans-serif; font-size: 2rem; text-align: center; margin-top: 10px;
            background: var(--gold-foil); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5); filter: drop-shadow(0 2px 0px rgba(0,0,0,0.3));
        }
        .m-front .col-label {
            font-size: 0.8rem; letter-spacing: 4px; color: #ccc; margin-top: 20px; font-family: sans-serif;
        }

        .m-back {
            background: #fff; transform: rotateY(180deg);
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 10px 0 20px rgba(0,0,0,0.1);
        }

        .m-base-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; border-radius: 0 15px 15px 0;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.6);
            z-index: 1; display: flex; justify-content: center; align-items: center;
        }

        /* SPINE */
        .m-spine {
            position: absolute; left: 0; top: 0; bottom: 0; width: 40px;
            transform-origin: left; transform: rotateY(-90deg);
            background-color: #800000; background-image: var(--binder-texture);
            display: flex; align-items: center; justify-content: center;
            border-radius: 5px 0 0 5px;
            cursor: pointer;
        }

        /* RINGS */
        .m-rings {
            position: absolute; left: 5px; top: 0; bottom: 0; width: 20px;
            display: flex; flex-direction: column; justify-content: space-evenly;
            z-index: 20; pointer-events: none;
        }
        .m-metal-ring {
            width: 30px; height: 12px;
            background: linear-gradient(to bottom, #ccc, #fff, #999);
            border-radius: 10px; box-shadow: 1px 2px 5px rgba(0,0,0,0.3);
            position: relative; left: -10px;
        }

        /* SHEET CONTENT (FIXED FOR TRADING CARDS) */
        .m-sheet { 
            width: 90%; height: 94%; background: #f8f8f8;
            background-image: radial-gradient(#ddd 1px, transparent 1px); background-size: 10px 10px;
            display: flex; flex-wrap: wrap; align-content: flex-start;
            gap: 10px; padding: 15px; box-sizing: border-box; 
            border: 1px solid #ddd;
            overflow-y: auto; /* Scroll if multiple rows */
        }
        
        .m-slot { 
            width: 45%; /* Fits 2 cards per row */
            aspect-ratio: 5 / 7; /* Forces Standard Trading Card Shape */
            background: transparent; /* NO WHITE BOX BEHIND IMAGES */
            position: relative; 
            display: flex; align-items: center; justify-content: center; overflow: hidden; 
            cursor: pointer;
            transition: 0.2s;
        }
        .m-slot:hover { transform: scale(1.05); z-index: 5; }
        .m-slot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

        /* --- POP OUT CARD MODAL (FLIPPER) --- */
        #card-view-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 4000; /* Higher than profile modal */
            justify-content: center; align-items: center;
            perspective: 2000px;
        }
        .pop-card-wrapper {
            width: 400px; max-width: 90vw; aspect-ratio: 5 / 7;
            position: relative; transform-style: preserve-3d; transition: transform 0.6s;
            cursor: pointer;
        }
        .pop-card-wrapper.flipped { transform: rotateY(180deg); }
        .pop-face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 15px; overflow: hidden;
            box-shadow: 0 0 50px rgba(255,255,255,0.1);
        }
        .pop-front { z-index: 2; background: #fff; }
        .pop-front img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Professional Card Back Style */
        .pop-back { 
            transform: rotateY(180deg); background: #1a1a1a; color: #fff; 
            border: 4px solid #ffd700; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 30px; box-sizing: border-box; text-align: center;
            background-image: linear-gradient(45deg, #1a1a1a 25%, #222 25%, #222 50%, #1a1a1a 50%, #1a1a1a 75%, #222 75%, #222 100%);
            background-size: 20px 20px;
        }
        .pop-back h2 { font-family: 'Arial Black'; color: #ffd700; margin-bottom: 20px; font-size: 1.5rem; text-transform: uppercase; border-bottom: 2px solid #ffd700; padding-bottom: 10px; width: 100%; }
        .pop-back p { font-family: sans-serif; font-size: 1rem; line-height: 1.6; color: #ddd; }
        .pop-hint { position: absolute; bottom: 20px; color: #666; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        @media (max-width: 768px) {
            .hero { padding: 10rem 1rem 4rem; }
            .p-hero { flex-direction: column; text-align: center; padding: 20px 10px; }
            .p-img-container { margin: 0 auto; width: 150px; height: 180px; }
            .binder-modal { width: 42vw; height: 60vw; }
            .binder-modal.open { transform: translateX(21vw); }
            .m-front h1 { font-size: 1rem; margin-top: 5px; }
            .m-sheet { gap: 5px; padding: 5px; }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

        // --- 3. POP-OUT CARD LOGIC ---
        let canFlip = false;

        function viewCard(event, imgSrc, backText) {
            const modal = document.getElementById('card-view-modal');
            const card = document.getElementById('pop-card');
            const img = document.getElementById('pop-img');
            const txt = document.getElementById('pop-text');
            const hint = document.querySelector('.pop-hint');

            img.src = imgSrc;
            card.classList.remove('flipped'); // Reset flip
            
            if (backText && backText.trim() !== "") {
                canFlip = true;
                txt.innerHTML = backText;
                hint.style.display = 'block';
            } else {
                canFlip = false;
                txt.innerHTML = "";
                hint.style.display = 'none';
            }

            modal.style.display = 'flex';
        }

        function flipCard(e) {
            e.stopPropagation(); // Stop click from closing modal
            if (canFlip) {
                document.getElementById('pop-card').classList.toggle('flipped');
            }
        }

        function closeCardView() {
            document.getElementById('card-view-modal').style.display = 'none';
        }

        // --- 4. ROSTER LOGIC ---
        let allDriversData = {}; 
        let currentSeries = 'Cup';

        document.addEventListener('DOMContentLoaded', () => { loadDrivers(); });

        function loadDrivers() {
            const grid = document.getElementById('roster-grid');
            grid.innerHTML = '<p style="text-align:center; padding:2rem; color:#666;">Accessing Data Feed...</p>';
            
            fetch("drivers.json").then(r => r.json()).then(data => {
                allDriversData = data; 
                filterSeries('Cup'); 
            }).catch(err => {
                grid.innerHTML = `<p style="text-align:center; padding:2rem; color:#c00;">Unable to load roster.</p>`;
            });
        }

        function filterSeries(seriesName) {
            currentSeries = seriesName;
            document.querySelectorAll('.series-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.series === seriesName) btn.classList.add('active');
            });

            const grid = document.getElementById('roster-grid');
            grid.innerHTML = '';
            const filteredList = [];

            for (const [id, driverInfo] of Object.entries(allDriversData)) {
                let dName = driverInfo.display_name || id;
                if (driverInfo.series) {
                    const sKey = Object.keys(driverInfo.series).find(k => k.toLowerCase() === seriesName.toLowerCase());
                    if (sKey) {
                        filteredList.push({ id: id, name: dName, fullData: driverInfo, seriesData: driverInfo.series[sKey], badges: driverInfo.badges || [] });
                    }
                }
            }

            // Sort by Points
            filteredList.sort((a, b) => {
                const ptsA = (a.seriesData.current_stats || {points:0}).points || 0;
                const ptsB = (b.seriesData.current_stats || {points:0}).points || 0;
                if(ptsA !== ptsB) return ptsB - ptsA;
                return a.name.localeCompare(b.name);
            });

            if (filteredList.length === 0) {
                grid.innerHTML = '<p style="text-align:center; padding:2rem; width:100%; grid-column: 1/-1;">No drivers registered for this series yet.</p>';
                return;
            }

            const maxPoints = Math.max(...filteredList.map(i => (i.seriesData.current_stats || {points:0}).points || 0));

            filteredList.forEach(item => {
                const sData = item.seriesData;
                const stats = sData.current_stats || {points:0, wins:0};
                let carNum = sData.number;
                if (!carNum || carNum === "N/A") { const match = (item.name).match(/^#(\d+)/); carNum = match ? match[1] : ''; }
                const driverImage = getDriverImage(item.name);

                let flagsHtml = '';
                let flagClass = 'flag-truck'; 
                if(seriesName.toLowerCase() === 'cup') flagClass = 'flag-cup';
                if(seriesName.toLowerCase() === 'xfinity') flagClass = 'flag-xfinity';
                if(seriesName.toLowerCase() === 'menards') flagClass = 'flag-menards';
                for(let i=0; i<stats.wins; i++) flagsHtml += `<i class="fa-solid fa-flag-checkered flag-icon ${flagClass}"></i>`;

                // Badge Container (Grid)
                let badgesHtml = '';
                if(item.badges) {
                    badgesHtml = '<div class="badge-container">';
                    item.badges.forEach(b => {
                        badgesHtml += `<div class="champ-badge"><i class="fa-solid fa-trophy"></i> ${b}</div>`;
                    });
                    badgesHtml += '</div>';
                }

                const isLeader = (stats.points > 0 && stats.points === maxPoints);
                const hoverClass = seriesName.toLowerCase() + '-hover';

                const card = document.createElement('div');
                card.className = `driver-card ${hoverClass}`;
                card.onclick = () => openProfile(item.id, item.fullData);
                
                card.innerHTML = `
                    <img src="${driverImage}" alt="${item.name}" class="card-bg-img" loading="lazy">
                    <div class="bg-number">${carNum}</div>
                    <div class="card-content">
                        <div class="win-flags-container">${flagsHtml}</div>
                        ${isLeader ? '<i class="fa-solid fa-crown" style="color:#ffd700; font-size:1.5rem; margin-bottom:0.5rem; display:block; filter: drop-shadow(0 2px 4px #000);"></i>' : ''}
                        <h3 class="driver-name">${item.name}</h3>
                        <div class="team-name">${sData.team || 'Independent'}</div>
                        ${badgesHtml} 
                        <div class="stats-pill">
                            <span>#${carNum}</span><div class="stat-divider"></div>
                            <span>${stats.points} PTS</span><div class="stat-divider"></div>
                            <span>${stats.wins} WINS</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- 5. PROFILE MODAL ---
        function openProfile(id, driverData) {
            const modal = document.getElementById('driver-modal');
            const dataDiv = document.getElementById('modal-inject');
            
            let dName = driverData.display_name || id.replace(/^#\d+\s+/, '').trim();
            const sData = driverData.series[currentSeries];
            const currStats = sData.current_stats || {points:0, wins:0, top5:0, top10:0, poles:0, starts:0, avg:0};
            
            // --- DETERMINE LEFT PAGE IMAGE ---
            let leftPageImg = BINDER_LEFT_PAGES[dName] || BINDER_LEFT_PAGES[dName.replace(/\s/g, '')] || getDriverImage(dName);

            // --- BUILD RIGHT PAGE CONTENT ---
            let badgesHtml = '';
            if(driverData.badges) {
                driverData.badges.forEach(b => {
                    badgesHtml += `<div class="champ-badge"><i class="fa-solid fa-trophy"></i> ${b}</div>`;
                });
            }

            let achievementSlots = '';
            
            // A. Manual Images from BINDER_GALLERY (Supports Strings OR Objects)
            let galleryItems = BINDER_GALLERY[dName] || BINDER_GALLERY[dName.replace(/\s/g, '')] || [];
            
            galleryItems.forEach(item => {
                let imgUrl = "";
                let backText = "";

                // Check if simple string OR object
                if (typeof item === 'string') {
                    imgUrl = item;
                } else {
                    imgUrl = item.img;
                    backText = item.text;
                }

               // Create clickable slot (Safely escaping both single and double quotes!)
                let safeText = backText 
                    ? backText.replace(/'/g, "\\'").replace(/"/g, "&quot;") 
                    : "";

                achievementSlots += `
                    <div class="m-slot" style="background:transparent; border:none;" onclick="viewCard(event, '${imgUrl}', '${safeText}')">
                        <img src="${imgUrl}">
                    </div>
                `;
            });

            // B. Gold Text Badges
            if(driverData.badges) {
                driverData.badges.forEach(b => {
                    achievementSlots += `
                        <div class="m-slot" style="background:#111; border:2px solid gold;">
                            <div style="text-align:center; padding:5px;">
                                <i class="fa-solid fa-trophy" style="color:gold; font-size:1.5rem; margin-bottom:5px;"></i>
                                <div style="color:gold; font-size:0.4rem; text-transform:uppercase; font-weight:bold; line-height:1.2;">${b}</div>
                            </div>
                        </div>
                    `;
                });
            }

            // C. Fill Empty Slots
            const totalItems = galleryItems.length + (driverData.badges ? driverData.badges.length : 0);
            const fillCount = Math.max(0, 4 - totalItems);
            for(let k=0; k<fillCount; k++) achievementSlots += `<div class="m-slot" style="border:1px dashed #444; box-shadow:none; cursor:default;"></div>`;

            // Build History Table
            let historyRows = sData.history ? sData.history.map(h => `<tr><td class="st-year">${h.season}</td><td>${currentSeries}</td><td class="st-points">${h.stats.points}</td><td>${h.stats.wins}</td><td>${h.stats.top5}</td><td>${h.stats.top10}</td><td>${h.stats.avg}</td></tr>`).join('') : `<tr><td colspan="7" style="text-align:center; color:#666;">No data.</td></tr>`;

            const html = `
                <div class="p-hero">
                    <div class="p-img-container"><img src="${getDriverImage(dName)}" class="p-img"></div>
                    <div class="p-info">
                        <div class="p-number">${sData.number}</div>
                        <div class="p-badges" style="margin-bottom:10px; display:flex; gap:5px; flex-wrap:wrap; justify-content:center;">${badgesHtml}</div>
                        <span class="p-team">${sData.team} // #${sData.number} ${sData.manufacturer || 'N/A'}</span>
                        <h1 class="p-name">${dName}</h1>
                    </div>
                </div>

                <div class="p-tabs">
                    <button class="p-tab-btn active" onclick="switchModalTab('season')">Current Season</button>
                    <button class="p-tab-btn" onclick="switchModalTab('career')">Career History</button>
                    <button class="p-tab-btn" onclick="switchModalTab('collection')">Collection</button>
                </div>

                <div id="mod-tab-season" class="p-panel active">
                    <h3 style="border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:20px; color:#fff;">2026 SEASON STATS</h3>
                    <div class="table-wrapper">
                        <table class="stat-table">
                            <tr><th>Starts</th><th>Wins</th><th>Top 5</th><th>Top 10</th><th>Poles</th><th>Avg Fin</th><th>Points</th></tr>
                            <tr><td>${currStats.starts}</td><td>${currStats.wins}</td><td>${currStats.top5}</td><td>${currStats.top10}</td><td>${currStats.poles}</td><td>${currStats.avg}</td><td class="st-points" style="font-size:1.5rem;">${currStats.points}</td></tr>
                        </table>
                    </div>
                </div>

                <div id="mod-tab-career" class="p-panel">
                    <h3 style="border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:20px; color:#fff;">CAREER RESULTS</h3>
                    <div class="table-wrapper">
                        <table class="stat-table">
                            <thead><tr><th>Year</th><th>Series</th><th>Points</th><th>Wins</th><th>Top 5</th><th>Top 10</th><th>Avg Fin</th></tr></thead>
                            <tbody><tr><td class="st-year">2026</td><td>${currentSeries}</td><td class="st-points">${currStats.points}</td><td>${currStats.wins}</td><td>${currStats.top5}</td><td>${currStats.top10}</td><td>${currStats.avg}</td></tr>${historyRows}</tbody>
                        </table>
                    </div>
                </div>

                <div id="mod-tab-collection" class="p-panel" style="text-align:center;">
                    <div class="shelf-modal">
                        <div class="binder-modal closed" id="active-binder">
                            
                            <div class="m-spine" onclick="document.getElementById('active-binder').classList.toggle('closed'); document.getElementById('active-binder').classList.toggle('open')"></div>
                            
                            <div class="m-flip-wrapper" onclick="document.getElementById('active-binder').classList.toggle('closed'); document.getElementById('active-binder').classList.toggle('open')">
                                <div class="m-face m-front">
                                    <img src="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96" style="width:60px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); margin-bottom:10px;">
                                    <h1>${dName.split(' ')[0]}<br>${dName.split(' ')[1] || ''}</h1>
                                    <div class="col-label">COLLECTION</div>
                                </div>
                                <div class="m-face m-back">
                                    <div class="m-sheet" style="display:flex; justify-content:center; align-items:center; padding:0; overflow:hidden;">
                                        <div style="width:100%; height:100%; border:none; background:transparent;">
                                            <img src="${leftPageImg}" style="width:100%; height:100%; object-fit:cover; object-position: center top;">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="m-base-page">
                                <div class="m-rings"><div class="m-metal-ring"></div><div class="m-metal-ring"></div><div class="m-metal-ring"></div></div>
                                <div class="m-sheet">${achievementSlots}</div>
                            </div>
                            
                        </div>
                    </div>
                    <p style="color:#666; font-size:0.8rem; margin-top:10px;">(Click Binder Cover to Open/Close | Click Cards to View)</p>
                </div>
            `;

            dataDiv.innerHTML = html;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() { document.getElementById('driver-modal').style.display = 'none'; document.body.style.overflow = 'auto'; }
        function switchModalTab(tab) {
            document.querySelectorAll('.p-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.p-tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('mod-tab-'+tab).classList.add('active');
            event.target.classList.add('active');
        }
        window.onclick = function(e) { if (e.target.className === 'modal') closeModal(); }

        // Disable Rights
        document.addEventListener('contextmenu', (e) => { e.preventDefault(); });
        document.addEventListener('keydown', (e) => { if (e.ctrlKey || e.metaKey || e.key === 'F12') { e.preventDefault(); } });
    </script>
