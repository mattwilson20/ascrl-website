<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Results | American Stock Car Racing League</title>
    
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #c00; --accent: #ff0; --bg-dark: #000; --card-bg: #0d0d0d; --border: #1a1a1a;
            --text-muted: #a0a0a0; --transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            --cup-blue: #0077ff; --xfinity-purple: #8000b0; --truck-red: #c00; --menards-yellow: #fff200;
        }

        body { 
            margin: 0; font-family: 'Arial Black', sans-serif; background-color: #333; 
            background-image: radial-gradient(transparent 0%, #000 100%), url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.35'/%3E%3C/svg%3E");
            background-attachment: fixed; color: #fff; overflow-x: hidden; 
        }

        /* --- MODULAR NAVIGATION STYLES --- */
        #nav-placeholder { position: relative; z-index: 2000; }
        
        .nav-overlay { 
            position: fixed; top: 0; left: -100%; width: 100%; max-width: 350px; 
            height: 100vh; background: #050505; transition: left 0.5s ease; 
            z-index: 1999; padding-top: 100px; border-right: 1px solid var(--primary); 
        }
        .nav-overlay.open { left: 0; }
        .nav-links { display: flex; flex-direction: column; padding: 0 3rem; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-size: 1.2rem; padding: 1.2rem 0; 
            border-bottom: 1px solid var(--border); transition: var(--transition); letter-spacing: 2px; 
        }
        .nav-links a:hover { color: var(--primary); padding-left: 10px; }

        /* --- HERO --- */
        .hero { background: radial-gradient(circle at center, #222 0%, #000 100%); padding: 8rem 1rem 4rem; text-align: center; border-bottom: 1px solid var(--border); }
        h1 { font-size: clamp(2rem, 5vw, 4rem); margin: 0; letter-spacing: -2px; }

        /* --- CONTROLS BAR (PC: Flex Row, Mobile: Column) --- */
        .controls-bar { 
            background: #050505; padding: 1rem 2rem; border-bottom: 1px solid var(--border); 
            position: sticky; top: 0; z-index: 100; 
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
        }

        /* Left Side: Dropdowns */
        .filters-left { display: flex; gap: 10px; }
        select { background: #111; color: #fff; border: 1px solid var(--border); padding: 0.8rem 1.5rem; font-family: 'Arial Black'; text-transform: uppercase; cursor: pointer; min-width: 200px; }
        select:focus { border-color: var(--primary); outline: none; background: #000; }

        /* Right Side: Series Buttons */
        .series-tabs { display: flex; gap: 5px; }
        .series-btn { 
            background: #111; border: 1px solid #333; color: #888; 
            padding: 10px 20px; font-family: 'Arial Black'; text-transform: uppercase; 
            font-size: 0.9rem; cursor: pointer; transition: 0.3s;
        }
        .series-btn:hover { color: #fff; border-color: #666; }
        
        /* Series Active States */
        .series-btn.active { color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5); border-color: #fff; }
        .series-btn[data-series="Cup"].active { background: var(--cup-blue); border-color: var(--cup-blue); }
        .series-btn[data-series="Xfinity"].active { background: var(--xfinity-purple); border-color: var(--xfinity-purple); }
        .series-btn[data-series="Truck"].active { background: var(--truck-red); border-color: var(--truck-red); }
        .series-btn[data-series="Menards"].active { background: var(--menards-yellow); border-color: var(--menards-yellow); color: #000; }

        /* --- WINNER BANNER --- */
        .winner-banner { 
            background: linear-gradient(90deg, #0d0d0d 0%, #1a1a1a 100%); 
            padding: 3rem 2rem; border-bottom: 4px solid var(--primary); 
            display: flex; align-items: center; justify-content: center; gap: 4rem; flex-wrap: wrap; 
            display: none; 
        }
        
        .winner-photo { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--accent); background-size: cover; background-position: top center; box-shadow: 0 0 30px rgba(255,255,0,0.2); }
        .winner-info { text-align: left; }
        .winner-label { color: var(--primary); letter-spacing: 2px; font-size: 0.9rem; margin-bottom: 5px; }
        .winner-name { font-size: 3rem; margin: 0; line-height: 1; text-transform: uppercase; }
        .winner-team { color: #888; font-family: sans-serif; text-transform: uppercase; margin-top: 5px; font-weight: bold; }
        
        .winner-stats { display: flex; gap: 2rem; margin-top: 1rem; }
        .w-stat { display: flex; flex-direction: column; }
        .w-stat span:first-child { font-size: 0.7rem; color: #666; letter-spacing: 1px; }
        .w-stat span:last-child { font-size: 1.5rem; color: var(--accent); }

        /* --- RESULTS TABLE --- */
        .results-container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
        .table-responsive { overflow-x: auto; }
        
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; padding: 1rem; color: var(--primary); border-bottom: 1px solid var(--border); font-size: 0.8rem; letter-spacing: 1px; }
        td { padding: 1rem; border-bottom: 1px solid #222; font-family: sans-serif; color: #fff; }
        
        .pos-cell { font-family: 'Arial Black'; width: 50px; text-align: center; }
        .points-cell { font-family: 'Arial Black'; color: var(--accent); }
        .team-cell { font-size: 0.85rem; color: #888; text-transform: uppercase; }
        
        /* Winner Row Highlight */
        tr.winner-row td { background: rgba(204,0,0,0.15); }
        tr.winner-row .pos-cell { color: var(--primary); font-size: 1.2rem; }

        /* Bonus Pills */
        .pill { font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin-left: 5px; text-transform: uppercase; }
        .pill-pole { background: #fff; color: #000; }
        .pill-fl { background: var(--primary); color: #fff; }

        /* Loading */
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mobile */
        @media (max-width: 900px) {
            .hero { padding: 6rem 1rem 2rem; }
            .controls-bar { flex-direction: column; gap: 15px; padding: 1rem; }
            .filters-left { width: 100%; flex-direction: column; }
            select { width: 100%; }
            
            /* Center Series Buttons on Mobile */
            .series-tabs { justify-content: center; width: 100%; flex-wrap: wrap; }
            .series-btn { flex: 1; text-align: center; padding: 10px; font-size: 0.8rem; }

            .winner-banner { flex-direction: column; text-align: center; gap: 2rem; }
            .winner-info { text-align: center; }
            .winner-stats { justify-content: center; }
            .mobile-hide { display: none; }
        }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="spinner"></div></div>
    <div id="nav-placeholder"></div>

    <header class="hero">
        <h1>RACE RESULTS</h1>
    </header>

    <div class="controls-bar">
        <div class="filters-left">
            <select id="season-select" onchange="loadRaceData(this.value)">
                <option value="2026" selected>2026 Season</option>
                <option value="Season_1">2025 Season (Archive)</option>
            </select>
            <select id="track-select" onchange="displayResults()">
                <option value="">Loading...</option>
            </select>
        </div>

        <div class="series-tabs">
            <button class="series-btn active" data-series="Cup" onclick="switchSeries('Cup')">Cup</button>
            <button class="series-btn" data-series="Xfinity" onclick="switchSeries('Xfinity')">Xfinity</button>
            <button class="series-btn" data-series="Truck" onclick="switchSeries('Truck')">Truck</button>
            <button class="series-btn" data-series="Menards" onclick="switchSeries('Menards')">Menards</button>
        </div>
    </div>

    <div id="winner-banner" class="winner-banner">
        <div id="winner-photo" class="winner-photo"></div>
        <div class="winner-info">
            <div class="winner-label">RACE WINNER</div>
            <h2 id="winner-name" class="winner-name">DRIVER NAME</h2>
            <div id="winner-team" class="winner-team">Team Name</div>
            <div class="winner-stats">
                <div class="w-stat"><span>POINTS</span><span id="winner-points">0</span></div>
            </div>
        </div>
    </div>

    <main class="results-container">
        <div class="table-responsive">
            <table id="results-table">
                <thead>
                    <tr>
                        <th>POS</th>
                        <th>DRIVER</th>
                        <th>CAR</th>
                        <th>MANUFACTURER</th>
                        <th class="mobile-hide">TEAM</th>
                        <th>PTS</th>
                        <th style="text-align:right;">BONUS</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr><td colspan="7" style="text-align:center; padding:3rem; color:#666;">Select a race to view results.</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <div style="margin-bottom: 0.5rem; letter-spacing: 2px; color: #fff;">
            © 2025-2026 AMERICAN STOCK CAR RACING LEAGUE
        </div>
        
        <div style="font-size: 0.65rem; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 2rem; text-transform: uppercase;">
            OWNED AND OPERATED BY <span style="color: #fff; font-weight: bold;">A&M PRODUCTIONS LLC</span>
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/share/14PeZVCH1hL/" target="_blank" class="social-icon facebook" aria-label="Facebook">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="https://x.com/ASCRWeekly" target="_blank" class="social-icon x-twitter" aria-label="X (Twitter)">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            <a href="mailto:contact.ascrl@gmail.com" class="social-icon email" aria-label="Email A&M Productions">
                <i class="fa-solid fa-envelope"></i>
            </a>
        </div>
        
        <div style="font-size: 0.6rem; color: #444; margin-top: 20px; font-style: italic;">*ai generated images may be used</div>
    </footer>

    <script>
        const FILE_DRIVERS = "drivers.json"; 
        let raceData = {};
        let driverData = {};
        let currentSeries = 'Cup';

        // 1. NAV LOADING
        fetch('nav.html').then(res => res.text()).then(data => { 
            document.getElementById('nav-placeholder').innerHTML = data;
            const link = document.getElementById('nav-results');
            if(link) { link.style.color = "var(--primary)"; link.style.borderLeft = "4px solid var(--primary)"; link.style.paddingLeft = "15px"; }
        });

        function toggleMenu() { document.getElementById('nav-menu').classList.toggle('open'); }

        // 2. INITIALIZATION
        async function init() {
            document.getElementById('loading-screen').style.display = 'flex';
            document.getElementById('loading-screen').style.opacity = 1;

            try {
                // Step 1: Load Drivers Database FIRST
                const driverRes = await fetch(FILE_DRIVERS);
                if(driverRes.ok) {
                    driverData = await driverRes.json();
                } else {
                    console.error("Failed to load drivers.json");
                }

                // Step 2: Load Race Data (Default to 2026)
                await loadRaceData("2026");

            } catch (err) {
                console.error("Initialization Error:", err);
            } finally {
                // Done loading
                document.getElementById('loading-screen').style.opacity = 0;
                setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
            }
        }

        // Run Init
        document.addEventListener('DOMContentLoaded', init);

        // 3. SWITCH SERIES
        function switchSeries(seriesName) {
            currentSeries = seriesName;
            
            // Update Buttons
            document.querySelectorAll('.series-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.series === seriesName) btn.classList.add('active');
            });

            // Re-populate track list based on new series
            populateTracks();
        }

        // 4. LOAD RACE DATA
        async function loadRaceData(season) {
            const fileName = `ASCRL_Results_${season}.json`;
            try {
                const res = await fetch(fileName);
                if (!res.ok) throw new Error("Season data not found");
                raceData = await res.json();
                populateTracks();
            } catch (err) {
                console.error(err);
                raceData = {};
                document.getElementById('track-select').innerHTML = '<option>NO DATA</option>';
                document.getElementById('results-body').innerHTML = '<tr><td colspan="7" style="text-align:center;">No data available.</td></tr>';
            }
        }

        // 5. POPULATE TRACKS
        function populateTracks() {
            const trackSelect = document.getElementById('track-select');
            trackSelect.innerHTML = '<option value="">Select a Race...</option>';

            const availableTracks = Object.keys(raceData).filter(key => 
                key.toLowerCase().startsWith(currentSeries.toLowerCase() + " -")
            );

            if (availableTracks.length === 0) {
                trackSelect.innerHTML = '<option>NO RACES FOUND</option>';
            } else {
                availableTracks.forEach(trackKey => {
                    const option = document.createElement('option');
                    option.value = trackKey;
                    option.textContent = trackKey.split(' - ')[1] || trackKey;
                    trackSelect.appendChild(option);
                });
            }
            // Reset View
            document.getElementById('winner-banner').style.display = 'none';
            document.getElementById('results-body').innerHTML = '<tr><td colspan="7" style="text-align:center; padding:3rem;">Select a race to view results.</td></tr>';
        }

        // --- 6. DRIVER HERO IMAGES ---
        function getDriverImage(driverName) {

            // FIX IS HERE: Changed namelower to nameLower
            if (nameLower.includes('thirsttraptoby')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/7bc95544293252379df0a7693e5770b80e8ca8bf/ThirstTrapTobyHeroCard.jpg";
            
            if (nameLower.includes('hockey')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/8e6c91687a3fd67cc8d9771eec28321a154a56ce/UpdatedHockeyHero.jpg";
            if (nameLower.includes('k7_dalton')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/9a7e63f44a37cedfdf0b85ddeb4968c3b0da8817/k7Dalton.jpg";
            if (nameLower.includes('isaac')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/d0f7c7e6480bc33317d4e7939036024f0dcff3dc/Isaac.jpg";
            if (nameLower.includes('z71chevyman')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/869f4adefde19421e449f2e1e9ab7bd3a6ffaee5/ChevyMan.jpg";
            if (nameLower.includes('a54buick')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/b0f5738c17ce63c442afaca0ad22da6998499e1b/BuickBandit.jpg";
            if (nameLower.includes('duramax')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/548e18c0b3bc92b82f0af9fe09a2b0369d9b97ee/Duramax.jpg";
            if (nameLower.includes('rickyspanish')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/a4eb1f155988eef725e62b9c29859db41c08a225/RickySpanish.jpg";
            if (nameLower.includes('solid1915')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/7655f9eefe0cdd0d1809954233309718780d8925/SolidOne.jpg";
            if (nameLower.includes('the_fireman')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/6426c5de3657027051e18be3fae01a1c56faefbd/Fireman.jpg";
            if (nameLower.includes('the_stone')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/e81190c6bca706ca129f3413df56c7f2e375f74b/Stone.jpg";
            if (nameLower.includes('alessi')) return "https://github.com/mattwilson20/ascrl-website/blob/main/Alessi.Hero.Card.jpg?raw=true";
            if (nameLower.includes('dakotathomas')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/720d39d80f598430f8f4d7aa2a03360db2627230/IMG_7125.jpg";
            if (nameLower.includes('orangeman')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/70b5243e68e9c7f7a596f6695677d8d3520e89e1/IMG_7160.jpg";
            if (nameLower.includes('ant_was_he')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/602e91f22a89c294308d1e79473121daa8e777e7/ant_was_he_hero_card.jpg";

            if (nameLower.includes('majorblaz')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/77807b78b078188862cb490d2b95d2f846d237bf/Blaze_Hero_Card.jpg";

            if (nameLower.includes('callmemillion')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/e86926900f4957c57588db9a14beae7d6329a794/CallMeMillion_Hero_Card.jpg";
            if (nameLower.includes('mattwilson20')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/6686ee35c988cd1b0ae305d099ff4e31c652a49f/mattwilson20_Hero_Card.jpg";
            if (nameLower.includes('hockeydeckout')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/81df81de5161ea2f590ee32c370d3e99675cdbaa/Hockey_Hero_Card.png";
            if (nameLower.includes('dewshine')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/c5319ac2110c0b89850cf83b5d93b1af677f8611/Dewshine_Hero_Card.jpg";
            if (nameLower.includes('kevwood')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/07ccf5d79d881bf2047f439e25540dc380fec2d0/Kevwood.Hero.Card.jpg";
            if (nameLower.includes('lnfvmous')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/acff9081bff808e0028c0ae22dada726083e7948/Infamous.hero.card.jpg";
            if (nameLower.includes('fordemgators')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/58a3bfc691085c472f888d1c1d071fdf96b2ba20/Fordemgators.Hero.Card.jpg";
            if (nameLower.includes('dgibby')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/a0de7269483b7e2ec5e1aaae549f739229008914/DGibby.hero.card.jpg";
            if (nameLower.includes('kingg')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/9eb12bdb1b61a806ad951ae9a8bddc590622f35f/King.Hero.Card.jpg";
            if (nameLower.includes('hatter')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/34425dadb737bc4bc27aa9271be62909dc9a3e99/Hatter.Hero.Card.jpg";
            if (nameLower.includes('big_fella')) return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/ced27a5d96e0d211f038b36e34a55bccf4a7e4de/BigFella.Hero.Card.jpg";
            return "https://raw.githubusercontent.com/mattwilson20/ascrl-website/ad657026d44e8f66292dddbee7b21b0568631461/1766598509726.jpg";
        }

        // 7. HELPER: FIND DRIVER INFO
        function getDriverInfo(driverNameString) {
            if (!driverData || Object.keys(driverData).length === 0) {
                return { number: "00", team: "Independent", manufacturer: "N/A" };
            }

            let cleanName = driverNameString.replace(/^#\d+\s*/, '').trim().toLowerCase();

            const driverObj = Object.values(driverData).find(d => 
                d.display_name.trim().toLowerCase() === cleanName
            );

            let info = { number: "00", team: "Independent", manufacturer: "N/A" };

            if (driverObj && driverObj.series && driverObj.series[currentSeries]) {
                const sData = driverObj.series[currentSeries];
                info.number = sData.number || "00";
                info.team = sData.team || "Independent";
                info.manufacturer = sData.manufacturer || "N/A";
            }
            return info;
        }

        // 8. DISPLAY RESULTS
        function displayResults() {
            const trackKey = document.getElementById('track-select').value;
            if (!trackKey || !raceData[trackKey]) return;

            const rows = raceData[trackKey];
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';

            // --- A. WINNER BANNER ---
            const winner = rows.find(r => r.position == 1);
            if (winner) {
                const wInfo = getDriverInfo(winner.driver);
                const cleanWinnerName = winner.driver.replace(/^#\d+\s*/, '').trim();

                document.getElementById('winner-banner').style.display = 'flex';
                document.getElementById('winner-name').innerText = cleanWinnerName;
                document.getElementById('winner-points').innerText = winner.points;
                document.getElementById('winner-team').innerText = wInfo.team;
                
                // Get Image from centralized function
                const imgUrl = getDriverImage(cleanWinnerName);
                document.getElementById('winner-photo').style.backgroundImage = `url('${imgUrl}')`;
            }

            // --- B. TABLE ROWS ---
            rows.forEach(row => {
                const info = getDriverInfo(row.driver);
                const isWinner = (row.position == 1) ? 'winner-row' : '';
                const cleanName = row.driver.replace(/^#\d+\s*/, '').trim();

                let bonus = '';
                if(row.pole === "Yes" || row.pole === "Pole") bonus += '<span class="pill pill-pole">POLE</span>';
                if(row.fl === "FL" || row.fl === "Yes") bonus += '<span class="pill pill-fl">FASTEST LAP</span>';

                let mfr = info.manufacturer || "N/A";
                let mfrDisplay = mfr;
                if (mfr.toLowerCase().includes('chevy')) mfrDisplay = '<img src="https://cdn.discordapp.com/emojis/1437922651401093182.webp?size=96" style="height:20px;">';
                else if (mfr.toLowerCase().includes('toyota')) mfrDisplay = '<img src="https://cdn.discordapp.com/emojis/1437923347370606653.webp?size=96" style="height:20px;">';
                else if (mfr.toLowerCase().includes('ford')) mfrDisplay = '<img src="https://cdn.discordapp.com/emojis/1437922912626544886.webp?size=96" style="height:20px;">';

                tbody.innerHTML += `
                    <tr class="${isWinner}">
                        <td class="pos-cell">${row.position}</td>
                        <td style="font-weight:bold;">${cleanName}</td>
                        <td>#${info.number}</td>
                        <td>${mfrDisplay}</td>
                        <td class="mobile-hide team-cell">${info.team}</td>
                        <td class="points-cell">${row.points}</td>
                        <td style="text-align:right;">${bonus}</td>
                    </tr>
                `;
            });
        }
    </script>
    <script>
        // 1. Disable Right Click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // 2. Disable Keyboard Shortcuts (Ctrl+U, F12, Ctrl+Shift+I, etc.)
        document.addEventListener('keydown', (e) => {
            // Check for Ctrl (or Command on Mac)
            if (e.ctrlKey || e.metaKey) {
                switch (e.key.toLowerCase()) {
                    case 'u': // View Source
                    case 's': // Save Page
                    case 'a': // Select All
                    case 'c': // Copy
                        e.preventDefault();
                        return false;
                }
                // Check for Ctrl+Shift+I or J (Developer Tools)
                if (e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j')) {
                    e.preventDefault();
                    return false;
                }
            }
            
            // Check for F12 (Developer Tools)
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
