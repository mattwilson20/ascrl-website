<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL Collection</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        /* RESET */
        body { background-color: #111; font-family: 'Arial Black', sans-serif; min-height: 100vh; display: flex; flex-direction: column; margin: 0; }
        
        /* 3D FIX: This forces the entire binder to handle layers correctly */
        .shelf { display: flex; flex-direction: column; align-items: center; gap: 150px; padding: 100px 20px; perspective: 3000px; }
        
        /* BINDER */
        .binder { position: relative; width: 500px; height: 650px; transform-style: preserve-3d; transition: 0.8s; cursor: pointer; }
        .binder.closed { transform: rotateY(-25deg) rotateX(5deg); }
        .binder.open { transform: translateX(250px) rotateY(0deg); z-index: 100; }
        
        .binder.roster .cover, .binder.roster .spine { background-color: #800000; }

        /* PAGES */
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-style: preserve-3d; transition: 0.8s; border: 2px solid #222; }
        .cover { z-index: 10; background: #800000; transform-origin: left; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; border-radius: 5px 10px 10px 5px; backface-visibility: hidden; }
        .binder.open .cover { transform: rotateY(-180deg); }

        /* INSIDE PAGES */
        .inside-cover { background: #fff; transform-origin: left; transform: rotateY(-180deg); z-index: 5; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; }
        .binder.open .inside-cover { transform: rotateY(-180deg); z-index: 11; }
        
        .base-page { background: #fff; z-index: 1; border-radius: 0 10px 10px 0; }
        
        /* SPINE */
        .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 50px; transform-origin: left; transform: rotateY(-90deg); background: inherit; border-radius: 5px 0 0 5px; }

        /* GRID */
        .sheet { width: 90%; height: 95%; background: #f4f4f4; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; padding: 15px; box-sizing: border-box; }
        
        /* THE SLOT (Green for Debugging) */
        .slot { 
            background: #00ff00; /* NEON GREEN - If you see this, the slot exists */
            border: 1px solid #000; 
            position: relative; 
            cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            transform-style: preserve-3d; /* Crucial for 3D */
        }

        /* THE IMAGE FIX */
        .slot img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
            /* THIS COMMAND FORCES THE IMAGE TO HOVER ABOVE THE PAPER */
            transform: translateZ(2px); 
            position: relative;
            z-index: 50;
        }

        /* MODAL */
        #card-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 20000; display: none; justify-content: center; align-items: center; }
        #big-card { width: 400px; height: 560px; position: relative; }
        .card-face img { width: 100%; }
        .close-modal { position: absolute; top: 30px; right: 30px; color: #fff; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>

    <div style="background:orange; text-align:center; padding:5px;"><b>VERSION 6.0: Z-INDEX FIX</b></div>
    <div id="nav-placeholder"></div>

    <div class="shelf">
        <div class="binder closed roster" onclick="toggleBinder(this)">
            <div class="spine"></div>
            <div class="page cover"><h1>ROSTER</h1></div>
            
            <div class="page inside-cover">
                <div class="sheet">
                    <div class="slot" onclick="event.stopPropagation(); inspectCard('dewshine')">
                        <img src="dewshinetradingcard.jpg">
                    </div>

                    <div class="slot">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b6/Image_created_with_a_mobile_phone.png">
                    </div>
                    
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                </div>
            </div>
            
            <div class="page base-page"><div class="sheet"></div></div>
        </div>
    </div>

    <div id="card-modal">
        <div class="close-modal" onclick="document.getElementById('card-modal').style.display='none'">&times;</div>
        <div id="big-card"><div class="card-face"><img id="m-front" src=""></div></div>
    </div>

    <script>
        fetch('nav.html').then(r=>r.text()).then(d=>document.getElementById('nav-placeholder').innerHTML=d);

        function toggleBinder(el) {
            el.classList.toggle('closed');
            el.classList.toggle('open');
            if(el.classList.contains('open')) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
        }

        function inspectCard() {
            document.getElementById('m-front').src = "dewshinetradingcard.jpg";
            document.getElementById('card-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
