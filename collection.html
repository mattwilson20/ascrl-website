<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL Collection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
    <style>
        body { background-color: #111; font-family: 'Arial Black', sans-serif; min-height: 100vh; display: flex; flex-direction: column; margin: 0; }
        
        /* LAYOUT */
        #nav-placeholder { position: relative; z-index: 10000; }
        .shelf { display: flex; flex-direction: column; align-items: center; gap: 150px; padding: 100px 20px; perspective: 3000px; }

        /* BINDER STRUCTURE */
        .binder { position: relative; width: 500px; height: 650px; transform-style: preserve-3d; transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .binder.closed { transform: rotateY(-25deg) rotateX(5deg); }
        .binder.open { transform: translateX(250px) rotateY(0deg); z-index: 100; }
        
        /* COLORS & TEXTURE */
        :root { --binder-texture: url("https://www.transparenttextures.com/patterns/leather.png"); }
        .binder.winners .cover, .binder.winners .spine { background-color: #D4AF37; background-image: var(--binder-texture); }
        .binder.roster .cover, .binder.roster .spine { background-color: #800000; background-image: var(--binder-texture); }

        /* PARTS */
        .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 50px; transform-origin: left; transform: rotateY(-90deg); background: inherit; border-radius: 5px 0 0 5px; display: flex; align-items: center; justify-content: center; }
        .spine span { transform: rotate(90deg); color: rgba(255,255,255,0.7); font-size: 2rem; letter-spacing: 5px; white-space: nowrap; }
        
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-style: preserve-3d; transition: 0.8s; border: 2px solid #222; }
        
        .cover { z-index: 10; transform-origin: left; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; border-radius: 5px 10px 10px 5px; backface-visibility: hidden; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .binder.open .cover { transform: rotateY(-180deg); }

        .inside-cover { background: #fff; transform-origin: left; transform: rotateY(-180deg); z-index: 5; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; }
        .binder.open .inside-cover { transform: rotateY(-180deg); z-index: 11; }

        .base-page { background: #fff; z-index: 1; border-radius: 0 10px 10px 0; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); }

        /* SLOTS & SHEETS */
        .sheet { width: 90%; height: 95%; background: #f4f4f4; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; padding: 15px; box-sizing: border-box; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
        
        .slot { background: #fff; border: 1px solid rgba(0,0,0,0.1); position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: 0.2s; }
        .slot:hover { transform: scale(1.05); z-index: 20; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        /* Added translateZ to force 3D rendering priority */
        .slot img { width: 100%; height: 100%; object-fit: cover; object-position: top; transform: translateZ(0.1px); }
        
        /* Plastic Sheen */
        .slot::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1) 100%); pointer-events: none; z-index: 10; }

        /* MODAL */
        #card-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 20000; display: none; justify-content: center; align-items: center; perspective: 1000px; }
        #big-card { width: 400px; height: 560px; position: relative; transform-style: preserve-3d; transition: 0.6s; cursor: pointer; }
        #big-card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; background: #fff; overflow: hidden; box-shadow: 0 0 50px rgba(255,255,255,0.1); }
        .card-face img { width: 100%; height: 100%; object-fit: contain; }
        .card-back { transform: rotateY(180deg); background: #e6e6e6; padding: 30px; display: flex; flex-direction: column; align-items: center; text-align: center; color: #111; font-family: 'Arial', sans-serif; }
        .card-back h2 { color: #c00; text-transform: uppercase; margin-bottom: 10px; }
        .stats-block { margin-top: 20px; border-top: 2px solid #ccc; padding-top: 20px; width: 100%; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
        .close-modal { position: absolute; top: 30px; right: 30px; color: #fff; font-size: 2rem; cursor: pointer; z-index: 20001; }
        
        @media (max-width: 1100px) { .binder { width: 90vw; height: 120vw; } }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="shelf">
        <div class="binder closed winners" onclick="toggleBinder(this)">
            <div class="spine"><span>WINNERS</span></div>
            <div class="page cover">
                <img src="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96" style="width:80px; margin-bottom:15px; filter: drop-shadow(0 0 5px #000);">
                <h1>VICTORY LANE</h1>
            </div>
            <div class="page inside-cover"><div class="sheet" id="winners-L"></div></div>
            <div class="page base-page"><div class="sheet" id="winners-R"></div></div>
        </div>

        <div class="binder closed roster" onclick="toggleBinder(this)">
            <div class="spine"><span>ROSTER</span></div>
            <div class="page cover">
                <img src="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96" style="width:80px; margin-bottom:15px; filter: drop-shadow(0 0 5px #000);">
                <h1>THE ROSTER</h1>
            </div>
            <div class="page inside-cover"><div class="sheet" id="roster-L"></div></div>
            <div class="page base-page"><div class="sheet" id="roster-R"></div></div>
        </div>
    </div>

    <div id="card-modal">
        <div class="close-modal" onclick="document.getElementById('card-modal').style.display='none'">&times;</div>
        <div id="big-card" onclick="this.classList.toggle('flipped')">
            <div class="card-face"><img id="m-front"></div>
            <div class="card-face card-back" id="m-back"></div>
        </div>
    </div>

    <script>
        // Load Nav (with error catch so it doesn't break the page if missing)
        fetch('nav.html').then(r=>r.text()).then(d=>document.getElementById('nav-placeholder').innerHTML=d).catch(e=>console.log("Nav missing"));
        function toggleMenu() { document.getElementById('nav-menu').classList.toggle('open'); }

        // *** DATA (Using the link we proved works!) ***
        const rosterData = [
            {
                front: "DewshineTradingCard.jpg", 
                title: "DEWSHINE",
                text: "Apex Racing<br>Car #77<br>Cup Series",
                stats: { "Wins": "0", "Top 5s": "3", "Avg Fin": "9.4" }
            }
        ];
        const winnersData = [];
        
        // *** LOGIC ***
        function toggleBinder(el) {
            document.querySelectorAll('.binder').forEach(b => b!==el ? b.classList.add('closed') : null);
            el.classList.toggle('closed');
            el.classList.toggle('open');
            if(el.classList.contains('open')) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
        }

        function fill(data, idL, idR) {
            const L = document.getElementById(idL);
            const R = document.getElementById(idR);
            for(let i=0; i<9; i++) addSlot(data[i], L);
            for(let i=9; i<18; i++) addSlot(data[i], R);
        }

        function addSlot(d, p) {
            let s = document.createElement('div');
            s.className = 'slot';
            if(d) {
                let img = document.createElement('img');
                img.src = d.front;
                // Add error reporting just in case
                img.onerror = function() { this.style.display='none'; s.style.background='red'; s.innerHTML='<span style="color:white;font-size:0.6rem">ERROR</span>'; }
                s.appendChild(img);
                s.onclick = (e) => { e.stopPropagation(); openModal(d); };
            }
            p.appendChild(s);
        }

        function openModal(d) {
            document.getElementById('m-front').src = d.front;
            let statsHtml = '';
            if(d.stats) {
                statsHtml = '<div class="stats-block">';
                for (const [k, v] of Object.entries(d.stats)) statsHtml += `<div class="stat-row"><span>${k}</span><span>${v}</span></div>`;
                statsHtml += '</div>';
            }
            document.getElementById('m-back').innerHTML = `<h2>${d.title}</h2><p>${d.text}</p>${statsHtml}`;
            document.getElementById('big-card').classList.remove('flipped');
            document.getElementById('card-modal').style.display = 'flex';
        }

        fill(winnersData, 'winners-L', 'winners-R');
        fill(rosterData, 'roster-L', 'roster-R');
    </script>
</body>
</html>
