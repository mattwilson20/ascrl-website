<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections | American Stock Car Racing League</title>
    
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- 1. GLOBAL VARIABLES & BACKGROUND --- */
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #000;
            --card-bg: #0d0d0d;
            --border: #1a1a1a;
            --text-muted: #a0a0a0;
            
            --cup-blue: #0077ff;
            --xfinity-purple: #8000b0;
            --truck-red: #c00;
            --menards-yellow: #fff200;

            --binder-texture: url("https://www.transparenttextures.com/patterns/leather.png");
            
            /* REALISM COLORS */
            --gold-foil: linear-gradient(45deg, #ffd700, #ffcc00, #ffeb3b, #d4af37);
            --stitch-color: rgba(255, 255, 255, 0.3);
        }

        body { 
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            background-color: #222; 
            background-image: 
                radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%),
                url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            background-attachment: fixed;
            color: #fff; 
            overflow-x: hidden; 
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        #nav-placeholder { position: relative; z-index: 2000; }

        /* --- HERO HEADER --- */
        .hero { 
            position: relative; overflow: hidden; 
            background: linear-gradient(to bottom, #1a1a1a, #000); 
            padding: 8rem 1rem 4rem; text-align: center; 
            border-bottom: 4px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .hero h1 { 
            font-size: clamp(3rem, 8vw, 5rem); margin: 0; letter-spacing: -2px; 
            background: linear-gradient(to bottom, #fff, #888); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- SHELF --- */
        .shelf { 
            display: flex; flex-direction: column; align-items: center; 
            gap: 120px; padding: 80px 10px; perspective: 3000px;
        }

        /* --- BINDER (PHYSICS ENGINE) --- */
        .binder { 
            position: relative; 
            width: 500px; height: 650px; 
            transform-style: preserve-3d; 
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); 
            cursor: pointer; 
            max-width: 90vw; 
        }
        
        .binder.open { transform: translateX(250px); }

        /* --- BINDER AESTHETICS --- */
        .binder .front, .binder .spine {
            background-image: var(--binder-texture);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5); 
        }
        .binder.winners .front, .binder.winners .spine { background-color: #C5A028; } 
        .binder.roster .front, .binder.roster .spine { background-color: #660000; } 

        .front::after {
            content: ''; position: absolute; 
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 2px dashed var(--stitch-color);
            border-radius: 5px;
            pointer-events: none;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .front h1 {
            font-family: 'Arial Black', sans-serif;
            font-size: 2.5rem; text-align: center; margin-top: 10px;
            background: var(--gold-foil);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5); 
            filter: drop-shadow(0 2px 0px rgba(0,0,0,0.3));
        }

        /* --- FLIP MECHANICS --- */
        .flip-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-style: preserve-3d; transform-origin: left;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
        }
        .binder.closed .flip-wrapper { transform: rotateY(-15deg); }
        .binder.open .flip-wrapper { transform: rotateY(-180deg); }

        .face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 5px 15px 15px 5px;
        }

        .front {
            z-index: 2; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .back {
            background: #fff; transform: rotateY(180deg);
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 10px 0 20px rgba(0,0,0,0.1); 
        }

        .base-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; border-radius: 0 15px 15px 0;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.6);
            z-index: 1; display: flex; justify-content: center; align-items: center;
        }

        /* --- SPINE & RINGS --- */
        .spine {
            position: absolute; left: 0; top: 0; bottom: 0; width: 50px;
            transform-origin: left; transform: rotateY(-90deg);
            display: flex; align-items: center; justify-content: center;
            border-radius: 5px 0 0 5px;
            border-left: 1px solid rgba(255,255,255,0.2);
        }
        .spine span { 
            transform: rotate(90deg); color: rgba(255,255,255,0.4); 
            font-size: 1.5rem; letter-spacing: 5px; 
            text-shadow: -1px -1px 0 rgba(0,0,0,0.5);
        }

        .ring-mechanisms {
            position: absolute; left: 5px; top: 0; bottom: 0; width: 20px;
            display: flex; flex-direction: column; justify-content: space-evenly;
            z-index: 20; pointer-events: none;
        }
        .metal-ring {
            width: 40px; height: 15px;
            background: linear-gradient(to bottom, #ccc, #fff, #999);
            border-radius: 10px;
            box-shadow: 1px 2px 5px rgba(0,0,0,0.3);
            position: relative; left: -10px;
        }

        /* --- GRID & SLOTS --- */
        .sheet { 
            width: 90%; height: 94%; 
            background-color: #f8f8f8;
            background-image: radial-gradient(#ddd 1px, transparent 1px);
            background-size: 10px 10px; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 8px; padding: 15px; 
            box-sizing: border-box; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            border: 1px solid #ddd;
        }
        
        .slot { 
            background: #fff; border: 1px solid #eee; position: relative; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; overflow: hidden; 
            transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .slot:hover { 
            transform: scale(1.05) translateZ(10px); z-index: 20; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-color: var(--primary);
        }
        .slot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
        
        .slot::after { 
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%; 
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1) 100%); 
            pointer-events: none; z-index: 10; 
        }

        /* --- MODAL (PERFECT FIT UPDATE) --- */
        #card-modal { 
            position: fixed; top: 0; left: 0; 
            width: 100%; 
            height: 100dvh; 
            background: rgba(0,0,0,0.85); z-index: 20000; 
            display: none; 
            place-items: center; 
            perspective: 1000px; cursor: pointer;
            backdrop-filter: blur(8px);
        }
        
        /* The container determines size */
        #big-card { 
            /* Start with a standard width */
            width: 400px;
            
            /* FORCE ASPECT RATIO: 5 wide / 7 tall. This is standard card size. */
            aspect-ratio: 5 / 7;
            
            /* Let height be determined automatically by the ratio */
            height: auto; 
            
            position: relative; 
            transform-style: preserve-3d; 
            transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: default;
            
            /* SAFETY LIMITS FOR MOBILE */
            /* Never be wider than 90% of screen */
            max-width: 90vw;
            /* Never be taller than 85% of view */
            max-height: 85dvh;
        }
        
        #big-card.flipped { transform: rotateY(180deg); }
        
        .card-face { 
            position: absolute; width: 100%; height: 100%; 
            backface-visibility: hidden; border-radius: 14px; 
            background: #fff; overflow: hidden; 
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
        }
        
        /* FIX: CONTAIN ensures the full image is seen, no cropping at edges */
        .card-face img { 
            width: 100%; height: 100%; 
            object-fit: contain; /* Changed from COVER to CONTAIN to stop edge cropping */
            object-position: center;
            background: #000; /* Black background for any letterboxing */
        }
        
        .card-back { 
            transform: rotateY(180deg); background: #f0f0f0; 
            padding: 20px; display: flex; flex-direction: column; 
            align-items: center; text-align: center; color: #111; 
            font-family: 'Arial', sans-serif; overflow-y: auto;
            background-image: radial-gradient(#ccc 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* --- MOBILE RULES --- */
        @media (max-width: 768px) {
            .shelf { padding-top: 50px; }
            .binder { width: 44vw; height: 60vw; }
            .binder.open { transform: translateX(22vw); }
            .front h1 { font-size: 1.2rem; margin-top: 5px; }
            .spine span { font-size: 0.9rem; letter-spacing: 2px; }
            .sheet { gap: 2px; padding: 4px; }
            .front img { width: 40%; }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <header class="hero">
        <p style="letter-spacing: 8px; color: var(--primary); text-transform: uppercase; font-size: 0.8rem; font-weight: bold;">Official League Portal</p>
        <h1 class="text-gradient">COLLECTIONS</h1>
        <div style="margin-top: 1rem; position: relative; z-index: 2;">
            <p style="color: #888; font-family: sans-serif; font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase;">
                Trading Cards • History • Hall of Fame
            </p>
        </div>
    </header>

    <div class="shelf">
        
        <div class="binder closed winners" onclick="toggleBinder(this)">
            <div class="spine"><span>WINNERS</span></div>
            <div class="flip-wrapper">
                <div class="face front">
                    <img src="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96" style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));">
                    <h1>VICTORY LANE</h1>
                </div>
                <div class="face back">
                    <div class="sheet" id="winners-L"></div>
                </div>
            </div>
            <div class="base-page">
                <div class="ring-mechanisms">
                    <div class="metal-ring"></div>
                    <div class="metal-ring"></div>
                    <div class="metal-ring"></div>
                </div>
                <div class="sheet" id="winners-R"></div>
            </div>
        </div>

        <div class="binder closed roster" onclick="toggleBinder(this)">
            <div class="spine"><span>ROSTER</span></div>
            <div class="flip-wrapper">
                <div class="face front">
                    <img src="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96" style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));">
                    <h1>THE ROSTER</h1>
                </div>
                <div class="face back">
                    <div class="sheet" id="roster-L"></div>
                </div>
            </div>
            <div class="base-page">
                <div class="ring-mechanisms">
                    <div class="metal-ring"></div>
                    <div class="metal-ring"></div>
                    <div class="metal-ring"></div>
                </div>
                <div class="sheet" id="roster-R"></div>
            </div>
        </div>

    </div>

    <div id="card-modal" onclick="this.style.display='none'">
        <div id="big-card" onclick="event.stopPropagation(); this.classList.toggle('flipped')">
            <div class="card-face"><img id="m-front" src=""></div>
            <div class="card-face card-back" id="m-back"></div>
        </div>
    </div>
    <footer>
        <div style="margin-bottom: 0.5rem; letter-spacing: 2px; color: #fff;">
            © 2025-2026 AMERICAN STOCK CAR RACING LEAGUE
        </div>
        
        <div style="font-size: 0.65rem; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 2rem; text-transform: uppercase;">
            OWNED AND OPERATED BY <span style="color: #fff; font-weight: bold;">A&M PRODUCTIONS LLC</span>
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/share/14PeZVCH1hL/" target="_blank" class="social-icon facebook" aria-label="Facebook">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="https://x.com/ASCRWeekly" target="_blank" class="social-icon x-twitter" aria-label="X (Twitter)">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            
            <a href="mailto:contact.ascrl@gmail.com" class="social-icon email" aria-label="Email A&M Productions">
                <i class="fa-solid fa-envelope"></i>
            </a>
        </div>
        
        <div style="font-size: 0.6rem; color: #444; margin-top: 20px; font-style: italic;">*ai generated images may be used</div>
    </footer>

    <script>
        fetch('nav.html').then(r=>r.text()).then(d=>document.getElementById('nav-placeholder').innerHTML=d).catch(e=>console.log("Nav missing"));
        function toggleMenu() { document.getElementById('nav-menu').classList.toggle('open'); }

        // --- DATA ---
        const rosterData = [
            {
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/79ecd9c5a2821f6754db73d9bd51e0d7fbfccdfe/ThirstTrapToby.jpg",
                title: "ThirstTrapToby",
                text: "Why Is It Smoking? Motorsports<br>Car #0<br>Cup Series"
            }, // <--- YOU NEED THIS CLOSING BRACKET AND COMMA HERE
            {
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/6fe18b047b96a5d30e1de8ee2050caf384b6d168/HockyDriverCard.jpg", 
                title: "HOCKEYDECKOUT",
                text: "Too Broke Racing<br>Car #71<br>Cup Series"
            },
            {
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/45448a6fa6a13d7ef8e40af1cf4ab9999353347e/SithWarriorUno.jpg",
                title: "SithWarriorUno",
                text: "Backrow Motorsports<br>Car #41<br>Cup Series"
            },
            {
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/b3d420d7c43d24291c1d7abe0e8ccd212ab55326/Mopawah_Titan_player_card.jpg",
                title: "Mopawah_Titan78",
                text: "Smokin' Fast Racing<br>Car #25<br>Cup Series"
            },
            {
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/c8dde57e09428deab27794b07d9aefc31ba01c70/DakotaThomas1994PlayerCard.jpg",
                title: "DakotaThomas1994",
                text: "Apex Racing<br>Car #24<br>Cup Series"
            }
        ];
        
        const winnersData = [
            {
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/c8dde57e09428deab27794b07d9aefc31ba01c70/2026ATLonexfin.jpg",
                title: "BENNETT TRANSPORTATION & LOGISTICS 125",
                text: "DakotaThomas1994 Wins the Xfinity Series BENNETT TRANSPORTATION & LOGISTICS 125 at EchoPark Speedway(Atlanta)"
            },
            {
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/b4134b230f304b311d38d0e8e46a570773fbaa9c/CUPNorthWilkesboro.jpg",
                title: "The Clash 2026",
                text: "HockeyDeckOut Wins the 2026 Clash at North Wilkesboro!"
            },    
            {
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/391291a447cbf2cd3bd22e60e924416b4105a2b1/ArcaDaytona.jpg",
                title: "General Tire 200",
                text: "ThirstTrapToby Wins the 2026 Menard's Season opening race. The General Tire 200 at Daytona"
            },
            {
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/95accaeeb2a5c73977dfb48d15313416315cc606/XfinityDaytona.jpg",
                title: "UNITED RENTALS 150",
                text: "Mrs. Puff - Hockey Wins the 2026 Xfinity season opening race. The United Rentals 150 at Daytona"
            }, // <--- Added the closing bracket here, and made "text" lowercase!
            {
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/45448a6fa6a13d7ef8e40af1cf4ab9999353347e/TrucksDaytona.jpg",
                title: "FRESH FROM FLORIDA 250",
                text: "SithWarriorUno Wins yet another Super Speedway at the 2026 opening Truck race at Daytona. The FRESH FROM FLORIDA 250."
            },
            {
                front: "https://raw.githubusercontent.com/mattwilson20/ascrl-website/b3d420d7c43d24291c1d7abe0e8ccd212ab55326/CupDaytona2026500.jpg",
                title: "ASCRL DAYTONA 500.",
                text: "Mopawah_titan78 WINS THE 2026 ASCRL DAYTONA 500."
            }
        ];

        // --- LOGIC ---
        function toggleBinder(el) {
            document.querySelectorAll('.binder').forEach(b => {
                if(b !== el) { b.classList.add('closed'); b.classList.remove('open'); }
            });
            el.classList.toggle('closed');
            el.classList.toggle('open');
            if(el.classList.contains('open')) {
                setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
            }
        }

        function fillBinder(data, leftSheetId, rightSheetId) {
            const leftEl = document.getElementById(leftSheetId);
            const rightEl = document.getElementById(rightSheetId);
            const totalSlots = 18;

            for (let i = 0; i < totalSlots; i++) {
                const targetPage = (i < 9) ? leftEl : rightEl;
                const cardInfo = (i < data.length) ? data[i] : null;
                createSlot(cardInfo, targetPage);
            }
        }

        function createSlot(data, parent) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            if (data) {
                const img = document.createElement('img');
                img.src = data.front;
                img.onerror = function() { this.style.display='none'; slot.style.background='#eee'; slot.innerHTML = '<span style="font-size:0.6rem;color:#999;">MISSING</span>'; };
                slot.appendChild(img);
                slot.onclick = (e) => { e.stopPropagation(); openModal(data); };
            }
            parent.appendChild(slot);
        }

        function openModal(data) {
            const modal = document.getElementById('card-modal');
            const front = document.getElementById('m-front');
            const back = document.getElementById('m-back');
            const card = document.getElementById('big-card');

            front.src = data.front;

            let statsHtml = '';
            if(data.stats) {
                statsHtml = '<div class="stats-block" style="width:100%; margin-top:15px; border-top:1px solid #ccc; padding-top:10px;">';
                for (const [key, value] of Object.entries(data.stats)) {
                    statsHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; font-weight:bold; border-bottom:1px solid #eee;"><span>${key}</span><span>${value}</span></div>`;
                }
                statsHtml += '</div>';
            }

            back.innerHTML = `
                <h2 style="color:#c00; margin-bottom:5px;">${data.title}</h2>
                <p>${data.text}</p>
                ${statsHtml}
                <div style="margin-top:auto; font-size:0.6rem; color:#888; margin-bottom:10px;">OFFICIAL ASCRL TRADING CARD</div>
            `;
            
            card.classList.remove('flipped');
            // Important: Use Grid display for centering
            modal.style.display = 'grid'; 
        }

        fillBinder(winnersData, 'winners-L', 'winners-R');
        fillBinder(rosterData, 'roster-L', 'roster-R');
    </script>
    <script>
        // 1. Disable Right Click
        document.addEventListener('contextmenu', (e) => { e.preventDefault(); });

        // 2. Disable Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key.toLowerCase()) {
                    case 'u': case 's': case 'a': case 'c':
                        e.preventDefault(); return false;
                }
                if (e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j')) {
                    e.preventDefault(); return false;
                }
            }
            if (e.key === 'F12') { e.preventDefault(); return false; }
        });
    </script>
</body>
</html>
