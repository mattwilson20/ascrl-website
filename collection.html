<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL Collection</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        body { background-color: #111; font-family: 'Arial Black', sans-serif; min-height: 100vh; display: flex; flex-direction: column; margin: 0; }
        
        #nav-placeholder { position: relative; z-index: 10000; }
        .shelf { display: flex; flex-direction: column; align-items: center; gap: 100px; padding: 100px 20px; perspective: 3000px; }

        /* --- THE NEW STRUCTURE --- */
        .binder { 
            position: relative; 
            width: 500px; 
            height: 650px; 
            transform-style: preserve-3d; 
            transition: 0.8s; 
            cursor: pointer; 
        }

        /* When open, shift the whole book right so it's centered */
        .binder.open { transform: translateX(250px); }

        /* The Static Right Page (Base) */
        .base-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            border-radius: 0 10px 10px 0;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            z-index: 1; /* Always on bottom */
        }

        /* The Flipping Part (Front Cover + Inside Left) */
        .flip-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transform-origin: left;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        /* ROTATION LOGIC */
        .binder.closed .flip-wrapper { transform: rotateY(-25deg); }
        .binder.open .flip-wrapper { transform: rotateY(-180deg); }

        /* SHARED PAGE STYLES */
        .face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; /* Hides the back side */
            border-radius: 5px 10px 10px 5px;
            border: 2px solid #222;
        }

        /* FRONT COVER (Red) */
        .front {
            background-color: #800000;
            background-image: url("https://www.transparenttextures.com/patterns/leather.png");
            color: #fff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2;
        }

        /* INSIDE LEFT PAGE (White) */
        .back {
            background: #fff;
            transform: rotateY(180deg); /* Pre-rotated to face backwards */
            display: flex; justify-content: center; align-items: center;
        }

        /* SPINE */
        .spine {
            position: absolute; left: 0; top: 0; bottom: 0; width: 50px;
            background-color: #800000;
            background-image: url("https://www.transparenttextures.com/patterns/leather.png");
            transform-origin: left; 
            transform: rotateY(-90deg);
            display: flex; align-items: center; justify-content: center;
        }
        .spine span { transform: rotate(90deg); color: rgba(255,255,255,0.7); font-size: 2rem; letter-spacing: 5px; white-space: nowrap; }

        /* GRID SYSTEM */
        .sheet { width: 90%; height: 95%; background: #f4f4f4; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; padding: 15px; box-sizing: border-box; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
        
        .slot { 
            background: #fff; border: 1px solid #ccc; position: relative; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; overflow: hidden; 
        }
        .slot:hover { transform: scale(1.05); z-index: 20; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .slot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
        .slot::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1) 100%); pointer-events: none; z-index: 10; }

        /* MODAL */
        #card-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 20000; display: none; justify-content: center; align-items: center; }
        #big-card { width: 400px; height: 560px; position: relative; }
        .card-face img { width: 100%; }
        .close-modal { position: absolute; top: 30px; right: 30px; color: #fff; font-size: 2rem; cursor: pointer; }
        
        @media (max-width: 1100px) { .binder { width: 90vw; height: 120vw; } }
    </style>
</head>
<body>

    <div style="background:green; color:white; text-align:center; padding:5px;"><b>VERSION 7.0: FLIP WRAPPER FIX</b></div>
    <div id="nav-placeholder"></div>

    <div class="shelf">
        
        <div class="binder closed roster" onclick="toggleBinder(this)">
            
            <div class="spine"><span>ROSTER</span></div>

            <div class="flip-wrapper">
                <div class="face front">
                    <h1>THE ROSTER</h1>
                </div>
                <div class="face back">
                    <div class="sheet">
                        <div class="slot" onclick="event.stopPropagation(); inspectCard('dewshine')">
                            <img src="dewshinetradingcard.jpg">
                        </div>
                        
                        <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                        <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                    </div>
                </div>
            </div>
            
            <div class="base-page">
                <div class="sheet">
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                </div>
            </div>

        </div>

    </div>

    <div id="card-modal">
        <div class="close-modal" onclick="document.getElementById('card-modal').style.display='none'">&times;</div>
        <div id="big-card"><div class="card-face"><img id="m-front" src=""></div></div>
    </div>

    <script>
        fetch('nav.html').then(r=>r.text()).then(d=>document.getElementById('nav-placeholder').innerHTML=d).catch(e=>console.log("Nav missing"));

        function toggleBinder(el) {
            el.classList.toggle('closed');
            el.classList.toggle('open');
            if(el.classList.contains('open')) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
        }

        function inspectCard() {
            document.getElementById('m-front').src = "dewshinetradingcard.jpg";
            document.getElementById('card-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
