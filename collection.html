<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL Collection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
    <style>
        /* --- GLOBAL RESET --- */
        body { 
            background-color: #111; 
            background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            font-family: 'Arial Black', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            margin: 0; 
            overflow-x: hidden;
        }
        
        #nav-placeholder { position: relative; z-index: 10000; }
        
        /* --- SHELF LAYOUT --- */
        .shelf { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 100px; 
            padding: 50px 10px; /* Reduced padding for mobile */
            perspective: 3000px;
        }

        /* --- THE BINDER (RESPONSIVE) --- */
        .binder { 
            position: relative; 
            width: 500px; /* Desktop Size */
            height: 650px; 
            transform-style: preserve-3d; 
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; 
            max-width: 90vw; /* MOBILE FIX: Never be wider than 90% of screen */
        }

        /* Opening Animation: Desktop (Shift Right) */
        .binder.open { transform: translateX(250px); }

        /* COLORS & TEXTURES */
        :root { --binder-texture: url("https://www.transparenttextures.com/patterns/leather.png"); }
        .binder.winners .front, .binder.winners .spine { background-color: #D4AF37; }
        .binder.roster .front, .binder.roster .spine { background-color: #800000; }

        /* --- MOVING PART (Cover + Inside Left) --- */
        .flip-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transform-origin: left;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }
        .binder.closed .flip-wrapper { transform: rotateY(-25deg); }
        .binder.open .flip-wrapper { transform: rotateY(-180deg); }

        /* SHARED FACE STYLES */
        .face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 5px 10px 10px 5px;
            border: 2px solid #222;
        }

        /* FRONT COVER */
        .front {
            background-image: var(--binder-texture);
            color: #fff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .front img { width: 30%; max-width: 100px; margin-bottom: 15px; }
        .front h1 { font-size: 2rem; text-align: center; }

        /* INSIDE LEFT */
        .back {
            background: #fff;
            transform: rotateY(180deg);
            display: flex; justify-content: center; align-items: center;
        }

        /* STATIC RIGHT PAGE */
        .base-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            border-radius: 0 10px 10px 0;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            z-index: 1; 
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #222;
        }

        /* SPINE */
        .spine {
            position: absolute; left: 0; top: 0; bottom: 0; width: 40px;
            background-image: var(--binder-texture);
            transform-origin: left; 
            transform: rotateY(-90deg);
            display: flex; align-items: center; justify-content: center;
            border-radius: 5px 0 0 5px;
        }
        .spine span { 
            transform: rotate(90deg); color: rgba(255,255,255,0.7); 
            font-size: 1.5rem; letter-spacing: 5px; white-space: nowrap; 
        }

        /* GRID SYSTEM */
        .sheet { 
            width: 92%; height: 96%; background: #f4f4f4; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 5px; padding: 10px; 
            box-sizing: border-box; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1); 
        }
        
        .slot { 
            background: #fff; border: 1px solid rgba(0,0,0,0.1); 
            position: relative; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; 
        }
        .slot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
        .slot::after { 
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%; 
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1) 100%); 
            pointer-events: none; z-index: 10; 
        }

        /* --- MODAL --- */
        #card-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 20000; 
            display: none; justify-content: center; align-items: center; 
            perspective: 1000px;
        }
        
        #big-card { 
            width: 400px; height: 560px; position: relative; 
            transform-style: preserve-3d; transition: 0.6s; cursor: pointer;
            max-width: 90vw; max-height: 80vh; /* Mobile Modal Fix */
        }
        #big-card.flipped { transform: rotateY(180deg); }
        
        .card-face { 
            position: absolute; width: 100%; height: 100%; 
            backface-visibility: hidden; border-radius: 10px; 
            background: #fff; overflow: hidden; 
        }
        .card-face img { width: 100%; height: 100%; object-fit: contain; }
        
        .card-back { 
            transform: rotateY(180deg); background: #e6e6e6; 
            padding: 20px; display: flex; flex-direction: column; 
            align-items: center; text-align: center; color: #111; 
            font-family: 'Arial', sans-serif; overflow-y: auto;
        }

        .close-modal { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; z-index: 20001; }

        /* ========================================= */
        /* MOBILE SPECIFIC RULES (The Magic Part)    */
        /* ========================================= */
        @media (max-width: 768px) {
            .shelf { padding-top: 50px; }
            
            .binder {
                /* On phone, height is based on width to keep aspect ratio */
                height: 125vw; 
                max-height: 600px;
            }

            /* On mobile, we DON'T shift right (no room). We just open. */
            .binder.open { transform: translateX(0); }
            
            /* Adjust font sizes for tiny screens */
            .front h1 { font-size: 1.5rem; }
            .spine span { font-size: 1.2rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="shelf">
        
        <div class="binder closed winners" onclick="toggleBinder(this)">
            <div class="spine"><span>WINNERS</span></div>
            <div class="flip-wrapper">
                <div class="face front">
                    <img src="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
                    <h1>VICTORY LANE</h1>
                </div>
                <div class="face back"><div class="sheet" id="winners-L"></div></div>
            </div>
            <div class="base-page"><div class="sheet" id="winners-R"></div></div>
        </div>

        <div class="binder closed roster" onclick="toggleBinder(this)">
            <div class="spine"><span>ROSTER</span></div>
            <div class="flip-wrapper">
                <div class="face front">
                    <img src="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
                    <h1>THE ROSTER</h1>
                </div>
                <div class="face back"><div class="sheet" id="roster-L"></div></div>
            </div>
            <div class="base-page"><div class="sheet" id="roster-R"></div></div>
        </div>

    </div>

    <div id="card-modal">
        <div class="close-modal" onclick="document.getElementById('card-modal').style.display='none'">&times;</div>
        <div id="big-card" onclick="this.classList.toggle('flipped')">
            <div class="card-face"><img id="m-front" src=""></div>
            <div class="card-face card-back" id="m-back"></div>
        </div>
    </div>

    <script>
        fetch('nav.html').then(r=>r.text()).then(d=>document.getElementById('nav-placeholder').innerHTML=d).catch(e=>console.log("Nav missing"));
        function toggleMenu() { document.getElementById('nav-menu').classList.toggle('open'); }

        // --- DATA ---
        const rosterData = [
            {
                front: "dewshinetradingcard.jpg", 
                title: "DEWSHINE",
                text: "Apex Racing<br>Car #77<br>Cup Series",
                stats: { "Wins": "0", "Top 5s": "3", "Avg Fin": "9.4" }
            }
        ];
        const winnersData = [];

        // --- LOGIC ---
        function toggleBinder(el) {
            document.querySelectorAll('.binder').forEach(b => {
                if(b !== el) { b.classList.add('closed'); b.classList.remove('open'); }
            });
            el.classList.toggle('closed');
            el.classList.toggle('open');
            if(el.classList.contains('open')) {
                // Smooth scroll, but give the browser time to render the animation first
                setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
            }
        }

        function fillBinder(data, leftSheetId, rightSheetId) {
            const leftEl = document.getElementById(leftSheetId);
            const rightEl = document.getElementById(rightSheetId);
            const totalSlots = 18;

            for (let i = 0; i < totalSlots; i++) {
                const targetPage = (i < 9) ? leftEl : rightEl;
                const cardInfo = (i < data.length) ? data[i] : null;
                createSlot(cardInfo, targetPage);
            }
        }

        function createSlot(data, parent) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            if (data) {
                const img = document.createElement('img');
                img.src = data.front;
                img.onerror = function() { this.style.display='none'; slot.style.background='#ffcccc'; slot.innerHTML = 'ERR'; };
                slot.appendChild(img);
                slot.onclick = (e) => { e.stopPropagation(); openModal(data); };
            }
            parent.appendChild(slot);
        }

        function openModal(data) {
            const modal = document.getElementById('card-modal');
            const front = document.getElementById('m-front');
            const back = document.getElementById('m-back');
            const card = document.getElementById('big-card');

            front.src = data.front;

            let statsHtml = '';
            if(data.stats) {
                statsHtml = '<div class="stats-block" style="width:100%; margin-top:15px; border-top:1px solid #ccc; padding-top:10px;">';
                for (const [key, value] of Object.entries(data.stats)) {
                    statsHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; font-weight:bold; border-bottom:1px solid #eee;"><span>${key}</span><span>${value}</span></div>`;
                }
                statsHtml += '</div>';
            }

            back.innerHTML = `
                <h2 style="color:#c00; margin-bottom:5px;">${data.title}</h2>
                <p>${data.text}</p>
                ${statsHtml}
                <div style="margin-top:auto; font-size:0.7rem; color:#888;">ASCRL OFFICIAL TRADING CARD</div>
            `;
            
            card.classList.remove('flipped');
            modal.style.display = 'flex';
        }

        fillBinder(winnersData, 'winners-L', 'winners-R');
        fillBinder(rosterData, 'roster-L', 'roster-R');
    </script>
</body>
</html>
