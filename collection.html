<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections | American Stock Car Racing League</title>
    
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- 1. GLOBAL VARIABLES & BACKGROUND --- */
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #000;
            --card-bg: #0d0d0d;
            --border: #1a1a1a;
            --text-muted: #a0a0a0;
            
            --cup-blue: #0077ff;
            --xfinity-purple: #8000b0;
            --truck-red: #c00;
            --menards-yellow: #fff200;

            --binder-texture: url("https://www.transparenttextures.com/patterns/leather.png");
        }

        body { 
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            background-color: #333333; 
            background-image: 
                radial-gradient(transparent 0%, #000 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.35'/%3E%3C/svg%3E");
            background-attachment: fixed;
            color: #fff; 
            overflow-x: hidden; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #nav-placeholder { position: relative; z-index: 2000; }

        /* --- 2. HERO SECTION STYLES --- */
        .hero { 
            position: relative; 
            overflow: hidden; 
            background: radial-gradient(circle at center, #222 0%, #000 100%); 
            padding: 8rem 1rem 4rem; 
            text-align: center; 
            border-bottom: 1px solid var(--border);
        }
        .hero::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-conic-gradient(rgba(255,255,255,0.03) 0% 25%, transparent 0% 50%) 50% / 80px 80px;
            pointer-events: none;
        }
        
        .hero h1 { font-size: clamp(3rem, 10vw, 6rem); margin: 0; letter-spacing: -2px; position: relative; z-index: 1; }
        .text-gradient {
            background: linear-gradient(to bottom, #fff 30%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- 3. BINDER SHELF STYLES --- */
        .shelf { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 100px; 
            padding: 50px 10px;
            perspective: 3000px;
        }

        /* Binder Wrapper - DESKTOP DEFAULTS */
        .binder { 
            position: relative; 
            width: 500px; 
            height: 650px; 
            transform-style: preserve-3d; 
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; 
        }

        .binder.open { transform: translateX(250px); }

        /* Color Variants */
        .binder.winners .front, .binder.winners .spine { background-color: #D4AF37; }
        .binder.roster .front, .binder.roster .spine { background-color: #800000; }

        /* Moving Part (Cover + Inside Left) */
        .flip-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transform-origin: left;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }
        .binder.closed .flip-wrapper { transform: rotateY(-25deg); }
        .binder.open .flip-wrapper { transform: rotateY(-180deg); }

        /* Faces */
        .face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 5px 10px 10px 5px;
            border: 2px solid #222;
        }

        /* Front Cover */
        .front {
            background-image: var(--binder-texture);
            color: #fff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .front img { width: 30%; max-width: 100px; margin-bottom: 15px; }
        .front h1 { font-size: 2rem; text-align: center; }

        /* Inside Left */
        .back {
            background: #fff;
            transform: rotateY(180deg);
            display: flex; justify-content: center; align-items: center;
        }

        /* Static Right Page */
        .base-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            border-radius: 0 10px 10px 0;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            z-index: 1; 
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #222;
        }

        /* Spine */
        .spine {
            position: absolute; left: 0; top: 0; bottom: 0; width: 40px;
            background-image: var(--binder-texture);
            transform-origin: left; 
            transform: rotateY(-90deg);
            display: flex; align-items: center; justify-content: center;
            border-radius: 5px 0 0 5px;
        }
        .spine span { 
            transform: rotate(90deg); color: rgba(255,255,255,0.7); 
            font-size: 1.5rem; letter-spacing: 5px; white-space: nowrap; 
        }

        /* Grid System */
        .sheet { 
            width: 92%; height: 96%; background: #f4f4f4; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 5px; padding: 10px; 
            box-sizing: border-box; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1); 
        }
        
        .slot { 
            background: #fff; border: 1px solid rgba(0,0,0,0.1); 
            position: relative; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; 
        }
        .slot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
        .slot::after { 
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%; 
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1) 100%); 
            pointer-events: none; z-index: 10; 
        }

        /* --- MODAL --- */
        #card-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 20000; 
            display: none; justify-content: center; align-items: center; 
            perspective: 1000px;
            cursor: pointer;
        }
        
        #big-card { 
            width: 400px; height: 560px; position: relative; 
            transform-style: preserve-3d; transition: 0.6s; cursor: pointer;
            max-width: 90vw; max-height: 80vh;
        }
        #big-card.flipped { transform: rotateY(180deg); }
        
        .card-face { 
            position: absolute; width: 100%; height: 100%; 
            backface-visibility: hidden; border-radius: 10px; 
            background: #fff; overflow: hidden; 
        }
        .card-face img { width: 100%; height: 100%; object-fit: contain; }
        
        .card-back { 
            transform: rotateY(180deg); background: #e6e6e6; 
            padding: 20px; display: flex; flex-direction: column; 
            align-items: center; text-align: center; color: #111; 
            font-family: 'Arial', sans-serif; overflow-y: auto;
        }

        /* ========================================= */
        /* MOBILE OPTIMIZATION RULES                 */
        /* ========================================= */
        @media (max-width: 768px) {
            .shelf { padding-top: 50px; }
            
            /* 1. Make the CLOSED binder roughly half the screen width */
            .binder { 
                width: 44vw;  /* Just under half width */
                height: 60vw; /* Keep aspect ratio */
            }

            /* 2. When OPEN, shift it so the spine is in the middle */
            /* Since width is 44vw, opening it makes total width 88vw. Perfect for mobile. */
            .binder.open { 
                transform: translateX(22vw); 
            }
            
            /* 3. Scale down text so it fits the smaller cover */
            .front h1 { font-size: 1rem; }
            .spine span { font-size: 0.9rem; letter-spacing: 2px; }
            
            /* 4. Adjust grid padding for small slots */
            .sheet { gap: 2px; padding: 5px; }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <header class="hero">
        <p style="letter-spacing: 8px; color: var(--primary); text-transform: uppercase; font-size: 0.8rem;">Official League Portal</p>
        <h1 class="text-gradient">COLLECTIONS</h1>
        <div style="margin-top: 1rem; position: relative; z-index: 2;">
            <p style="color: #ccc; font-family: sans-serif; font-size: 0.9rem; letter-spacing: 1px;">
                TRADING CARDS • HISTORY • HALL OF FAME
            </p>
        </div>
    </header>

    <div class="shelf">
        
        <div class="binder closed winners" onclick="toggleBinder(this)">
            <div class="spine"><span>WINNERS</span></div>
            <div class="flip-wrapper">
                <div class="face front">
                    <img src="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
                    <h1>VICTORY LANE</h1>
                </div>
                <div class="face back"><div class="sheet" id="winners-L"></div></div>
            </div>
            <div class="base-page"><div class="sheet" id="winners-R"></div></div>
        </div>

        <div class="binder closed roster" onclick="toggleBinder(this)">
            <div class="spine"><span>ROSTER</span></div>
            <div class="flip-wrapper">
                <div class="face front">
                    <img src="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
                    <h1>THE ROSTER</h1>
                </div>
                <div class="face back"><div class="sheet" id="roster-L"></div></div>
            </div>
            <div class="base-page"><div class="sheet" id="roster-R"></div></div>
        </div>

    </div>

    <div id="card-modal" onclick="this.style.display='none'">
        <div id="big-card" onclick="event.stopPropagation(); this.classList.toggle('flipped')">
            <div class="card-face"><img id="m-front" src=""></div>
            <div class="card-face card-back" id="m-back"></div>
        </div>
    </div>

    <script>
        fetch('nav.html').then(r=>r.text()).then(d=>document.getElementById('nav-placeholder').innerHTML=d).catch(e=>console.log("Nav missing"));
        function toggleMenu() { document.getElementById('nav-menu').classList.toggle('open'); }

        // --- DATA ---
        const rosterData = [
            {
                front: "dewshinetradingcard.jpg", 
                title: "DEWSHINE",
                text: "Apex Racing<br>Car #77<br>Cup Series",
                stats: { "Wins": "0", "Top 5s": "3", "Avg Fin": "9.4" }
            }
        ];
        const winnersData = [];

        // --- LOGIC ---
        function toggleBinder(el) {
            document.querySelectorAll('.binder').forEach(b => {
                if(b !== el) { b.classList.add('closed'); b.classList.remove('open'); }
            });
            el.classList.toggle('closed');
            el.classList.toggle('open');
            if(el.classList.contains('open')) {
                setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
            }
        }

        function fillBinder(data, leftSheetId, rightSheetId) {
            const leftEl = document.getElementById(leftSheetId);
            const rightEl = document.getElementById(rightSheetId);
            const totalSlots = 18;

            for (let i = 0; i < totalSlots; i++) {
                const targetPage = (i < 9) ? leftEl : rightEl;
                const cardInfo = (i < data.length) ? data[i] : null;
                createSlot(cardInfo, targetPage);
            }
        }

        function createSlot(data, parent) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            if (data) {
                const img = document.createElement('img');
                img.src = data.front;
                img.onerror = function() { this.style.display='none'; slot.style.background='#ffcccc'; slot.innerHTML = 'ERR'; };
                slot.appendChild(img);
                slot.onclick = (e) => { e.stopPropagation(); openModal(data); };
            }
            parent.appendChild(slot);
        }

        function openModal(data) {
            const modal = document.getElementById('card-modal');
            const front = document.getElementById('m-front');
            const back = document.getElementById('m-back');
            const card = document.getElementById('big-card');

            front.src = data.front;

            let statsHtml = '';
            if(data.stats) {
                statsHtml = '<div class="stats-block" style="width:100%; margin-top:15px; border-top:1px solid #ccc; padding-top:10px;">';
                for (const [key, value] of Object.entries(data.stats)) {
                    statsHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; font-weight:bold; border-bottom:1px solid #eee;"><span>${key}</span><span>${value}</span></div>`;
                }
                statsHtml += '</div>';
            }

            back.innerHTML = `
                <h2 style="color:#c00; margin-bottom:5px;">${data.title}</h2>
                <p>${data.text}</p>
                ${statsHtml}
                <div style="margin-top:auto; font-size:0.7rem; color:#888;">ASCRL OFFICIAL TRADING CARD</div>
            `;
            
            card.classList.remove('flipped');
            modal.style.display = 'flex';
        }

        fillBinder(winnersData, 'winners-L', 'winners-R');
        fillBinder(rosterData, 'roster-L', 'roster-R');
    </script>
    <script>
        // 1. Disable Right Click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // 2. Disable Keyboard Shortcuts (Ctrl+U, F12, Ctrl+Shift+I, etc.)
        document.addEventListener('keydown', (e) => {
            // Check for Ctrl (or Command on Mac)
            if (e.ctrlKey || e.metaKey) {
                switch (e.key.toLowerCase()) {
                    case 'u': // View Source
                    case 's': // Save Page
                    case 'a': // Select All
                    case 'c': // Copy
                        e.preventDefault();
                        return false;
                }
                // Check for Ctrl+Shift+I or J (Developer Tools)
                if (e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j')) {
                    e.preventDefault();
                    return false;
                }
            }
            
            // Check for F12 (Developer Tools)
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
