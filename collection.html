<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL Collection</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        body { background-color: #111; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* IMAGE TEST BANNER */
        .server-test {
            background: #222; color: white; padding: 20px; text-align: center; border-bottom: 1px solid #444;
        }
        .server-test img { height: 100px; border: 2px solid lime; margin: 10px; }

        /* BINDER STYLES */
        .shelf { display: flex; flex-direction: column; align-items: center; gap: 100px; padding: 50px 20px; perspective: 3000px; }
        .binder { position: relative; width: 500px; height: 650px; transform-style: preserve-3d; transition: 0.8s; cursor: pointer; }
        .binder.closed { transform: rotateY(-25deg) rotateX(5deg); }
        .binder.open { transform: translateX(250px) rotateY(0deg); z-index: 100; }
        
        /* COLORS */
        .binder.roster .cover, .binder.roster .spine { background-color: #800000; }

        /* PARTS */
        .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 50px; transform-origin: left; transform: rotateY(-90deg); background: inherit; border-radius: 5px 0 0 5px; display: flex; align-items: center; justify-content: center; }
        .spine span { transform: rotate(90deg); color: rgba(255,255,255,0.7); font-size: 2rem; letter-spacing: 5px; white-space: nowrap; }
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-style: preserve-3d; transition: 0.8s; border: 2px solid #222; }
        .cover { z-index: 10; transform-origin: left; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; border-radius: 5px 10px 10px 5px; backface-visibility: hidden; }
        .binder.open .cover { transform: rotateY(-180deg); }
        .inside-cover { background: #fff; transform-origin: left; transform: rotateY(-180deg); z-index: 5; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; }
        .binder.open .inside-cover { transform: rotateY(-180deg); z-index: 11; }
        .base-page { background: #fff; z-index: 1; border-radius: 0 10px 10px 0; }

        /* SLOTS */
        .sheet { width: 90%; height: 95%; background: #f4f4f4; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; padding: 15px; box-sizing: border-box; }
        .slot { background: #fff; border: 1px solid #ddd; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .slot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
        
        /* ERROR HANDLING */
        img:not([src]) { display: none; }
    </style>
</head>
<body>

    <div class="server-test">
        <h3>SERVER IMAGE TEST</h3>
        <p>If you see the image below, the link is GOOD.</p>
        <img src="DewshineTradingCard.jpg" alt="Direct Relative Link">
    </div>

    <div class="shelf">
        <div class="binder closed roster" onclick="this.classList.toggle('closed'); this.classList.toggle('open')">
            <div class="spine"><span>ROSTER</span></div>
            <div class="page cover"><h1>ROSTER</h1></div>
            
            <div class="page inside-cover">
                <div class="sheet">
                    <div class="slot">
                        <img src="DewshineTradingCard.jpg" alt="Dewshine Card">
                    </div>
                    <div class="slot"></div><div class="slot"></div>
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                </div>
            </div>
            
            <div class="page base-page">
                <div class="sheet">
                     <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
