name: Publish News Article

on:
  repository_dispatch:
    types: [new_article]
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Create article file
        if: github.event_name == 'repository_dispatch'
        run: |
          mkdir -p news
          echo "${{ github.event.client_payload.content }}" > ${{ github.event.client_payload.filename }}
          
      - name: Commit and push
        if: github.event_name == 'repository_dispatch'
        run: |
          git config user.name "ASCRL Bot"
          git config user.email "bot@ascrl.com"
          git add ${{ github.event.client_payload.filename }}
          git commit -m "New article: ${{ github.event.client_payload.title }}"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
