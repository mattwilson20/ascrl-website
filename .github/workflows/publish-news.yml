name: Publish News Article

on:
  repository_dispatch:
    types: [new_article]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create article file
        if: github.event_name == 'repository_dispatch'
        env:
          ARTICLE_FILENAME: ${{ github.event.client_payload.filename }}
          ARTICLE_CONTENT: ${{ github.event.client_payload.content }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          filename = os.environ["ARTICLE_FILENAME"].strip()
          content = os.environ["ARTICLE_CONTENT"]

          if not filename:
              raise SystemExit("Missing article filename.")

          path = Path(filename)

          # Keep generated articles inside the news folder unless your bot already sends news/filename.html.
          if path.parts[0] != "news":
              path = Path("news") / path.name

          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(content, encoding="utf-8")

          print(f"Wrote article: {path}")
          PY

      - name: Commit and push article
        if: github.event_name == 'repository_dispatch'
        run: |
          git config user.name "ASCRL Bot"
          git config user.email "bot@ascrl.com"
          git add news/
          git diff --cached --quiet && echo "No article changes to commit." && exit 0
          git commit -m "New article: ${{ github.event.client_payload.title }}"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
