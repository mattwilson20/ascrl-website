<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season Calendar | American Stock Car Racing League</title>
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #050505;
            --card-bg: #111;
            --border: #222;
            --text-muted: #888;
            --cup-blue: #0077ff;
            --xfinity-purple: #8000b0;
            --truck-red: #c00;
            --menards-yellow: #fff200;
            --gold: #ffd700;
        }

        body { 
            margin: 0; font-family: 'Arial Black', sans-serif; 
            background-color: #111; color: #fff; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #222 0%, #000 70%);
            background-attachment: fixed;
        }

        /* --- NAV PLACEHOLDER --- */
        #nav-placeholder { position: relative; z-index: 2000; }

        /* --- HERO SECTION --- */
        .hero {
            padding: 8rem 1rem 4rem; text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), #050505), 
                        url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            border-bottom: 4px solid var(--primary);
        }
        h1 { font-size: clamp(3rem, 8vw, 5rem); margin: 0; letter-spacing: -2px; text-transform: uppercase; color: #fff; text-shadow: 0 5px 15px rgba(0,0,0,0.8); }
        .subtitle { letter-spacing: 4px; color: var(--primary); text-transform: uppercase; margin-top: 10px; font-size: 0.9rem; }

        /* --- CONTROLS --- */
        .controls-bar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            display: flex; flex-direction: column; gap: 1rem; align-items: center;
        }

        /* Season Selector (Dropdown) */
        .season-select-wrapper { position: relative; width: 100%; max-width: 300px; }
        .season-select {
            width: 100%; padding: 12px; background: #222; color: #fff;
            border: 1px solid #444; border-radius: 4px;
            font-family: 'Arial Black', sans-serif; font-size: 1rem;
            appearance: none; cursor: pointer; text-align: center;
        }
        .season-select:hover { border-color: var(--primary); }

        /* Series Buttons */
        .tabs-container { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .series-btn {
            background: transparent; border: 1px solid #444; color: #aaa;
            padding: 10px 20px; border-radius: 30px; cursor: pointer;
            font-family: 'Arial Black', sans-serif; font-size: 0.8rem;
            transition: 0.3s; text-transform: uppercase;
        }
        .series-btn:hover { color: #fff; border-color: #fff; }
        
        .series-btn[data-series="Cup"].active { background: var(--cup-blue); border-color: var(--cup-blue); color: #fff; box-shadow: 0 0 15px rgba(0,119,255,0.4); }
        .series-btn[data-series="Xfinity"].active { background: var(--xfinity-purple); border-color: var(--xfinity-purple); color: #fff; box-shadow: 0 0 15px rgba(128,0,176,0.4); }
        .series-btn[data-series="Truck"].active { background: var(--truck-red); border-color: var(--truck-red); color: #fff; box-shadow: 0 0 15px rgba(204,0,0,0.4); }
        .series-btn[data-series="Menards"].active { background: var(--menards-yellow); border-color: var(--menards-yellow); color: #000; box-shadow: 0 0 15px rgba(255,242,0,0.4); }

        /* --- MAIN LAYOUT --- */
        .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; }
        
        .section-header {
            font-size: 2rem; color: #fff; margin: 3rem 0 1.5rem; 
            border-left: 5px solid #444; padding-left: 15px; text-transform: uppercase;
        }

        /* --- TICKET CARD DESIGN --- */
        .race-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }

        .race-ticket {
            background: #161616;
            border: 1px solid #333;
            border-left: 4px solid #444; /* Default Color */
            position: relative;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
            clip-path: polygon(
                0 0, 100% 0, 
                100% calc(50% - 10px), 95% 50%, 100% calc(50% + 10px), 
                100% 100%, 0 100%
            ); /* Notched Ticket Shape */
            min-height: 180px;
        }

        .race-ticket:hover { transform: translateY(-5px); border-color: #666; }
        .race-ticket.completed { opacity: 0.6; filter: grayscale(0.8); }

        .ticket-header {
            padding: 1.5rem;
            border-bottom: 2px dashed #222;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .race-date-box { text-align: center; background: #000; padding: 5px 10px; border: 1px solid #333; border-radius: 4px; }
        .rd-month { display: block; font-size: 0.7rem; color: var(--primary); letter-spacing: 1px; }
        .rd-day { display: block; font-size: 1.8rem; line-height: 1; color: #fff; }

        .ticket-body { padding: 1.5rem; flex-grow: 1; }
        .track-name { font-size: 1.2rem; margin: 0; text-transform: uppercase; color: #fff; }
        .race-sub { font-size: 0.8rem; color: #666; font-family: sans-serif; margin-top: 5px; }

        .winner-pill {
            margin-top: 15px; display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 4px;
            font-size: 0.75rem; color: #ddd; border: 1px solid #333;
        }

        /* --- THE CHASE (SPECIAL STYLING) --- */
        .chase-section {
            margin-top: 5rem;
            padding: 2rem;
            background: linear-gradient(135deg, #1a1a00 0%, #000 100%);
            border: 1px solid #443300;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        
        /* Gold Glow Effect */
        .chase-section::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .chase-header {
            text-align: center; margin-bottom: 3rem; position: relative; z-index: 2;
        }
        .chase-header h2 { font-size: 3rem; color: var(--gold); text-shadow: 0 0 20px rgba(255, 215, 0, 0.3); margin: 0; }
        .chase-header p { color: #aaa; letter-spacing: 3px; text-transform: uppercase; font-size: 0.9rem; }

        .chase-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; position: relative; z-index: 2; }

        .chase-ticket {
            background: #0d0d0d;
            border: 1px solid #443300;
            border-left: 4px solid var(--gold);
            position: relative;
            transition: 0.3s;
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); /* Angled corner */
        }
        
        .chase-ticket:hover { box-shadow: 0 0 15px rgba(255, 215, 0, 0.1); border-color: var(--gold); transform: scale(1.02); }

        .chase-ticket .track-name { color: var(--gold); }
        .chase-ticket .race-date-box { border-color: #443300; background: #1a1a00; }
        .chase-ticket .rd-month { color: #fff; }

        /* --- FOOTER --- */
        footer { padding: 4rem 1rem; text-align: center; border-top: 1px solid var(--border); color: #333; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; }

        @media (max-width: 768px) {
            .hero { padding-top: 10rem; }
            h1 { font-size: 2.5rem; }
            .chase-header h2 { font-size: 2rem; }
            /* Remove fancy clip-paths on mobile if rendering issues occur, but usually fine */
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <header class="hero">
        <p class="subtitle">Official League Calendar</p>
        <h1>Race Schedule</h1>
    </header>

    <div class="controls-bar">
        <div class="season-select-wrapper">
            <select id="seasonSelect" class="season-select" onchange="loadSchedule()">
                <option value="current">2025-2026 Season (Current)</option>
                <option value="2026">2026 Season (Next)</option>
            </select>
        </div>

        <div class="tabs-container">
            <button class="series-btn active" data-series="Cup" onclick="switchSeries('Cup')">Cup</button>
            <button class="series-btn" data-series="Xfinity" onclick="switchSeries('Xfinity')">Xfinity</button>
            <button class="series-btn" data-series="Truck" onclick="switchSeries('Truck')">Trucks</button>
            <button class="series-btn" data-series="Menards" onclick="switchSeries('Menards')">Menards</button>
        </div>
    </div>

    <main class="container">
        
        <div id="regular-season-wrapper">
            <h2 class="section-header">Regular Season</h2>
            <div id="regular-grid" class="race-grid">
                </div>
        </div>

        <div id="chase-wrapper" class="chase-section" style="display:none;">
            <div class="chase-header">
                <p>The Playoffs</p>
                <h2>THE CHASE FOR THE CUP</h2>
            </div>
            <div id="chase-grid" class="chase-grid">
                </div>
        </div>

    </main>

    <footer>
        <div>© 2025-2026 AMERICAN STOCK CAR RACING LEAGUE</div>
    </footer>

    <script>
        // 1. NAV LOADER
        fetch('nav.html').then(r=>r.text()).then(d=>document.getElementById('nav-placeholder').innerHTML=d);

        // 2. CONFIG
        // ** UPDATE THESE FILE NAMES TO MATCH YOUR REPO **
        const FILES = {
            "current": "schedule.json",          // The file you use now
            "2026": "ASCRL_2026_Schedule.json"   // The new file you uploaded
        };
        
        let rawData = {};
        let currentSeries = 'Cup';

        // 3. LOAD DATA
        function loadSchedule() {
            const seasonKey = document.getElementById('seasonSelect').value;
            const file = FILES[seasonKey];

            document.getElementById('regular-grid').innerHTML = '<p style="color:#666;">Loading Data...</p>';
            document.getElementById('chase-grid').innerHTML = '';
            document.getElementById('chase-wrapper').style.display = 'none';

            fetch(file)
                .then(r => r.json())
                .then(data => {
                    rawData = data;
                    renderSeries();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('regular-grid').innerHTML = '<p style="color:#c00;">Schedule data not found.</p>';
                });
        }

        // 4. SWITCH SERIES
        function switchSeries(seriesName) {
            currentSeries = seriesName;
            
            // Update Buttons
            document.querySelectorAll('.series-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.series === seriesName) btn.classList.add('active');
            });

            renderSeries();
        }

        // 5. RENDER LOGIC
        function renderSeries() {
            const regContainer = document.getElementById('regular-grid');
            const chaseContainer = document.getElementById('chase-grid');
            const chaseWrapper = document.getElementById('chase-wrapper');

            regContainer.innerHTML = '';
            chaseContainer.innerHTML = '';
            
            // Handle case sensitivity keys in JSON
            const sKey = Object.keys(rawData).find(k => k.toLowerCase() === currentSeries.toLowerCase());
            
            if(!sKey || !rawData[sKey]) {
                regContainer.innerHTML = '<p>No races found for this series.</p>';
                chaseWrapper.style.display = 'none';
                return;
            }

            const races = rawData[sKey];
            let hasChase = false;
            const today = new Date();
            today.setHours(0,0,0,0);

            races.forEach(race => {
                // Determine if Race is Past
                const rDate = new Date(race.date + "T12:00:00");
                const isCompleted = rDate < today;
                
                // Date Formatting
                const month = rDate.toLocaleString('default', {month:'short'}).toUpperCase();
                const day = rDate.getDate();
                
                // Winner HTML (If exists in JSON)
                let footerHtml = isCompleted ? '<div class="winner-pill">Completed</div>' : '';
                if(race.winner) {
                    footerHtml = `<div class="winner-pill"><i class="fa-solid fa-trophy" style="color:var(--gold)"></i> ${race.winner}</div>`;
                } else if (!isCompleted) {
                     footerHtml = `<div class="winner-pill" style="border-color:var(--primary); color:var(--primary)">UPCOMING</div>`;
                }

                // --- TEMPLATE GENERATION ---
                if (race.is_chase) {
                    // CHASE TICKET STYLE
                    hasChase = true;
                    const html = `
                    <div class="chase-ticket ${isCompleted ? 'completed' : ''}">
                        <div class="ticket-header">
                            <div class="race-date-box">
                                <span class="rd-month">${month}</span>
                                <span class="rd-day">${day}</span>
                            </div>
                            <i class="fa-solid fa-flag-checkered" style="color:#444; font-size:1.5rem;"></i>
                        </div>
                        <div class="ticket-body">
                            <h3 class="track-name">${race.track}</h3>
                            <p class="race-sub">Playoff Round</p>
                            ${footerHtml}
                        </div>
                    </div>`;
                    chaseContainer.innerHTML += html;

                } else {
                    // REGULAR SEASON TICKET STYLE
                    // Dynamic Border Color based on Series
                    let accentColor = "#444";
                    if(currentSeries === 'Cup') accentColor = "var(--cup-blue)";
                    if(currentSeries === 'Xfinity') accentColor = "var(--xfinity-purple)";
                    if(currentSeries === 'Truck') accentColor = "var(--truck-red)";
                    if(currentSeries === 'Menards') accentColor = "var(--menards-yellow)";

                    const html = `
                    <div class="race-ticket ${isCompleted ? 'completed' : ''}" style="border-left-color: ${accentColor}">
                        <div class="ticket-header">
                            <div class="race-date-box">
                                <span class="rd-month">${month}</span>
                                <span class="rd-day">${day}</span>
                            </div>
                            <i class="fa-solid fa-flag" style="color:#333; font-size:1.5rem;"></i>
                        </div>
                        <div class="ticket-body">
                            <h3 class="track-name">${race.track}</h3>
                            <p class="race-sub">Regular Season</p>
                            ${footerHtml}
                        </div>
                    </div>`;
                    regContainer.innerHTML += html;
                }
            });

            // Toggle Chase Visibility
            chaseWrapper.style.display = hasChase ? 'block' : 'none';
        }

        // Initialize
        loadSchedule();
    </script>
</body>
</html>
