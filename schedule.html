<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season Calendar | American Stock Car Racing League</title>
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #000;
            --card-bg: #0d0d0d;
            --border: #1a1a1a;
            --text-muted: #a0a0a0;
            --transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            
            /* Series Colors */
            --cup-blue: #0077ff;
            --xfinity-purple: #8000b0;
            --truck-red: #c00;
            --menards-yellow: #fff200;
        }

        body { 
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            background-color: #333333; 
            background-image: 
                radial-gradient(transparent 0%, #000 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.35'/%3E%3C/svg%3E");
            background-attachment: fixed;
            color: #fff; 
            overflow-x: hidden; 
        }

        /* --- NAVIGATION --- */
        #nav-placeholder { position: relative; z-index: 2000; }

        /* --- HERO --- */
        .hero { 
            background: radial-gradient(circle at center, #222 0%, #000 100%); 
            padding: 12rem 1rem 8rem; 
            text-align: center; 
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: clamp(3rem, 10vw, 5rem); margin: 0; letter-spacing: -2px; line-height: 0.9; }
        .hero p { color: var(--primary); letter-spacing: 5px; text-transform: uppercase; font-size: 0.9rem; margin-top: 1rem; }

        /* --- CONTROLS (TABS) --- */
        .controls { background: #050505; padding: 2rem 1rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
        .tabs-container { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }

        .series-btn {
            background: #111; border: 1px solid #333; color: #fff; 
            padding: 15px 30px; font-family: 'Arial Black', sans-serif; 
            text-transform: uppercase; font-size: 1rem; letter-spacing: 1px;
            cursor: pointer; transition: var(--transition); min-width: 150px;
            position: relative; overflow: hidden;
        }
        .series-btn:hover { transform: translateY(-3px); }
        .series-btn.active { border-color: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .series-btn[data-series="Cup"].active { background: var(--cup-blue); border-color: var(--cup-blue); }
        .series-btn[data-series="Xfinity"].active { background: var(--xfinity-purple); border-color: var(--xfinity-purple); }
        .series-btn[data-series="Truck"].active { background: var(--truck-red); border-color: var(--truck-red); }
        .series-btn[data-series="Menards"].active { background: var(--menards-yellow); border-color: var(--menards-yellow); color: #000; }

        /* --- SCHEDULE LIST --- */
        .container { max-width: 900px; margin: 0 auto; padding: 4rem 2rem; }
        
        .race-item { 
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 2rem; margin-bottom: 1rem; transition: var(--transition);
            position: relative; overflow: hidden;
        }
        
        .race-date { 
            display: flex; flex-direction: column; align-items: center; 
            min-width: 100px; padding-right: 2rem; border-right: 1px solid #222;
        }
        .month { color: var(--primary); font-size: 0.8rem; letter-spacing: 2px; }
        .day { font-size: 2.5rem; line-height: 1; }
        
        .race-info { padding-left: 2rem; flex-grow: 1; text-align: left; z-index: 2; }
        .race-info h3 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: -1px; }
        .race-info p { margin: 5px 0 0; color: var(--text-muted); font-family: sans-serif; font-size: 0.9rem; }

        .race-status { text-align: right; z-index: 2; }
        .status-badge { 
            font-size: 0.7rem; padding: 5px 10px; border: 1px solid #333; 
            border-radius: 4px; text-transform: uppercase; color: #666;
        }

        /* Winner Text */
        .winner-display {
            font-size: 0.9rem; color: #fff; margin-top: 5px;
        }
        .winner-display i { color: var(--accent); margin-right: 5px; }

        /* --- STATES --- */
        .race-item.completed { 
            border-color: #111; 
        }
        .race-item.completed .race-date { opacity: 0.5; }
        
        .race-item.next { 
            border: 1px solid var(--primary); 
            background: linear-gradient(90deg, #0d0d0d 0%, #1a0000 100%);
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(204, 0, 0, 0.15);
        }
        .race-item.next .status-badge { 
            background: var(--primary); color: #fff; border-color: var(--primary); 
        }

        /* --- FOOTER --- */
        footer { padding: 4rem 1rem; text-align: center; border-top: 1px solid var(--border); color: #333; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
        .social-links { display: flex; gap: 2rem; justify-content: center; }
        .social-icon { color: #555; font-size: 1.8rem; transition: 0.3s ease; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .social-icon:hover { transform: translateY(-3px); }

        @media (max-width: 768px) {
            .hero { padding: 10rem 1rem 4rem; }
            .race-item { flex-direction: column; text-align: center; gap: 1rem; }
            .race-date { border-right: none; border-bottom: 1px solid #222; padding-right: 0; padding-bottom: 1rem; width: 100%; }
            .race-info { padding-left: 0; }
            .race-status { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <header class="hero">
        <p>Season Calendar</p>
        <h1>SCHEDULE</h1>
    </header>

    <div class="controls">
        <div class="tabs-container">
            <button class="series-btn active" data-series="Cup" onclick="switchSeries('Cup')">Cup Series</button>
            <button class="series-btn" data-series="Xfinity" onclick="switchSeries('Xfinity')">Xfinity</button>
            <button class="series-btn" data-series="Truck" onclick="switchSeries('Truck')">Trucks</button>
            <button class="series-btn" data-series="Menards" onclick="switchSeries('Menards')">Menards</button>
        </div>
    </div>

    <main class="container">
        <div id="schedule-container">
            <p style="text-align:center; padding:2rem; color:#666;">Loading Schedule...</p>
        </div>
    </main>

    <footer>
        <div style="margin-bottom: 0.5rem; letter-spacing: 2px; color: #fff;">
            © 2025-2026 AMERICAN STOCK CAR RACING LEAGUE
        </div>
        <div style="font-size: 0.65rem; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 2rem; text-transform: uppercase;">
            OWNED AND OPERATED BY <span style="color: #fff; font-weight: bold;">A&M PRODUCTIONS LLC</span>
        </div>
        <div class="social-links">
            <a href="https://www.facebook.com/share/14PeZVCH1hL/" target="_blank" class="social-icon facebook"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://x.com/ASCRWeekly" target="_blank" class="social-icon x-twitter"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="mailto:contact.ascrl@gmail.com" class="social-icon email"><i class="fa-solid fa-envelope"></i></a>
        </div>
        <div style="font-size: 0.6rem; color: #444; margin-top: 20px; font-style: italic;">*ai generated images may be used</div>
    </footer>

    <script>
        // --- 1. MODULAR NAVIGATION ---
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                const activeLink = document.getElementById('nav-schedule'); // Ensure nav.html has this ID
                if (activeLink) {
                    activeLink.style.color = "var(--primary)";
                    activeLink.style.borderLeft = "4px solid var(--primary)";
                    activeLink.style.paddingLeft = "15px";
                }
            })
            .catch(err => console.error("Nav Error:", err));

        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            if (menu) menu.classList.toggle('open');
        }

        // --- 2. SCHEDULE LOGIC ---
        const SCHEDULE_FILE = 'schedule.json';
        let scheduleData = {};
        let currentSeries = 'Cup';

        document.addEventListener('DOMContentLoaded', () => {
            fetch(SCHEDULE_FILE)
                .then(res => res.json())
                .then(data => {
                    scheduleData = data;
                    renderSchedule();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('schedule-container').innerHTML = '<p style="text-align:center;">Failed to load schedule.</p>';
                });
        });

        function switchSeries(seriesName) {
            currentSeries = seriesName;
            
            // Update Buttons
            document.querySelectorAll('.series-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.series === seriesName) btn.classList.add('active');
            });

            renderSchedule();
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';

            const seriesKey = Object.keys(scheduleData).find(k => k.toLowerCase() === currentSeries.toLowerCase());

            if (!seriesKey || !scheduleData[seriesKey]) {
                container.innerHTML = '<p style="text-align:center; color:#666; padding:2rem;">No schedule found for this series.</p>';
                return;
            }

            const today = new Date();
            today.setHours(0,0,0,0);
            let nextFound = false;

            scheduleData[seriesKey].forEach(race => {
                // Parse date assuming YYYY-MM-DD
                const raceDate = new Date(race.date + 'T12:00:00'); 
                const isPast = raceDate < today;
                
                const month = raceDate.toLocaleString('default', { month: 'short' }).toUpperCase();
                const day = raceDate.getDate();
                const year = raceDate.getFullYear();

                let statusClass = '';
                let statusBadge = '<span class="status-badge">UPCOMING</span>';
                let winnerHtml = '';

                if (isPast) {
                    statusClass = 'completed';
                    statusBadge = '<span class="status-badge">COMPLETED</span>';
                    
                    // Show winner if available in JSON
                    if (race.winner) {
                        winnerHtml = `<div class="winner-display"><i class="fa-solid fa-trophy"></i> ${race.winner}</div>`;
                    }
                } else if (!nextFound) {
                    statusClass = 'next';
                    statusBadge = '<span class="status-badge" style="background:var(--primary); color:#fff; border:none;">NEXT RACE</span>';
                    nextFound = true; 
                }

                const html = `
                    <div class="race-item ${statusClass}">
                        <div class="race-date">
                            <span class="month">${month}</span>
                            <span class="day">${day}</span>
                        </div>
                        <div class="race-info">
                            <h3>${race.track}</h3>
                            <p>${year} Season Event</p>
                        </div>
                        <div class="race-status">
                            ${statusBadge}
                            ${winnerHtml}
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }
    </script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (['u','s','a','c'].includes(e.key.toLowerCase())) return e.preventDefault();
                if (e.shiftKey && ['i','j'].includes(e.key.toLowerCase())) return e.preventDefault();
            }
            if (e.key === 'F12') return e.preventDefault();
        });
    </script>

</body>
</html>
