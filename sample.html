<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Card Binder</title>
    <style>
        :root {
            --binder-color: #2c3e50;
            --page-bg: #ffffff;
            --slot-border: rgba(0, 0, 0, 0.1);
            --plastic-sheen: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%);
        }

        body {
            background-color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            perspective: 2000px;
        }

        /* The Main Binder Container */
        .binder {
            position: relative;
            width: 800px;
            height: 550px;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        /* Binder States */
        .binder.closed {
            transform: rotateY(-20deg) rotateX(10deg);
        }

        /* The Spine */
        .spine {
            position: absolute;
            left: 50%;
            top: 0;
            width: 40px;
            height: 100%;
            background: #1a252f;
            transform: translateX(-50%) translateZ(-20px);
            border-radius: 5px;
        }

        /* Common Page Styling */
        .page {
            position: absolute;
            width: 50%;
            height: 100%;
            background: var(--binder-color);
            top: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            overflow: hidden;
        }

        .left-page {
            left: 0;
            transform-origin: right;
            border-radius: 10px 0 0 10px;
            z-index: 2;
        }

        .right-page {
            right: 0;
            transform-origin: left;
            border-radius: 0 10px 10px 0;
        }

        /* Closing Animation Logic */
        .binder.closed .left-page {
            transform: rotateY(175deg);
        }

        /* The Internal White Sheets */
        .sheet {
            margin: 20px;
            background: var(--page-bg);
            height: calc(100% - 40px);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        /* The Plastic Slots */
        .slot {
            border: 1px solid var(--slot-border);
            border-radius: 4px;
            background-color: #f9f9f9;
            position: relative;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
        }

        /* Plastic Sheen Overlay */
        .slot::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--plastic-sheen);
            pointer-events: none;
        }

        /* UI Text */
        .instruction {
            position: fixed;
            bottom: 20px;
            color: white;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="binder closed" id="binder" onclick="toggleBinder()">
        <div class="spine"></div>
        
        <div class="page left-page">
            <div class="sheet">
                <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div>
            </div>
        </div>

        <div class="page right-page">
            <div class="sheet">
                <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div>
            </div>
        </div>
    </div>

    <div class="instruction">Click the binder to Open/Close</div>

    <script>
        function toggleBinder() {
            const binder = document.getElementById('binder');
            binder.classList.toggle('closed');
        }
    </script>
</body>
</html>
