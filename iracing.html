<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL | Official iRacing Hub</title>
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Chakra+Petch:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE HUD VARIABLES --- */
        :root {
            --neon-red: #ff003c;
            --neon-red-glow: rgba(255, 0, 60, 0.4);
            --neon-blue: #00f0ff;
            --neon-blue-glow: rgba(0, 240, 255, 0.4);
            --neon-green: #00ff41;
            --neon-green-glow: rgba(0, 255, 65, 0.4);
            --dark-bg: #050507;
            --panel-bg: rgba(10, 10, 12, 0.85);
            --grid-line: rgba(255, 255, 255, 0.04);
            --text-main: #f0f0f0;
            --speed-angle: -15deg;
        }

        /* --- GLOBAL & BACKGROUND --- */
        body {
            margin: 0;
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            animation: panGrid 60s linear infinite;
        }

        @keyframes panGrid {
            0% { background-position: 0 0; }
            100% { background-position: 0 500px; }
        }

        #nav-placeholder { position: relative; z-index: 99999; }

        /* --- HERO SECTION --- */
        .hud-header {
            position: relative;
            padding: 4rem 2rem 2rem;
            text-align: center;
            background: radial-gradient(circle at top, rgba(255, 0, 60, 0.05) 0%, transparent 60%);
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .hud-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 700;
            font-style: italic;
            margin: 0;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 
                3px 3px 0px var(--neon-red), 
                -3px -3px 0px var(--neon-blue),
                0px 0px 30px rgba(255, 255, 255, 0.2);
            letter-spacing: 6px;
            line-height: 1.1;
        }

        .hud-subtitle {
            color: #9ba1a6;
            font-size: clamp(1rem, 3vw, 1.4rem);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 0.5rem;
            margin-bottom: 3rem;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 600;
            position: relative;
            display: inline-block;
        }

        .hud-subtitle::before, .hud-subtitle::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40px;
            height: 2px;
            background: var(--neon-red);
        }
        .hud-subtitle::before { left: -60px; }
        .hud-subtitle::after { right: -60px; }
        
        /* --- ESPORTS BUTTON LAYOUT --- */
        .broadcast-links { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            flex-wrap: wrap; 
            max-width: 1000px;
            margin: 0 auto 3rem;
            width: 100%;
        }
        
        .b-link {
            position: relative;
            text-decoration: none; 
            padding: 20px 45px; 
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700; 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            transform: skewX(var(--speed-angle));
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .b-link-content {
            transform: skewX(calc(var(--speed-angle) * -1));
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .b-link::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            z-index: 1;
        }
        .b-link:hover::before { left: 0; }
        .b-link:active { transform: skewX(var(--speed-angle)) scale(0.96); }
        
        .b-live { 
            background: rgba(255, 0, 60, 0.05); color: #fff; 
            border: 2px solid var(--neon-red); 
            box-shadow: 0 0 20px var(--neon-red-glow), inset 0 0 10px var(--neon-red-glow); 
        }
        .b-live:hover { 
            background: var(--neon-red); 
            box-shadow: 0 0 40px var(--neon-red), inset 0 0 20px rgba(255,255,255,0.5); 
        }
        
        .b-vod { 
            background: rgba(0, 240, 255, 0.05); color: #fff; 
            border: 2px solid var(--neon-blue); 
            box-shadow: 0 0 20px var(--neon-blue-glow), inset 0 0 10px var(--neon-blue-glow); 
        }
        .b-vod:hover { 
            background: var(--neon-blue); color: var(--dark-bg);
            box-shadow: 0 0 40px var(--neon-blue), inset 0 0 20px rgba(255,255,255,0.5); 
        }

        .live-dot {
            height: 10px; width: 10px;
            background-color: #fff;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #fff;
            animation: pulse-dot 1.5s infinite;
        }

        /* --- LIVE DATA DASHBOARD --- */
        .dashboard-container {
            max-width: 1000px;
            width: 90%;
            margin: 0 auto 4rem;
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--neon-blue);
            padding: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .dashboard-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1.5rem;
            margin: 0;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .update-status {
            font-size: 0.9rem;
            color: #888;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Leaderboard Table */
        .standings-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .standings-table th {
            font-family: 'Chakra Petch', sans-serif;
            color: #888;
            text-transform: uppercase;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            letter-spacing: 1px;
        }

        .standings-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .standings-table tr:hover td {
            background: rgba(0, 240, 255, 0.05);
        }

        .rank-col { width: 60px; color: var(--neon-blue); font-weight: 700; }
        .pts-col { color: var(--neon-green); text-align: right; }
        .wins-col { color: #aaa; text-align: right; width: 80px; }

        .playoff-tag {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            font-size: 0.7rem;
            padding: 3px 6px;
            border-radius: 3px;
            margin-left: 10px;
            text-transform: uppercase;
            border: 1px solid #ffc107;
            vertical-align: middle;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 850px) {
            .broadcast-links { flex-direction: column; align-items: center; }
            .b-link { width: 85%; }
            .hud-subtitle::before, .hud-subtitle::after { display: none; }
            .dashboard-container { padding: 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div id="nav-placeholder"></div>

    <header class="hud-header">
        <h1 class="hud-title">ASCRL iRACING</h1>
        <div class="hud-subtitle">Official League Hub</div>
        
        <div class="broadcast-links">
            <a href="https://twitch.tv/tbone6007_" target="_blank" class="b-link b-live">
                <span class="b-link-content">
                    <span class="live-dot"></span>
                    <i class="fa-solid fa-satellite-dish"></i> LIVE BROADCAST
                </span>
            </a>
            
            <a href="https://www.youtube.com/@iracingascrl" target="_blank" class="b-link b-vod">
                <span class="b-link-content">
                    <i class="fa-brands fa-youtube"></i> LATEST RACE VOD
                </span>
            </a>
        </div>
    </header>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h2 class="dashboard-title"><i class="fa-solid fa-trophy"></i> Live Championship</h2>
            <div class="update-status" id="last-updated">
                <i class="fa-solid fa-rotate"></i> Syncing with ASCRL Database...
            </div>
        </div>

        <table class="standings-table">
            <thead>
                <tr>
                    <th class="rank-col">POS</th>
                    <th>Driver</th>
                    <th class="wins-col">Wins</th>
                    <th class="pts-col">Points</th>
                </tr>
            </thead>
            <tbody id="standings-body">
                </tbody>
        </table>
    </div>

    <script>
        // --- 1. JSON FETCH ENGINE ---
        // This function targets the exact export schema generated by your Discord Bot.
        async function loadStandings() {
            try {
                // Fetch the JSON file generated by your /export_season command
                // Add a cache-busting query parameter so the browser always gets the newest version
                const response = await fetch(`live_season_standings.json?v=${new Date().getTime()}`);
                
                if (!response.ok) {
                    throw new Error("Standings file not found. Ensure the bot has run /export_season.");
                }

                const data = await response.json();
                const tbody = document.getElementById('standings-body');
                tbody.innerHTML = ''; // Clear loading state

                // Update timestamp if the bot included one, otherwise use current time
                const updatedTime = data.exported_at ? new Date(data.exported_at).toLocaleString() : new Date().toLocaleString();
                document.getElementById('last-updated').innerHTML = `<i class="fa-solid fa-check-circle" style="color: var(--neon-green)"></i> Last Sync: ${updatedTime}`;

                // Loop through the array generated by the SQLite database
                data.driver_standings.forEach((driver, index) => {
                    const tr = document.createElement('tr');
                    
                    // Render the Playoff tag if the bot flagged them as 'playoff_alive = 1'
                    const playoffBadge = driver.playoff_alive ? `<span class="playoff-tag">Chase Grid</span>` : '';

                    tr.innerHTML = `
                        <td class="rank-col">${index + 1}</td>
                        <td>${driver.name} ${playoffBadge}</td>
                        <td class="wins-col">${driver.wins}</td>
                        <td class="pts-col">${driver.points}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Error loading standings:", error);
                document.getElementById('standings-body').innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align:center; color:#ff3333; padding: 30px;">
                            <i class="fa-solid fa-triangle-exclamation"></i> Database offline or standings file missing. Run <code>/export_season</code> in Discord.
                        </td>
                    </tr>
                `;
                document.getElementById('last-updated').innerHTML = `<i class="fa-solid fa-link-slash" style="color: var(--neon-red)"></i> Connection Failed`;
            }
        }

        // Initialize the fetch engine when the page loads
        document.addEventListener("DOMContentLoaded", loadStandings);

        // --- 2. MODULAR NAVIGATION LOGIC ---
        const cacheBust = new Date().getTime();
        fetch(`nav.html?v=${cacheBust}`)
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                
                const activeLink = document.getElementById('nav-iracing');
                if (activeLink) {
                    activeLink.style.color = "var(--neon-blue)";
                    activeLink.style.borderLeft = "4px solid var(--neon-blue)";
                    activeLink.style.paddingLeft = "15px";
                    activeLink.style.background = "rgba(0, 240, 255, 0.05)";
                    activeLink.style.boxShadow = "-2px 0 10px var(--neon-blue-glow)";
                }
            })
            .catch(e => console.error("Navigation load failed: ", e));

        function toggleMenu() {
            const m = document.getElementById('nav-menu');
            if(m) m.classList.toggle('open');
        }
    </script>
</body>
</html>
