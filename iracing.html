<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL | iRacing Hub</title>
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Chakra+Petch:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- CORE HUD VARIABLES --- */
        :root {
            --neon-red: #ff003c;
            --neon-blue: #00f0ff;
            --neon-green: #00ff41;
            --dark-bg: #050505;
            --grid-line: rgba(0, 240, 255, 0.03);
            --text-main: #e0e0e0;
        }

        /* --- FORCE DARK THEME --- */
        body {
            margin: 0 !important;
            background-color: var(--dark-bg) !important;
            color: var(--text-main) !important;
            font-family: 'Rajdhani', sans-serif !important;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) !important;
            background-size: 40px 40px !important;
            background-attachment: fixed !important;
            overflow-x: hidden !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #nav-placeholder { position: relative; z-index: 99999; }

        /* --- FULL SCREEN HUB SECTION --- */
        .hud-header {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem 2rem;
            text-align: center;
            border-bottom: 2px solid var(--neon-red);
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, var(--dark-bg) 100%), 
                        url('https://images-static.iracing.com/img/logos/tracks/120__light.png') center/cover;
            box-shadow: 0 10px 40px rgba(255, 0, 60, 0.15);
        }
        
        .hud-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            font-style: italic;
            margin: 0;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 4px 4px 0px var(--neon-red), -4px -4px 0px var(--neon-blue);
            letter-spacing: 5px;
        }

        .hud-subtitle {
            color: #888;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 3rem;
            font-family: 'Chakra Petch', sans-serif;
        }
        
        .broadcast-links { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            flex-wrap: wrap; 
            max-width: 900px;
        }
        
        .b-link {
            text-decoration: none; 
            padding: 15px 35px; 
            font-family: 'Chakra Petch', sans-serif;
            font-weight: bold; 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            border-radius: 4px; 
            transition: all 0.3s ease; 
            display: inline-flex; 
            align-items: center; 
            gap: 10px;
        }
        
        /* Red Twitch Button */
        .b-live { 
            background: rgba(255, 0, 60, 0.1); 
            color: var(--neon-red); 
            border: 1px solid var(--neon-red); 
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.2); 
            animation: pulse-red 2s infinite; 
        }
        .b-live:hover { 
            background: var(--neon-red); color: #fff; 
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.6); 
        }
        
        /* Blue YouTube Button */
        .b-vod { 
            background: rgba(0, 240, 255, 0.1); 
            color: var(--neon-blue); 
            border: 1px solid var(--neon-blue); 
        }
        .b-vod:hover { 
            background: var(--neon-blue); color: #000; 
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6); 
        }

        /* Green Standings Button */
        .b-standings { 
            background: rgba(0, 255, 65, 0.1); 
            color: var(--neon-green); 
            border: 1px solid var(--neon-green); 
        }
        .b-standings:hover { 
            background: var(--neon-green); color: #000; 
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.6); 
        }

        @keyframes pulse-red { 
            0% { box-shadow: 0 0 15px rgba(255, 0, 60, 0.2); } 
            50% { box-shadow: 0 0 35px rgba(255, 0, 60, 0.5); } 
            100% { box-shadow: 0 0 15px rgba(255, 0, 60, 0.2); } 
        }
        
        @media (max-width: 768px) {
            .b-link { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <header class="hud-header">
        <h1 class="hud-title">ASCRL iRACING</h1>
        <div class="hud-subtitle">Official League Hub</div>
        
        <div class="broadcast-links">
            <a href="https://twitch.tv/tbone6007_" target="_blank" class="b-link b-live">
                <i class="fa-solid fa-satellite-dish"></i> LIVE BROADCAST
            </a>
            <a href="https://simracerhub.com/season_standings.php?season_id=28914" target="_blank" class="b-link b-standings">
                <i class="fa-solid fa-trophy"></i> LIVE STANDINGS
            </a>
            <a href="https://www.youtube.com/@iracingascrl" target="_blank" class="b-link b-vod">
                <i class="fa-brands fa-youtube"></i> LATEST RACE VOD
            </a>
        </div>
    </header>

    <script>
        // --- 1. MODULAR NAVIGATION LOGIC ---
        const cacheBust = new Date().getTime();
        fetch(`nav.html?v=${cacheBust}`)
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                
                // Highlight the active link in the menu
                const activeLink = document.getElementById('nav-iracing');
                if (activeLink) {
                    activeLink.style.color = "var(--neon-blue)";
                    activeLink.style.borderLeft = "4px solid var(--neon-blue)";
                    activeLink.style.paddingLeft = "15px";
                    activeLink.style.background = "rgba(0, 240, 255, 0.05)";
                }
            })
            .catch(e => console.log("Nav fetch failed: ", e));

        function toggleMenu() {
            const m = document.getElementById('nav-menu');
            if(m) m.classList.toggle('open');
        }

        // --- 2. SECURITY SCRIPTS ---
        // Disable Right Click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // Disable Keyboard Shortcuts (Ctrl+U, F12, Ctrl+Shift+I, etc.)
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key.toLowerCase()) {
                    case 'u': 
                    case 's': 
                    case 'a': 
                    case 'c': 
                        e.preventDefault();
                        return false;
                }
                if (e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j')) {
                    e.preventDefault();
                    return false;
                }
            }
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
