<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL | Live Telemetry</title>
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Chakra+Petch:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- CORE HUD VARIABLES --- */
        :root {
            --neon-red: #ff003c;
            --neon-blue: #00f0ff;
            --neon-green: #00ff41;
            --dark-bg: #050505;
            --panel-bg: rgba(15, 15, 20, 0.95);
            --grid-line: rgba(0, 240, 255, 0.05);
            --text-main: #e0e0e0;
            --text-muted: #666;
        }

        /* --- FORCE DARK THEME --- */
        body {
            margin: 0 !important;
            background-color: var(--dark-bg) !important;
            color: var(--text-main) !important;
            font-family: 'Rajdhani', sans-serif !important;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) !important;
            background-size: 40px 40px !important;
            background-attachment: fixed !important;
            overflow-x: hidden !important;
        }

        #nav-placeholder { position: relative; z-index: 99999; }

        /* --- HUD HERO SECTION --- */
        .hud-header {
            position: relative;
            padding: 7rem 2rem 4rem;
            text-align: center;
            border-bottom: 2px solid var(--neon-red);
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, var(--dark-bg) 100%), 
                        url('https://images-static.iracing.com/img/logos/tracks/120__light.png') center/cover;
            box-shadow: 0 10px 40px rgba(255, 0, 60, 0.15);
        }
        .hud-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            font-style: italic;
            margin: 0;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 3px 3px 0px var(--neon-red), -3px -3px 0px var(--neon-blue);
            letter-spacing: 4px;
        }
        .hud-status {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-weight: bold;
            font-family: 'Chakra Petch', monospace;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.9rem;
            background: rgba(0, 255, 65, 0.1);
            animation: pulse 2s infinite;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }

        @keyframes pulse {
            0% { opacity: 0.8; box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }
            50% { opacity: 1; box-shadow: 0 0 25px rgba(0, 255, 65, 0.5); }
            100% { opacity: 0.8; box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }
        }

        /* --- CONTROL TABS --- */
        .controls-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            position: sticky;
            top: 0;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid #222;
        }
        .hud-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #333;
            padding: 12px 30px;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
        }
        .hud-btn:hover {
            color: #fff;
            border-color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }
        .hud-btn.active {
            background: var(--neon-red);
            color: #fff;
            border-color: var(--neon-red);
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.4);
        }

        /* --- MAIN CONTAINER & PANELS --- */
        .telemetry-container {
            max-width: 1500px;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        .tab-pane {
            display: none;
            animation: bootUp 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .tab-pane.active { display: block; }
        
        @keyframes bootUp {
            0% { opacity: 0; transform: translateY(20px); filter: blur(4px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* --- INSIGHT CARDS (Top of tabs) --- */
        .insights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .insight-card {
            background: var(--panel-bg);
            border: 1px solid #222;
            border-left: 4px solid var(--neon-blue);
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .insight-card::before {
            content: ''; position: absolute; top: 0; right: 0;
            border-top: 25px solid #222; border-left: 25px solid transparent;
        }
        .insight-label {
            font-size: 0.85rem; color: var(--neon-blue);
            text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 5px; font-weight: bold;
        }
        .insight-value {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 2rem; font-weight: 700; color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .insight-sub { font-size: 0.9rem; color: #888; margin-top: 5px; font-family: 'Chakra Petch'; }

        /* --- DATA TABLES --- */
        .hud-table-wrapper {
            background: var(--panel-bg);
            border: 1px solid #333;
            overflow-x: auto;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .hud-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.15rem;
            white-space: nowrap;
        }
        .hud-table th {
            background: #0a0a0a; color: var(--text-muted);
            padding: 18px 15px; text-transform: uppercase;
            font-size: 0.85rem; letter-spacing: 2px;
            border-bottom: 1px solid var(--neon-red);
            position: sticky; top: 0;
            font-family: 'Chakra Petch', sans-serif;
        }
        .hud-table td {
            padding: 14px 15px;
            border-bottom: 1px solid #1a1a1a;
            text-align: center;
        }
        .hud-table tbody tr { transition: background 0.2s; }
        .hud-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.01); }
        .hud-table tbody tr:hover { background: rgba(0, 240, 255, 0.08); }
        
        .align-left { text-align: left !important; }
        .driver-name { font-weight: 700; color: #fff; letter-spacing: 1px; font-size: 1.2rem; }
        
        /* Badges & Colors */
        .pos-badge {
            display: inline-block; width: 32px; height: 32px; line-height: 32px;
            background: #222; border-radius: 4px; font-weight: bold; font-family: 'Chakra Petch';
            font-size: 1rem;
        }
        .pos-1 { background: #ffd700; color: #000; box-shadow: 0 0 15px rgba(255,215,0,0.6); }
        .pos-2 { background: #c0c0c0; color: #000; box-shadow: 0 0 10px rgba(192,192,192,0.4); }
        .pos-3 { background: #cd7f32; color: #000; box-shadow: 0 0 10px rgba(205,127,50,0.4); }
        
        .val-gain { color: var(--neon-green); font-weight: bold; text-shadow: 0 0 8px rgba(0,255,65,0.5); }
        .val-loss { color: var(--neon-red); font-weight: bold; text-shadow: 0 0 8px rgba(255,0,60,0.5); }
        .val-neutral { color: #555; }
        .val-pts { color: var(--neon-blue); font-weight: bold; font-size: 1.3rem; font-family: 'Chakra Petch'; }
        .inc-danger { color: var(--neon-red); font-weight: bold; border-bottom: 1px dashed var(--neon-red); }

        /* Matrix Grid Boxes */
        .matrix-box {
            display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; font-family: 'Chakra Petch'; font-weight: bold;
            font-size: 1rem; background: #111; border: 1px solid #333; border-radius: 4px;
        }
        .mb-win { background: var(--neon-red); color: #fff; border-color: #ff4d4d; box-shadow: 0 0 12px rgba(255,0,60,0.8); }
        .mb-top5 { background: rgba(0, 240, 255, 0.15); color: var(--neon-blue); border-color: var(--neon-blue); }
        .mb-dnf { background: #1a0000; color: #666; border-color: #440000; font-size: 0.8rem; }

        /* Loader */
        .loader-wrapper { text-align: center; padding: 6rem 0; }
        .cyber-spinner {
            width: 60px; height: 60px; margin: 0 auto 20px;
            border: 4px solid rgba(255,255,255,0.05); border-top-color: var(--neon-blue);
            border-right-color: var(--neon-red); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <header class="hud-header">
        <h1 class="hud-title">ASCRL iRacing Series</h1>
        <div class="hud-status" id="hud-status-text">AWAITING DATA FEED...</div>
    </header>

    <div class="controls-wrapper">
        <button class="hud-btn active" onclick="switchTab('standings')">STANDINGS</button>
        <button class="hud-btn" onclick="switchTab('latest')">LATEST RACE</button>
        <button class="hud-btn" onclick="switchTab('matrix')">SEASON GRID</button>
    </div>

    <main class="telemetry-container">
        
        <div class="loader-wrapper" id="loader">
            <div class="cyber-spinner"></div>
            <div style="font-family:'Chakra Petch'; color:var(--neon-blue); letter-spacing:4px; font-weight:bold; font-size:1.2rem;">DECRYPTING iRACING DATA...</div>
        </div>

        <div id="tab-standings" class="tab-pane">
            <div class="insights-grid" id="standings-insights">
                </div>
            <div class="hud-table-wrapper">
                <table class="hud-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th class="align-left">Driver</th>
                            <th>Starts</th>
                            <th>Wins</th>
                            <th>Top 5</th>
                            <th>Poles</th>
                            <th>Laps Led</th>
                            <th>Avg Fin</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-latest" class="tab-pane">
            <h2 style="font-family:'Chakra Petch'; color:var(--neon-blue); text-transform:uppercase; margin-top:0; letter-spacing: 2px;" id="latest-track-name">RACE RESULTS</h2>
            <div class="insights-grid" id="latest-insights">
                </div>
            <div class="hud-table-wrapper">
                <table class="hud-table">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>+/-</th>
                            <th class="align-left">Driver</th>
                            <th>Start</th>
                            <th>Interval</th>
                            <th>Laps</th>
                            <th>Led</th>
                            <th>Inc</th>
                            <th>Pts</th>
                        </tr>
                    </thead>
                    <tbody id="latest-body"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-matrix" class="tab-pane">
            <div class="hud-table-wrapper">
                <table class="hud-table">
                    <thead>
                        <tr id="matrix-head">
                            <th class="align-left">Driver</th>
                            </tr>
                    </thead>
                    <tbody id="matrix-body"></tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // Load Nav
        fetch('nav.html').then(r=>r.text()).then(d=>document.getElementById('nav-placeholder').innerHTML=d).catch(e=>console.log("Nav ignored"));

        // Tab Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.querySelectorAll('.hud-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // ==========================================
        // TELEMETRY PROCESSOR
        // ==========================================
        document.addEventListener('DOMContentLoaded', loadData);

        async function loadData() {
            try {
                const res = await fetch('iracing.json');
                const rawData = await res.json();
                
                // Ensure array format
                const events = Array.isArray(rawData) ? rawData : [rawData];
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('tab-standings').classList.add('active');
                
                // Update HUD Status
                document.getElementById('hud-status-text').innerText = "NO ONE DOES IT BETTER";
                document.getElementById('hud-status-text').style.color = "var(--neon-blue)";
                document.getElementById('hud-status-text').style.borderColor = "var(--neon-blue)";
                document.getElementById('hud-status-text').style.boxShadow = "0 0 15px rgba(0, 240, 255, 0.3)";
                document.getElementById('hud-status-text').style.background = "rgba(0, 240, 255, 0.1)";

                processTelemetry(events);
            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation" style="font-size:4rem; color:var(--neon-red); margin-bottom:15px; text-shadow: 0 0 20px var(--neon-red);"></i>
                    <div style="font-family:'Chakra Petch'; color:var(--neon-red); letter-spacing:3px; font-size:1.5rem; font-weight:bold;">LINK SEVERED</div>
                    <div style="color:#666; margin-top:10px;">Check iracing.json formatting or server connection.</div>
                `;
            }
        }

        function processTelemetry(events) {
            let drivers = {};
            let tracks = [];
            let latestRace = null;

            events.forEach(event => {
                if(!event.data) return;
                let trackName = event.data.track.track_name;
                tracks.push(trackName);

                let raceSession = event.data.session_results.find(s => s.simsession_type_name === 'Race' || s.simsession_name === 'RACE');
                if(!raceSession) return;
                latestRace = { track: trackName, results: raceSession.results };

                raceSession.results.forEach(r => {
                    let name = r.display_name;
                    let fin = r.finish_position + 1;
                    let start = r.starting_position + 1;
                    let pts = r.champ_points || r.league_points || 0;

                    if(!drivers[name]) {
                        drivers[name] = { 
                            name: name, starts: 0, wins: 0, top5: 0, poles: 0, 
                            lapsLed: 0, incs: 0, points: 0, totalFinish: 0, finishes: {} 
                        };
                    }
                    
                    drivers[name].starts += 1;
                    drivers[name].points += pts;
                    drivers[name].lapsLed += r.laps_lead;
                    drivers[name].incs += r.incidents;
                    drivers[name].totalFinish += fin;
                    drivers[name].finishes[trackName] = fin;

                    if(fin === 1) drivers[name].wins += 1;
                    if(fin <= 5) drivers[name].top5 += 1;
                    if(start === 1) drivers[name].poles += 1;
                });
            });

            let sortedDrivers = Object.values(drivers).sort((a,b) => b.points - a.points);
            
            buildStandings(sortedDrivers);
            if(latestRace) buildLatest(latestRace);
            buildMatrix(sortedDrivers, tracks);
        }

        function buildStandings(drivers) {
            let html = '';
            let mostWins = { name: '-', val: 0 };
            let safest = { name: '-', val: 999 };

            drivers.forEach((d, i) => {
                let rank = i + 1;
                let badge = rank === 1 ? 'pos-1' : (rank === 2 ? 'pos-2' : (rank === 3 ? 'pos-3' : ''));
                let avg = (d.totalFinish / d.starts).toFixed(1);
                let avgInc = (d.incs / d.starts).toFixed(1);

                if(d.wins > mostWins.val) { mostWins.name = d.name; mostWins.val = d.wins; }
                if(d.starts > 0 && avgInc < safest.val) { safest.name = d.name; safest.val = avgInc; }

                html += `
                    <tr>
                        <td><div class="pos-badge ${badge}">${rank}</div></td>
                        <td class="align-left driver-name">${d.name}</td>
                        <td>${d.starts}</td>
                        <td>${d.wins}</td>
                        <td>${d.top5}</td>
                        <td>${d.poles}</td>
                        <td>${d.lapsLed}</td>
                        <td>${avg}</td>
                        <td class="val-pts">${d.points}</td>
                    </tr>
                `;
            });
            document.getElementById('standings-body').innerHTML = html;

            // Inject Insights
            let leaderName = drivers.length > 0 ? drivers[0].name : '-';
            let leaderPts = drivers.length > 0 ? drivers[0].points : '0';
            
            document.getElementById('standings-insights').innerHTML = `
                <div class="insight-card">
                    <div class="insight-label">Championship Leader</div>
                    <div class="insight-value">${leaderName}</div>
                    <div class="insight-sub" style="color:var(--neon-blue);">${leaderPts} Points</div>
                </div>
                <div class="insight-card">
                    <div class="insight-label">Most Wins</div>
                    <div class="insight-value">${mostWins.name}</div>
                    <div class="insight-sub" style="color:var(--neon-green);">${mostWins.val} Wins</div>
                </div>
                <div class="insight-card">
                    <div class="insight-label">Safest Driver (Avg Inc)</div>
                    <div class="insight-value">${safest.name}</div>
                    <div class="insight-sub" style="color:#ffd700;">${safest.val} per race</div>
                </div>
            `;
        }

        function buildLatest(race) {
            document.getElementById('latest-track-name').innerText = race.track + " - LATEST DATA DROP";
            
            let html = '';
            let hardCharger = { name: '-', val: 0 };
            let mostLed = { name: '-', val: 0 };
            let winner = '-';

            race.results.sort((a,b) => a.finish_position - b.finish_position).forEach(r => {
                let fin = r.finish_position + 1;
                let start = r.starting_position + 1;
                let diff = start - fin;
                let pts = r.champ_points || r.league_points || 0;
                
                if(fin === 1) winner = r.display_name;
                if(diff > hardCharger.val) { hardCharger.name = r.display_name; hardCharger.val = diff; }
                if(r.laps_lead > mostLed.val) { mostLed.name = r.display_name; mostLed.val = r.laps_lead; }

                let diffHtml = '<span class="val-neutral">-</span>';
                if(diff > 0) diffHtml = `<span class="val-gain">▲ ${diff}</span>`;
                if(diff < 0) diffHtml = `<span class="val-loss">▼ ${Math.abs(diff)}</span>`;

                let incClass = r.incidents >= 8 ? 'inc-danger' : '';
                let interval = r.reason_out_id !== 0 ? `<span style="color:var(--neon-red); font-size:0.9rem;">${r.reason_out}</span>` : r.interval;

                html += `
                    <tr>
                        <td style="font-family:'Chakra Petch'; font-weight:bold; font-size:1.3rem;">${fin}</td>
                        <td>${diffHtml}</td>
                        <td class="align-left driver-name">${r.display_name}</td>
                        <td style="color:#888;">P${start}</td>
                        <td>${interval}</td>
                        <td>${r.laps_complete}</td>
                        <td style="color:var(--neon-green); font-weight:bold;">${r.laps_lead}</td>
                        <td class="${incClass}">${r.incidents}</td>
                        <td class="val-pts">${pts}</td>
                    </tr>
                `;
            });
            document.getElementById('latest-body').innerHTML = html;

            document.getElementById('latest-insights').innerHTML = `
                <div class="insight-card">
                    <div class="insight-label">Race Winner</div>
                    <div class="insight-value" style="color:var(--neon-red); text-shadow: 0 0 10px rgba(255,0,60,0.5);">${winner}</div>
                    <div class="insight-sub">P1</div>
                </div>
                <div class="insight-card">
                    <div class="insight-label">Hard Charger</div>
                    <div class="insight-value">${hardCharger.name}</div>
                    <div class="insight-sub" style="color:var(--neon-green);">+${hardCharger.val} Positions</div>
                </div>
                <div class="insight-card">
                    <div class="insight-label">Most Laps Led</div>
                    <div class="insight-value">${mostLed.name}</div>
                    <div class="insight-sub" style="color:var(--neon-blue);">${mostLed.val} Laps</div>
                </div>
            `;
        }

        function buildMatrix(drivers, tracks) {
            let headHtml = '<th class="align-left">Driver</th>';
            tracks.forEach((t, i) => {
                let st = t.split(' ')[0].substring(0, 4).toUpperCase();
                headHtml += `<th>R${i+1}<br><span style="font-size:0.75rem; color:var(--neon-blue); letter-spacing:1px;">${st}</span></th>`;
            });
            document.getElementById('matrix-head').innerHTML = headHtml;

            let bodyHtml = '';
            drivers.forEach(d => {
                bodyHtml += `<tr><td class="align-left driver-name">${d.name}</td>`;
                tracks.forEach(t => {
                    let fin = d.finishes[t];
                    if(!fin) {
                        bodyHtml += `<td><div class="matrix-box" style="background:transparent; border-color:#222; color:#333;">-</div></td>`;
                    } else {
                        let cls = '';
                        if(fin === 1) cls = 'mb-win';
                        else if(fin <= 5) cls = 'mb-top5';
                        else if(fin >= 30) cls = 'mb-dnf'; // Basic DNF assumption
                        bodyHtml += `<td><div class="matrix-box ${cls}">${fin}</div></td>`;
                    }
                });
                bodyHtml += `</tr>`;
            });
            document.getElementById('matrix-body').innerHTML = bodyHtml;
        }
    </script>
    <script>
        // 1. Disable Right Click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // 2. Disable Keyboard Shortcuts (Ctrl+U, F12, Ctrl+Shift+I, etc.)
        document.addEventListener('keydown', (e) => {
            // Check for Ctrl (or Command on Mac)
            if (e.ctrlKey || e.metaKey) {
                switch (e.key.toLowerCase()) {
                    case 'u': // View Source
                    case 's': // Save Page
                    case 'a': // Select All
                    case 'c': // Copy
                        e.preventDefault();
                        return false;
                }
                // Check for Ctrl+Shift+I or J (Developer Tools)
                if (e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j')) {
                    e.preventDefault();
                    return false;
                }
            }
            
            // Check for F12 (Developer Tools)
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
