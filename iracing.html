<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL | Official iRacing Hub</title>
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Chakra+Petch:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- CORE HUD VARIABLES --- */
        :root {
            --neon-red: #ff003c;
            --neon-red-glow: rgba(255, 0, 60, 0.4);
            --neon-blue: #00f0ff;
            --neon-blue-glow: rgba(0, 240, 255, 0.4);
            --neon-green: #00ff41;
            --neon-green-glow: rgba(0, 255, 65, 0.4);
            --dark-bg: #050507;
            --panel-bg: rgba(10, 10, 12, 0.85);
            --grid-line: rgba(255, 255, 255, 0.04);
            --text-main: #f0f0f0;
            --speed-angle: -15deg;
        }

        /* --- GLOBAL & BACKGROUND --- */
        body {
            margin: 0;
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Cinematic Grid with Fade-out edges */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            animation: panGrid 60s linear infinite;
        }

        @keyframes panGrid {
            0% { background-position: 0 0; }
            100% { background-position: 0 500px; }
        }

        #nav-placeholder { position: relative; z-index: 99999; }

        /* --- HERO SECTION --- */
        .hud-header {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem 2rem;
            text-align: center;
            background: radial-gradient(circle at top, rgba(255, 0, 60, 0.05) 0%, transparent 60%);
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .hud-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 700;
            font-style: italic;
            margin: 0;
            text-transform: uppercase;
            color: #ffffff;
            /* High-saturation offset shadows for dynamic 3D pop */
            text-shadow: 
                3px 3px 0px var(--neon-red), 
                -3px -3px 0px var(--neon-blue),
                0px 0px 30px rgba(255, 255, 255, 0.2);
            letter-spacing: 6px;
            line-height: 1.1;
        }

        .hud-subtitle {
            color: #9ba1a6;
            font-size: clamp(1rem, 3vw, 1.4rem);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 0.5rem;
            margin-bottom: 4rem;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 600;
            position: relative;
            display: inline-block;
        }

        /* Tech accent lines around subtitle */
        .hud-subtitle::before, .hud-subtitle::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40px;
            height: 2px;
            background: var(--neon-red);
        }
        .hud-subtitle::before { left: -60px; }
        .hud-subtitle::after { right: -60px; }
        
        /* --- ESPORTS BUTTON LAYOUT --- */
        .broadcast-links { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            flex-wrap: wrap; 
            max-width: 1000px;
            width: 100%;
        }
        
        /* Aggressive angled buttons */
        .b-link {
            position: relative;
            text-decoration: none; 
            padding: 20px 45px; 
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700; 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            transform: skewX(var(--speed-angle));
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        /* Un-skew the text inside the button */
        .b-link-content {
            transform: skewX(calc(var(--speed-angle) * -1));
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        /* Sweep effect element */
        .b-link::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            z-index: 1;
        }
        .b-link:hover::before {
            left: 0;
        }
        .b-link:active {
            transform: skewX(var(--speed-angle)) scale(0.96);
        }
        
        /* Red Twitch Button */
        .b-live { 
            background: rgba(255, 0, 60, 0.05); 
            color: #fff; 
            border: 2px solid var(--neon-red); 
            box-shadow: 0 0 20px var(--neon-red-glow), inset 0 0 10px var(--neon-red-glow); 
        }
        .b-live:hover { 
            background: var(--neon-red); 
            box-shadow: 0 0 40px var(--neon-red), inset 0 0 20px rgba(255,255,255,0.5); 
        }
        
        /* Blue YouTube Button */
        .b-vod { 
            background: rgba(0, 240, 255, 0.05); 
            color: #fff; 
            border: 2px solid var(--neon-blue); 
            box-shadow: 0 0 20px var(--neon-blue-glow), inset 0 0 10px var(--neon-blue-glow); 
        }
        .b-vod:hover { 
            background: var(--neon-blue); 
            color: var(--dark-bg);
            box-shadow: 0 0 40px var(--neon-blue), inset 0 0 20px rgba(255,255,255,0.5); 
        }

        /* Green Standings Button */
        .b-standings { 
            background: rgba(0, 255, 65, 0.05); 
            color: #fff; 
            border: 2px solid var(--neon-green); 
            box-shadow: 0 0 20px var(--neon-green-glow), inset 0 0 10px var(--neon-green-glow); 
        }
        .b-standings:hover { 
            background: var(--neon-green); 
            color: var(--dark-bg);
            box-shadow: 0 0 40px var(--neon-green), inset 0 0 20px rgba(255,255,255,0.5); 
        }

        /* Live pulsating indicator for Twitch */
        .live-dot {
            height: 10px;
            width: 10px;
            background-color: #fff;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #fff;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 850px) {
            .broadcast-links { flex-direction: column; align-items: center; }
            .b-link { width: 85%; }
            .hud-subtitle::before, .hud-subtitle::after { display: none; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div id="nav-placeholder"></div>

    <header class="hud-header">
        <h1 class="hud-title">ASCRL iRACING</h1>
        <div class="hud-subtitle">Official League Hub</div>
        
        <div class="broadcast-links">
            <a href="https://twitch.tv/tbone6007_" target="_blank" class="b-link b-live">
                <span class="b-link-content">
                    <span class="live-dot"></span>
                    <i class="fa-solid fa-satellite-dish"></i> LIVE BROADCAST
                </span>
            </a>
            
            <a href="https://simracerhub.com/season_standings.php?season_id=28914" target="_blank" class="b-link b-standings">
                <span class="b-link-content">
                    <i class="fa-solid fa-trophy"></i> LIVE STANDINGS
                </span>
            </a>
            
            <a href="https://www.youtube.com/@iracingascrl" target="_blank" class="b-link b-vod">
                <span class="b-link-content">
                    <i class="fa-brands fa-youtube"></i> LATEST RACE VOD
                </span>
            </a>
        </div>
    </header>

    <script>
        // --- MODULAR NAVIGATION LOGIC ---
        // Retained for your architecture requirements
        const cacheBust = new Date().getTime();
        fetch(`nav.html?v=${cacheBust}`)
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                
                // Highlight the active link in the menu
                const activeLink = document.getElementById('nav-iracing');
                if (activeLink) {
                    activeLink.style.color = "var(--neon-blue)";
                    activeLink.style.borderLeft = "4px solid var(--neon-blue)";
                    activeLink.style.paddingLeft = "15px";
                    activeLink.style.background = "rgba(0, 240, 255, 0.05)";
                    activeLink.style.boxShadow = "-2px 0 10px var(--neon-blue-glow)";
                }
            })
            .catch(e => console.error("Navigation load failed: ", e));

        function toggleMenu() {
            const m = document.getElementById('nav-menu');
            if(m) m.classList.toggle('open');
        }
    </script>
</body>
</html>
