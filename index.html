<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL Telemetry & Standings</title>
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=Inter:wght@400;700&display=swap');

        :root {
            --primary: #c00;
            --primary-glow: rgba(204, 0, 0, 0.6);
            --bg-base: #050505;
            --panel-bg: #111;
            --table-header: #1a1a1a;
            --table-row-even: #0a0a0a;
            --table-row-odd: #141414;
            --pos-gain: #00ff41;
            --pos-loss: #ff003c;
            --text-main: #e0e0e0;
            --text-muted: #888;
        }

        body {
            margin: 0;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* --- DYNAMIC HERO SECTION --- */
        .dash-hero {
            position: relative;
            padding: 8rem 2rem 4rem;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, var(--bg-base) 100%), 
                        url('https://images-static.iracing.com/img/logos/tracks/120__light.png') center/cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .hero-glitch {
            font-family: 'Arial Black', sans-serif;
            font-size: clamp(3rem, 6vw, 5rem);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: #fff;
            text-shadow: 0 0 20px var(--primary-glow);
        }
        .hero-subtitle {
            color: var(--primary);
            font-family: 'Chakra Petch', monospace;
            letter-spacing: 5px;
            font-size: 1rem;
            margin-top: 10px;
        }

        /* --- CONTROL CENTER TABS --- */
        .telemetry-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            background: rgba(17, 17, 17, 0.95);
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
        }
        .tab-btn {
            background: transparent;
            border: 1px solid #333;
            color: var(--text-muted);
            padding: 12px 25px;
            font-family: 'Chakra Petch', monospace;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
        }
        .tab-btn:hover {
            border-color: #666;
            color: #fff;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* --- DATA TABLES --- */
        .data-wrapper {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        .tab-content {
            display: none;
            animation: slideUp 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .tab-content.active {
            display: block;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .table-responsive {
            overflow-x: auto;
            background: var(--panel-bg);
            border: 1px solid #222;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .telemetry-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Chakra Petch', monospace; /* Monospace for numbers */
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .telemetry-table th {
            background: var(--table-header);
            color: #aaa;
            padding: 15px;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            border-bottom: 2px solid #333;
        }
        .telemetry-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #1a1a1a;
            text-align: center;
        }
        .telemetry-table tr:nth-child(even) { background: var(--table-row-even); }
        .telemetry-table tr:nth-child(odd) { background: var(--table-row-odd); }
        .telemetry-table tr:hover { background: #222; }

        /* Specific Table Data Styling */
        .col-left { text-align: left !important; }
        .driver-name { font-family: 'Arial Black', sans-serif; font-size: 1rem; color: #fff; }
        .pos-badge {
            display: inline-block;
            width: 30px; height: 30px;
            line-height: 30px;
            text-align: center;
            background: #222;
            border-radius: 5px;
            font-weight: bold;
            color: #fff;
        }
        .pos-1 { background: linear-gradient(45deg, #d4af37, #ffd700); color: #000; box-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .pos-2 { background: linear-gradient(45deg, #aaa, #ddd); color: #000; }
        .pos-3 { background: linear-gradient(45deg, #b08d57, #cd7f32); color: #000; }
        
        .val-pts { color: #ffd700; font-weight: bold; font-size: 1.1rem; }
        .gain { color: var(--pos-gain); }
        .loss { color: var(--pos-loss); }
        .neutral { color: #666; }
        .inc-high { color: var(--pos-loss); font-weight: bold; }

        /* Status Blocks for Matrix */
        .status-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 35px; height: 35px;
            border-radius: 4px;
            font-weight: bold;
            background: #111;
            border: 1px solid #333;
        }
        .box-win { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 10px rgba(204,0,0,0.5); }
        .box-top5 { background: #0044cc; color: #fff; border-color: #0055ff; }
        .box-dnf { background: #330000; color: #888; border-color: #550000; font-size: 0.75rem; }

        /* Loader */
        #loader { text-align: center; padding: 4rem; color: var(--primary); font-family: 'Chakra Petch'; letter-spacing: 2px; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <header class="dash-hero" id="hero-section">
        <h1 class="hero-glitch">ASCRL TELEMETRY</h1>
        <div class="hero-subtitle" id="hero-sub">INITIALIZING DATA LINK...</div>
    </header>

    <div class="telemetry-controls">
        <button class="tab-btn active" onclick="switchTab('standings')"><i class="fa-solid fa-trophy"></i> Championship</button>
        <button class="tab-btn" onclick="switchTab('latest')"><i class="fa-solid fa-flag-checkered"></i> Latest Race</button>
        <button class="tab-btn" onclick="switchTab('matrix')"><i class="fa-solid fa-table-cells"></i> Season Grid</button>
    </div>

    <main class="data-wrapper">
        <div id="loader">
            <div class="spinner"></div>
            FETCHING iRACING EXPORT...
        </div>

        <div id="tab-standings" class="tab-content">
            <div class="table-responsive">
                <table class="telemetry-table" id="standings-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th class="col-left">Driver</th>
                            <th>Starts</th>
                            <th>Wins</th>
                            <th>Top 5</th>
                            <th>Poles</th>
                            <th>Laps Led</th>
                            <th>Avg Fin</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-latest" class="tab-content">
            <h2 style="margin-top:0; color:#fff;" id="latest-track-name">RACE RESULTS</h2>
            <div class="table-responsive">
                <table class="telemetry-table" id="latest-table">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>+/-</th>
                            <th class="col-left">Driver</th>
                            <th>Start</th>
                            <th>Interval</th>
                            <th>Laps</th>
                            <th>Led</th>
                            <th>Inc</th>
                            <th>Pts</th>
                        </tr>
                    </thead>
                    <tbody id="latest-body"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-matrix" class="tab-content">
            <div class="table-responsive">
                <table class="telemetry-table" id="matrix-table">
                    <thead>
                        <tr id="matrix-head">
                            <th class="col-left">Driver</th>
                            </tr>
                    </thead>
                    <tbody id="matrix-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // 1. Load Nav
        fetch('nav.html').then(r=>r.text()).then(d=>document.getElementById('nav-placeholder').innerHTML=d).catch(e=>console.log("Nav skip"));

        // 2. Tab Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // ==========================================
        // TELEMETRY ENGINE
        // ==========================================
        document.addEventListener('DOMContentLoaded', loadiRacingData);

        async function loadiRacingData() {
            try {
                const response = await fetch('iracing.json');
                const rawData = await response.json();
                
                // Ensure it's an array of events
                const events = Array.isArray(rawData) ? rawData : [rawData];
                
                // Hide loader, show first tab
                document.getElementById('loader').style.display = 'none';
                document.getElementById('tab-standings').classList.add('active');

                processData(events);

            } catch (error) {
                console.error("Telemetry Link Failed:", error);
                document.getElementById('loader').innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation" style="font-size:3rem; color:var(--primary); margin-bottom:10px;"></i>
                    <div>NO TELEMETRY DETECTED</div>
                    <div style="font-size:0.7rem; color:#666; margin-top:5px;">Check iracing.json formatting</div>
                `;
            }
        }

        function processData(events) {
            let driverStats = {};
            let trackList = [];
            let latestRace = null;

            // Loop through all events (oldest to newest assuming chronological)
            events.forEach(event => {
                if(!event.data) return;
                
                let trackName = event.data.track.track_name;
                trackList.push(trackName);

                // Find the main "Race" session inside the event
                let raceSession = event.data.session_results.find(s => s.simsession_type_name === 'Race' || s.simsession_name === 'RACE');
                if(!raceSession) return;

                latestRace = { track: trackName, results: raceSession.results };

                // Process Drivers
                raceSession.results.forEach(res => {
                    let dName = res.display_name;
                    let finish = res.finish_position + 1; // iRacing arrays are usually 0-indexed
                    let start = res.starting_position + 1;
                    let pts = res.champ_points || res.league_points || 0;

                    if(!driverStats[dName]) {
                        driverStats[dName] = { 
                            name: dName, starts: 0, wins: 0, top5: 0, poles: 0, 
                            lapsLed: 0, points: 0, totalFinish: 0, raceFinishes: {} 
                        };
                    }

                    driverStats[dName].starts += 1;
                    driverStats[dName].points += pts;
                    driverStats[dName].lapsLed += res.laps_lead;
                    driverStats[dName].totalFinish += finish;
                    driverStats[dName].raceFinishes[trackName] = finish;

                    if(finish === 1) driverStats[dName].wins += 1;
                    if(finish <= 5) driverStats[dName].top5 += 1;
                    if(start === 1) driverStats[dName].poles += 1;
                });
            });

            // Convert to Array and Sort by Points
            let sortedDrivers = Object.values(driverStats).sort((a, b) => b.points - a.points);

            buildStandings(sortedDrivers);
            if(latestRace) buildLatestRace(latestRace);
            buildMatrix(sortedDrivers, trackList);
        }

        // --- BUILD TABS ---
        function buildStandings(drivers) {
            const tbody = document.getElementById('standings-body');
            let html = '';
            
            drivers.forEach((d, index) => {
                let rank = index + 1;
                let badgeClass = rank === 1 ? 'pos-1' : (rank === 2 ? 'pos-2' : (rank === 3 ? 'pos-3' : ''));
                let avg = (d.totalFinish / d.starts).toFixed(1);

                html += `
                    <tr>
                        <td><div class="pos-badge ${badgeClass}">${rank}</div></td>
                        <td class="col-left driver-name">${d.name}</td>
                        <td>${d.starts}</td>
                        <td>${d.wins}</td>
                        <td>${d.top5}</td>
                        <td>${d.poles}</td>
                        <td>${d.lapsLed}</td>
                        <td>${avg}</td>
                        <td class="val-pts">${d.points}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function buildLatestRace(race) {
            document.getElementById('latest-track-name').innerText = race.track + " - RESULTS";
            document.getElementById('hero-sub').innerText = "LAST DATA DROP: " + race.track;

            const tbody = document.getElementById('latest-body');
            let html = '';

            // Sort results by finish position just in case
            race.results.sort((a,b) => a.finish_position - b.finish_position).forEach(res => {
                let fin = res.finish_position + 1;
                let start = res.starting_position + 1;
                let diff = start - fin;
                let pts = res.champ_points || res.league_points || 0;
                
                let diffHtml = '<span class="neutral">-</span>';
                if(diff > 0) diffHtml = `<span class="gain">▲ ${diff}</span>`;
                if(diff < 0) diffHtml = `<span class="loss">▼ ${Math.abs(diff)}</span>`;

                let incClass = res.incidents >= 10 ? 'inc-high' : '';

                html += `
                    <tr>
                        <td style="font-weight:bold; font-size:1.1rem;">${fin}</td>
                        <td>${diffHtml}</td>
                        <td class="col-left driver-name">${res.display_name}</td>
                        <td>P${start}</td>
                        <td>${res.reason_out_id !== 0 ? `<span style="color:#c00; font-size:0.75rem;">${res.reason_out}</span>` : res.interval}</td>
                        <td>${res.laps_complete}</td>
                        <td>${res.laps_lead}</td>
                        <td class="${incClass}">${res.incidents}</td>
                        <td class="val-pts">${pts}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function buildMatrix(drivers, tracks) {
            // Build Headers
            const head = document.getElementById('matrix-head');
            let headHtml = '<th class="col-left">Driver</th>';
            tracks.forEach((t, i) => {
                let shortTrack = t.split(' ')[0].substring(0, 4).toUpperCase(); // e.g., TALL, DAYT
                headHtml += `<th>R${i+1}<br><small>${shortTrack}</small></th>`;
            });
            head.innerHTML = headHtml;

            // Build Rows
            const tbody = document.getElementById('matrix-body');
            let bodyHtml = '';

            drivers.forEach(d => {
                bodyHtml += `<tr><td class="col-left driver-name">${d.name}</td>`;
                
                tracks.forEach(track => {
                    let fin = d.raceFinishes[track];
                    if(!fin) {
                        bodyHtml += `<td><div class="status-box" style="background:transparent; border-color:#222;">-</div></td>`;
                    } else {
                        let boxClass = '';
                        if(fin === 1) boxClass = 'box-win';
                        else if (fin <= 5) boxClass = 'box-top5';
                        else if (fin >= 30) boxClass = 'box-dnf'; // Simple assumption for DNF color

                        bodyHtml += `<td><div class="status-box ${boxClass}">${fin}</div></td>`;
                    }
                });
                bodyHtml += `</tr>`;
            });
            tbody.innerHTML = bodyHtml;
        }
    </script>
</body>
</html>
