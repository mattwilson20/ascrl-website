<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL Standings | American Stock Car Racing League</title>
    
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #000;
            --border: #1a1a1a;
            --text-muted: #a0a0a0;
            --transition: 0.3s ease;

            /* Series Colors */
            --cup-blue: #0077ff;
            --xfinity-purple: #8000b0;
            --truck-red: #c00;
            --menards-yellow: #fff200;
        }

        body { margin: 0; font-family: 'Arial Black', sans-serif; background: var(--bg-dark); color: #fff; overflow-x: hidden; }

        /* --- HERO SECTION --- */
        .hero { 
            background: radial-gradient(circle at center, #222 0%, #000 100%); 
            padding: 8rem 1rem 4rem; 
            text-align: center; 
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin: 0; letter-spacing: -2px; line-height: 1; text-transform: uppercase; }
        .hero p { color: var(--primary); letter-spacing: 4px; text-transform: uppercase; font-size: 0.9rem; margin-top: 1rem; }

        /* --- CONTROLS (BUTTONS) --- */
        .controls { 
            background: #050505; padding: 1.5rem 1rem; border-bottom: 1px solid var(--border); 
            position: sticky; top: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
        }
        
        .tabs-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

        .series-btn {
            background: #111; border: 1px solid #333; color: #fff; padding: 12px 25px;
            font-family: 'Arial Black', sans-serif; text-transform: uppercase; font-size: 0.9rem;
            cursor: pointer; transition: var(--transition); min-width: 120px;
        }
        .series-btn:hover { transform: translateY(-2px); }
        .series-btn.active { border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.2); }

        /* Active State Colors */
        .series-btn[data-series="Cup"].active { background: var(--cup-blue); border-color: var(--cup-blue); }
        .series-btn[data-series="Xfinity"].active { background: var(--xfinity-purple); border-color: var(--xfinity-purple); }
        .series-btn[data-series="Truck"].active { background: var(--truck-red); border-color: var(--truck-red); }
        .series-btn[data-series="Menards"].active { background: var(--menards-yellow); border-color: var(--menards-yellow); color: #000; }

        /* COMPARE BUTTON */
        #compareBtn {
            display: none; padding: 10px 30px; background-color: #fff; color: #000;
            border: none; font-weight: bold; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.3); animation: popIn 0.3s ease;
        }
        #compareBtn:hover { background-color: var(--primary); color: white; }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- TABLE STYLES --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; overflow-x: auto; }

        .standings-table { 
            width: 100%; border-collapse: collapse; background: #111; 
            border: 1px solid #333; min-width: 600px; 
        }
        .standings-table th, .standings-table td { 
            padding: 15px; text-align: left; border-bottom: 1px solid #222; 
        }
        .standings-table th { 
            background-color: #1a1a1a; color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; 
        }
        .standings-table tr { transition: background 0.2s; }
        .standings-table tr:hover { background-color: #1a1a1a; }
        
        /* Rank Column */
        .rank-cell { font-size: 1.2rem; color: var(--primary); text-align: center; width: 50px; }
        .driver-cell { font-size: 1.1rem; color: white; }
        .stats-cell { font-family: sans-serif; color: #ccc; }

        /* Checkbox */
        .select-box { transform: scale(1.5); accent-color: var(--primary); cursor: pointer; }

        /* --- MODAL (GRAPH) --- */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center; 
            backdrop-filter: blur(5px);
        }
        .modal-content { 
            background: #111; border: 1px solid #333; padding: 2rem; width: 90%; max-width: 1000px; 
            position: relative; border-radius: 5px; 
        }
        .close { 
            position: absolute; top: 1rem; right: 1rem; font-size: 1.5rem; cursor: pointer; color: #666; 
        }
        .close:hover { color: #fff; }
        .chart-container { position: relative; height: 60vh; width: 100%; }

        /* --- FOOTER --- */
        footer { padding: 4rem 1rem; text-align: center; border-top: 1px solid var(--border); color: #444; font-size: 0.8rem; text-transform: uppercase; }
        .social-links { display: flex; gap: 2rem; justify-content: center; margin-top: 1rem; }
        .social-icon { color: #555; font-size: 1.5rem; text-decoration: none; transition: 0.3s; }
        .social-icon:hover { color: #fff; }

        /* Error Log */
        #error-log { display:none; background:#300; color:#f88; padding:10px; margin: 10px auto; max-width:800px; border:1px solid red; text-align:center; }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <header class="hero">
        <p>Season 2025-26</p>
        <h1>Championship Standings</h1>
    </header>

    <div id="error-log"></div>

    <div class="controls">
        <div class="tabs-container">
            <button class="series-btn active" data-series="Cup" onclick="switchSeries('Cup')">Cup Series</button>
            <button class="series-btn" data-series="Xfinity" onclick="switchSeries('Xfinity')">Xfinity</button>
            <button class="series-btn" data-series="Truck" onclick="switchSeries('Truck')">Trucks</button>
            <button class="series-btn" data-series="Menards" onclick="switchSeries('Menards')">Menards</button>
        </div>
        
        <button id="compareBtn" onclick="openGraph()">
            Compare Drivers (<span id="selCount">0</span>/10)
        </button>
    </div>

    <main class="container">
        <table class="standings-table">
            <thead>
                <tr>
                    <th style="text-align:center;">Compare</th>
                    <th style="text-align:center;">Rank</th>
                    <th>Driver</th>
                    <th>Points</th>
                    <th>Wins</th>
                    <th>Top 5</th>
                    <th>Top 10</th>
                    <th>Avg</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </main>

    <div id="graphModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('graphModal').style.display='none'">&times;</span>
            <h2 style="text-align:center; text-transform:uppercase; margin-bottom:20px;">Season Trends</h2>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>

    <footer>
        <div>© 2025-2026 American Stock Car Racing League</div>
        <div class="social-links">
            <a href="#" class="social-icon"><i class="fa-brands fa-facebook"></i></a>
            <a href="#" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
        </div>
    </footer>

    <script>
        // --- CONFIGURATION ---
        const STANDINGS_FILE = 'standings_2025-26.json';
        const TRENDS_FILE = 'trends_2025-26.json';

        // State
        let standingsData = {};
        let trendsData = {};
        let currentSeries = 'Cup';
        let selectedDrivers = new Set();
        let myChart = null;

        // --- 1. NAVIGATION LOADER ---
        fetch('nav.html')
            .then(res => res.text())
            .then(html => document.getElementById('nav-placeholder').innerHTML = html)
            .catch(e => console.error("Nav load failed"));

        // --- 2. DATA LOADER ---
        async function init() {
            try {
                const [sRes, tRes] = await Promise.all([
                    fetch(STANDINGS_FILE),
                    fetch(TRENDS_FILE)
                ]);

                if (!sRes.ok) throw new Error("Missing Standings File");
                
                standingsData = await sRes.json();
                
                if (tRes.ok) {
                    trendsData = await tRes.json();
                } else {
                    console.warn("Trends file missing - graph disabled");
                }

                renderTable();
            } catch (err) {
                const el = document.getElementById('error-log');
                el.style.display = 'block';
                el.innerText = `Error: Could not load data files. Ensure ${STANDINGS_FILE} is uploaded.`;
            }
        }

        // --- 3. SERIES SWITCHER ---
        function switchSeries(seriesName) {
            currentSeries = seriesName;
            
            // UI Update
            document.querySelectorAll('.series-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.series === seriesName) btn.classList.add('active');
            });

            // Clear selections when switching series
            selectedDrivers.clear();
            updateCompareButton();
            renderTable();
        }

        // --- 4. RENDER TABLE ---
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // Normalize keys (handle "Cup" vs "CUP")
            const key = Object.keys(standingsData).find(k => k.toLowerCase() === currentSeries.toLowerCase());

            if (!key || !standingsData[key]) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:30px;">No data for this series.</td></tr>';
                return;
            }

            standingsData[key].forEach((d, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="text-align:center;">
                        <input type="checkbox" class="select-box" value="${d.driver}" onchange="toggleDriver(this)">
                    </td>
                    <td class="rank-cell">#${index + 1}</td>
                    <td class="driver-cell">${d.driver}</td>
                    <td class="stats-cell" style="color:var(--accent); font-weight:bold;">${d.points}</td>
                    <td class="stats-cell">${d.wins}</td>
                    <td class="stats-cell">${d.top5}</td>
                    <td class="stats-cell">${d.top10}</td>
                    <td class="stats-cell">${d.avg}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // --- 5. CHECKBOX LOGIC ---
        function toggleDriver(cb) {
            if (cb.checked) {
                if (selectedDrivers.size >= 10) {
                    alert("Max 10 drivers");
                    cb.checked = false;
                    return;
                }
                selectedDrivers.add(cb.value);
            } else {
                selectedDrivers.delete(cb.value);
            }
            updateCompareButton();
        }

        function updateCompareButton() {
            const btn = document.getElementById('compareBtn');
            document.getElementById('selCount').innerText = selectedDrivers.size;
            
            // Only show button if we have trend data and >1 driver
            const hasData = Object.keys(trendsData).length > 0;
            if (selectedDrivers.size >= 2 && hasData) {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        }

        // --- 6. GRAPH LOGIC ---
        function openGraph() {
            const modal = document.getElementById('graphModal');
            modal.style.display = 'flex';
            drawChart();
        }

        function closeModal(e) {
            if (e.target.id === 'graphModal') document.getElementById('graphModal').style.display = 'none';
        }

        function drawChart() {
            const tKey = Object.keys(trendsData).find(k => k.toLowerCase() === currentSeries.toLowerCase());
            if (!tKey) return;

            const sData = trendsData[tKey];
            const ctx = document.getElementById('trendChart').getContext('2d');
            const datasets = [];
            let i = 0;

            selectedDrivers.forEach(driver => {
                if (sData.drivers[driver]) {
                    const hue = (i * 360) / selectedDrivers.size;
                    const color = `hsl(${hue}, 70%, 50%)`;
                    datasets.push({
                        label: driver,
                        data: sData.drivers[driver],
                        borderColor: color,
                        backgroundColor: color,
                        tension: 0.3,
                        pointRadius: 3
                    });
                    i++;
                }
            });

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: sData.labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#fff' } }
                    },
                    scales: {
                        x: { ticks: { color: '#888' }, grid: { color: '#333' } },
                        y: { ticks: { color: '#888' }, grid: { color: '#333' } }
                    }
                }
            });
        }

        // START
        init();
    </script>
</body>
</html>
