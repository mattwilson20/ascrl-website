<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCRL Standings & Trends</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- DARK THEME STYLING --- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #fff; text-transform: uppercase; letter-spacing: 2px; }
        
        /* CONTROLS */
        .controls { max-width: 1000px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
        select { padding: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; font-size: 16px; }
        
        /* FLOATING COMPARE BUTTON */
        #compareBtn {
            display: none; /* Hidden until drivers selected */
            padding: 10px 20px;
            background-color: #C00000; /* NASCAR Red */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        #compareBtn:hover { transform: scale(1.05); background-color: #e60000; }

        /* TABLE STYLES */
        .standings-table { width: 100%; max-width: 1000px; margin: 0 auto; border-collapse: collapse; background: #1e1e1e; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .standings-table th, .standings-table td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        .standings-table th { background-color: #2c2c2c; color: #aaa; font-size: 0.9em; text-transform: uppercase; }
        .standings-table tr:hover { background-color: #252525; }
        
        /* CHECKBOX STYLES */
        .select-box { transform: scale(1.2); cursor: pointer; accent-color: #C00000; }

        /* --- MODAL (THE POPUP GRAPH) --- */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85); /* Dark transparent background */
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background-color: #1e1e1e;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #444;
            width: 90%;
            max-width: 1100px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 20px;
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn:hover { color: white; }

        /* GRAPH SIZE */
        .chart-wrapper { position: relative; height: 60vh; width: 100%; }
    </style>
</head>
<body>

    <h1>Championship Standings</h1>

    <div class="controls">
        <select id="seriesSelect" onchange="renderTable()">
            <option value="Cup">Cup Series</option>
            <option value="Xfinity">Xfinity Series</option>
            <option value="Truck">Truck Series</option>
            <option value="Menards">Menards Series</option>
        </select>
        
        <button id="compareBtn" onclick="openModal()">
            Compare Drivers (<span id="count">0</span>/10)
        </button>
    </div>

    <table class="standings-table">
        <thead>
            <tr>
                <th style="width: 40px;">Select</th>
                <th style="width: 50px;">Pos</th>
                <th>Driver</th>
                <th>Points</th>
                <th>Wins</th>
                <th>Top 5</th>
                <th>Top 10</th>
                <th>Avg Fin</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <div id="graphModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('graphModal').style.display='none'">&times;</span>
            <h2 style="text-align:center; margin-top:0;">Season Progression Comparison</h2>
            <div class="chart-wrapper">
                <canvas id="trendChart"></canvas>
            </div>
            <p style="text-align: center; color: #777; font-size: 0.9em;">Click anywhere outside this box to close.</p>
        </div>
    </div>

    <script>
        // CONFIG: MATCH THESE TO YOUR FILENAMES
        const STANDINGS_FILE = 'team_standings_2025-26.json'; // Or 'drivers_2025-26.json' if you prefer raw
        // ACTUALLY: Let's use the standard "export_standings" JSON format for the table
        const DATA_FILE = 'standings_2025-26.json'; 
        const TRENDS_FILE = 'trends_2025-26.json';

        let standingsData = {};
        let trendsData = {};
        let myChart = null;
        let selectedDrivers = new Set();

        // 1. INITIALIZE
        async function init() {
            try {
                // Load both files in parallel
                const [sRes, tRes] = await Promise.all([
                    fetch(DATA_FILE),
                    fetch(TRENDS_FILE)
                ]);

                if (!sRes.ok || !tRes.ok) throw new Error("File not found");

                standingsData = await sRes.json();
                trendsData = await tRes.json();
                
                renderTable(); // Draw the table
            } catch (err) {
                console.error(err);
                document.querySelector('h1').innerText = "Error loading data files. Check console.";
            }
        }

        // 2. RENDER TABLE
        function renderTable() {
            const series = document.getElementById('seriesSelect').value;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            selectedDrivers.clear();
            updateButton();

            // Handle casing differences (Cup vs CUP)
            // The JSON keys might be Title Case or Upper Case depending on Python script version
            // We search for a matching key
            let seriesKey = Object.keys(standingsData).find(k => k.toLowerCase() === series.toLowerCase());
            
            if (!seriesKey || !standingsData[seriesKey]) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No data for this series.</td></tr>';
                return;
            }

            const drivers = standingsData[seriesKey];

            drivers.forEach((d, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align:center;">
                        <input type="checkbox" class="select-box" value="${d.driver}" onchange="toggleDriver(this)">
                    </td>
                    <td style="text-align:center; font-weight:bold;">${index + 1}</td>
                    <td>${d.driver}</td>
                    <td>${d.points}</td>
                    <td>${d.wins}</td>
                    <td>${d.top5}</td>
                    <td>${d.top10}</td>
                    <td>${d.avg}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 3. HANDLE CHECKBOXES
        function toggleDriver(checkbox) {
            if (checkbox.checked) {
                if (selectedDrivers.size >= 10) {
                    alert("Maximum 10 drivers allowed.");
                    checkbox.checked = false;
                    return;
                }
                selectedDrivers.add(checkbox.value);
            } else {
                selectedDrivers.delete(checkbox.value);
            }
            updateButton();
        }

        function updateButton() {
            const btn = document.getElementById('compareBtn');
            const countSpan = document.getElementById('count');
            countSpan.innerText = selectedDrivers.size;
            
            if (selectedDrivers.size >= 2) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        }

        // 4. OPEN GRAPH MODAL
        function openModal() {
            document.getElementById('graphModal').style.display = "block";
            drawGraph();
        }

        // 5. CLOSE MODAL (Clicking background)
        function closeModal(e) {
            if (e.target.id === 'graphModal') {
                document.getElementById('graphModal').style.display = "none";
            }
        }

        // 6. DRAW GRAPH
        function drawGraph() {
            const series = document.getElementById('seriesSelect').value;
            
            // Find correct key in Trends Data
            let tKey = Object.keys(trendsData).find(k => k.toLowerCase() === series.toLowerCase());
            if (!tKey) { alert("No trend data found for this series."); return; }

            const sData = trendsData[tKey];
            const ctx = document.getElementById('trendChart').getContext('2d');

            // Build Datasets
            const datasets = [];
            let colorIndex = 0;
            const totalColors = selectedDrivers.size;

            selectedDrivers.forEach(driverName => {
                if (sData.drivers[driverName]) {
                    const color = `hsl(${(colorIndex * 360) / totalColors}, 70%, 50%)`;
                    datasets.push({
                        label: driverName,
                        data: sData.drivers[driverName],
                        borderColor: color,
                        backgroundColor: color,
                        tension: 0.2,
                        pointRadius: 4,
                        pointHoverRadius: 7
                    });
                    colorIndex++;
                }
            });

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sData.labels, // Race Names
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: 'white' } },
                        tooltip: { 
                            titleColor: '#C00000',
                            bodyFont: { size: 14 }
                        }
                    },
                    scales: {
                        x: { ticks: { color: '#aaa' }, grid: { color: '#333' } },
                        y: { 
                            beginAtZero: true, 
                            ticks: { color: '#aaa' }, 
                            grid: { color: '#333' },
                            title: { display: true, text: 'Cumulative Points', color: 'white' }
                        }
                    }
                }
            });
        }

        // Start App
        init();
    </script>
</body>
</html>
