<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Championship Standings | ASCRL</title>
    
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #000;
            --card-bg: #0d0d0d;
            --border: #1a1a1a;
            --text-muted: #a0a0a0;
            --transition: 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            
            /* Series Colors */
            --cup-blue: #0077ff;
            --xfinity-purple: #8000b0;
            --truck-red: #c00;
            --menards-yellow: #fff200;
        }

        body { margin: 0; font-family: 'Arial Black', sans-serif; background: var(--bg-dark); color: #fff; overflow-x: hidden; }

        /* --- NAVIGATION --- */
        #nav-placeholder { position: relative; z-index: 2000; }
        .nav-overlay { position: fixed; top: 0; left: -100%; width: 100%; max-width: 350px; height: 100vh; background: #050505; transition: left 0.5s ease; z-index: 1999; padding-top: 100px; border-right: 1px solid var(--primary); }
        .nav-overlay.open { left: 0; }
        .nav-links { display: flex; flex-direction: column; padding: 0 3rem; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 1.2rem; padding: 1.2rem 0; border-bottom: 1px solid var(--border); transition: var(--transition); letter-spacing: 2px; }
        .nav-links a:hover { color: var(--primary); padding-left: 10px; }

        /* --- HAMBURGER MENU (UPDATED FOR CLEANER LOOK) --- */
        .hamburger {
            position: fixed; top: 2rem; left: 2rem; z-index: 2001; cursor: pointer;
            display: flex; flex-direction: column;
            /* Gap reduced from 6px to 4px */
            gap: 4px; 
            padding: 10px;
            background: rgba(0,0,0,0.5); border-radius: 4px;
        }
        .hamburger-line { 
            /* Width reduced from 35px to 20px */
            width: 20px; 
            /* Height reduced from 4px to 2px */
            height: 2px; 
            background-color: #fff; transition: 0.3s; 
        }
        .hamburger:hover .hamburger-line { background-color: var(--primary); }

        /* --- HERO --- */
        .hero { 
            background: radial-gradient(circle at center, #222 0%, #000 100%); 
            padding: 12rem 1rem 8rem; text-align: center; border-bottom: 1px solid var(--border);
        }
        h1 { font-size: clamp(3rem, 10vw, 5rem); margin: 0; letter-spacing: -2px; line-height: 0.9; }
        .hero p { color: var(--primary); letter-spacing: 5px; text-transform: uppercase; font-size: 0.9rem; margin-top: 1rem; }

        /* --- CONTROLS --- */
        .controls { 
            background: #050505; padding: 2rem 1rem; border-bottom: 1px solid var(--border); 
            position: sticky; top: 0; z-index: 100; 
            display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
        }
        .tabs-container { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }

        /* SERIES BUTTONS */
        .series-btn {
            background: #111; border: 1px solid #333; color: #fff; 
            padding: 15px 30px; font-family: 'Arial Black', sans-serif; 
            text-transform: uppercase; font-size: 1rem; letter-spacing: 1px;
            cursor: pointer; transition: var(--transition); min-width: 150px;
        }
        .series-btn:hover { transform: translateY(-3px); }
        .series-btn.active { border-color: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        .series-btn[data-series="Cup"].active { background: var(--cup-blue); border-color: var(--cup-blue); }
        .series-btn[data-series="Xfinity"].active { background: var(--xfinity-purple); border-color: var(--xfinity-purple); }
        .series-btn[data-series="Truck"].active { background: var(--truck-red); border-color: var(--truck-red); }
        .series-btn[data-series="Menards"].active { background: var(--menards-yellow); border-color: var(--menards-yellow); color: #000; }

        /* COMPARE BUTTON */
        #compareBtn {
            display: none; padding: 12px 30px; background-color: #fff; color: #000;
            border: 1px solid #fff; font-family: 'Arial Black'; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: 0.3s; animation: popIn 0.3s ease;
        }
        #compareBtn:hover { background-color: var(--primary); color: #fff; border-color: var(--primary); }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- TABLE --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 4rem 2rem; overflow-x: auto; }

        .standings-table { width: 100%; border-collapse: collapse; min-width: 700px; }
        .standings-table th { 
            text-align: left; padding: 1.5rem; color: var(--primary); 
            border-bottom: 1px solid var(--border); font-size: 0.8rem; letter-spacing: 2px;
            text-transform: uppercase;
        }
        .standings-table td { 
            padding: 1.5rem; border-bottom: 1px solid var(--border); 
            font-family: sans-serif; font-size: 1rem; color: #ccc;
        }
        .standings-table tr:hover td { background: #0a0a0a; color: #fff; }

        .rank-cell { font-family: 'Arial Black'; color: #fff; width: 60px; text-align: center; font-size: 1.2rem; }
        .driver-cell { font-family: 'Arial Black'; color: #fff; font-size: 1.1rem; letter-spacing: 1px; }
        .points-cell { font-family: 'Arial Black'; color: var(--accent); font-size: 1.1rem; }
        .checkbox-cell { text-align: center; width: 50px; }
        .select-box { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); }

        /* --- GRAPH MODAL --- */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 3000; justify-content: center; align-items: center; 
            backdrop-filter: blur(10px);
        }
        .modal-content { 
            background: #000; border: 1px solid var(--primary); padding: 3rem; width: 90%; max-width: 1100px; 
            position: relative; 
        }
        .close { 
            position: absolute; top: 2rem; right: 2rem; font-size: 1rem; cursor: pointer; 
            color: #fff; border: 1px solid #fff; padding: 5px 15px; opacity: 0.5;
        }
        .close:hover { opacity: 1; background: #fff; color: #000; }
        .chart-container { position: relative; height: 60vh; width: 100%; margin-top: 20px; }

        /* --- FOOTER --- */
        footer { padding: 4rem 1rem; text-align: center; border-top: 1px solid var(--border); color: #333; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
        .social-links { display: flex; gap: 2rem; justify-content: center; }
        .social-icon { color: #555; font-size: 1.8rem; transition: 0.3s; }
        .social-icon:hover { color: #fff; transform: translateY(-3px); }

        #error-log { display:none; background:#300; color:#f88; padding:15px; margin: 20px auto; max-width:800px; border:1px solid red; text-align:center; font-family: sans-serif; }
    </style>
</head>
<body>

    <div class="hamburger" onclick="toggleMenu()">
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
    </div>

    <div id="nav-placeholder"></div>

    <header class="hero">
        <p>Season 2025-26</p>
        <h1>STANDINGS</h1>
    </header>

    <div id="error-log"></div>

    <div class="controls">
        <div class="tabs-container">
            <button class="series-btn active" data-series="Cup" onclick="switchSeries('Cup')">Cup Series</button>
            <button class="series-btn" data-series="Xfinity" onclick="switchSeries('Xfinity')">Xfinity</button>
            <button class="series-btn" data-series="Truck" onclick="switchSeries('Truck')">Trucks</button>
            <button class="series-btn" data-series="Menards" onclick="switchSeries('Menards')">Menards</button>
        </div>
        
        <button id="compareBtn" onclick="openGraph()">
            COMPARE DRIVERS (<span id="selCount">0</span>/10)
        </button>
    </div>

    <main class="container">
        <table class="standings-table">
            <thead>
                <tr>
                    <th style="text-align:center;">COMPARE</th>
                    <th style="text-align:center;">RANK</th>
                    <th>DRIVER</th>
                    <th>POINTS</th>
                    <th>WINS</th>
                    <th>TOP 5</th>
                    <th>TOP 10</th>
                    <th>AVG</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </main>

    <div id="graphModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('graphModal').style.display='none'">CLOSE</span>
            <h2 style="text-align:center; text-transform:uppercase; color:#fff; letter-spacing:2px; margin:0;">Season Trends</h2>
            <div class="chart-container"><canvas id="trendChart"></canvas></div>
        </div>
    </div>

    <footer>
        <div>© 2025-2026 AMERICAN STOCK CAR RACING LEAGUE</div>
        <div style="font-size: 0.65rem; color: var(--text-muted);">OWNED AND OPERATED BY <span style="color: #fff; font-weight: bold;">A&M PRODUCTIONS LLC</span></div>
        <div class="social-links">
            <a href="#" class="social-icon"><i class="fa-brands fa-facebook"></i></a>
            <a href="#" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="mailto:contact.ascrl@gmail.com" class="social-icon"><i class="fa-solid fa-envelope"></i></a>
        </div>
    </footer>

    <script>
        // CONFIG: Using drivers.json because it contains stats (wins/top5) that the flat standings file might be missing
        const DRIVERS_FILE = 'drivers_2025-26.json';
        const TRENDS_FILE = 'trends_2025-26.json';

        let driversData = {}; // Contains { ID: { series: { Cup: { stats: ... } } } }
        let trendsData = {};
        let currentSeries = 'Cup';
        let selectedDrivers = new Set();
        let myChart = null;

        // 1. NAVIGATION LOADER
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                const activeLink = document.getElementById('nav-standings');
                if (activeLink) {
                    activeLink.style.color = "var(--primary)";
                    activeLink.style.borderLeft = "4px solid var(--primary)";
                    activeLink.style.paddingLeft = "15px";
                }
            })
            .catch(err => console.error("Nav load failed"));

        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            if (menu) menu.classList.toggle('open');
        }

        // 2. DATA LOADER
        async function init() {
            try {
                // We load drivers_2025-26.json to resolve the "undefined" errors
                const [dRes, tRes] = await Promise.all([
                    fetch(DRIVERS_FILE),
                    fetch(TRENDS_FILE)
                ]);

                if (!dRes.ok) throw new Error("Drivers file not found. Ensure 'drivers_2025-26.json' is uploaded.");
                
                driversData = await dRes.json();
                
                if (tRes.ok) trendsData = await tRes.json();
                else console.warn("Trends file missing - graph will be disabled.");

                renderTable();
            } catch (err) {
                const el = document.getElementById('error-log');
                el.style.display = 'block';
                el.innerText = `ERROR: ${err.message}`;
            }
        }

        // 3. SERIES SWITCHER
        function switchSeries(seriesName) {
            currentSeries = seriesName;
            document.querySelectorAll('.series-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.series === seriesName) btn.classList.add('active');
            });
            selectedDrivers.clear();
            updateCompareButton();
            renderTable();
        }

        // 4. RENDER TABLE (Logic adapted to parse drivers.json structure)
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // Step 1: Flatten Data for the selected series
            let rows = [];
            Object.keys(driversData).forEach(key => {
                const d = driversData[key];
                
                // Find matching series key (case-insensitive)
                const sKey = Object.keys(d.series).find(k => k.toLowerCase() === currentSeries.toLowerCase());
                
                if (sKey) {
                    const stats = d.series[sKey].stats || {};
                    
                    // Fix Name
                    let name = d.display_name;
                    if (!name) name = key.replace(/^#\d+\s+/, '').trim();
                    if (!name) name = key;

                    // Fix Number formatting
                    let num = d.series[sKey].number || "";
                    if (key.includes("#") && !num) {
                        const match = key.match(/#(\d+)/);
                        if (match) num = match[1];
                    }
                    if (num) name = `#${num} ${name}`;

                    rows.push({
                        id: key, // Use the key (e.g. guest_#10...) for tracking
                        driver: name,
                        points: stats.points || 0,
                        wins: stats.wins || 0,
                        top5: stats.top5 || 0,
                        top10: stats.top10 || 0,
                        avg: stats.avg || 0
                    });
                }
            });

            // Step 2: Sort by Points
            rows.sort((a, b) => b.points - a.points);

            if (rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:4rem; font-family:sans-serif;">No data found for this series.</td></tr>';
                return;
            }

            // Step 3: Render
            rows.forEach((r, index) => {
                const tr = document.createElement('tr');
                // Use r.id (the key) for checkbox value to match trends data keys
                tr.innerHTML = `
                    <td class="checkbox-cell">
                        <input type="checkbox" class="select-box" value="${r.id}" onchange="toggleDriver(this)">
                    </td>
                    <td class="rank-cell">${index + 1}</td>
                    <td class="driver-cell">${r.driver}</td>
                    <td class="points-cell">${r.points}</td>
                    <td>${r.wins}</td>
                    <td>${r.top5}</td>
                    <td>${r.top10}</td>
                    <td>${Number(r.avg).toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 5. CHECKBOX LOGIC
        function toggleDriver(cb) {
            if (cb.checked) {
                if (selectedDrivers.size >= 10) {
                    alert("Maximum 10 drivers allowed.");
                    cb.checked = false;
                    return;
                }
                selectedDrivers.add(cb.value);
            } else {
                selectedDrivers.delete(cb.value);
            }
            updateCompareButton();
        }

        function updateCompareButton() {
            const btn = document.getElementById('compareBtn');
            document.getElementById('selCount').innerText = selectedDrivers.size;
            
            // Need trends data + >=2 selections
            const hasData = Object.keys(trendsData).length > 0;
            if (selectedDrivers.size >= 2 && hasData) {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        }

        // 6. GRAPH LOGIC
        function openGraph() {
            const modal = document.getElementById('graphModal');
            modal.style.display = 'flex';
            drawChart();
        }

        function closeModal(e) {
            if (e.target.id === 'graphModal') document.getElementById('graphModal').style.display = 'none';
        }

        function drawChart() {
            const tKey = Object.keys(trendsData).find(k => k.toLowerCase() === currentSeries.toLowerCase());
            if (!tKey) return;

            const sData = trendsData[tKey];
            const ctx = document.getElementById('trendChart').getContext('2d');
            const datasets = [];
            let i = 0;

            selectedDrivers.forEach(driverKey => {
                // Important: Trends keys often match Drivers keys. 
                // We check if the KEY exists in trends, or if we need to resolve the name.
                // Usually your trends file uses keys like "#10 MajorBlaze33".
                
                // Let's try direct key match first
                let dataPoints = sData.drivers[driverKey];

                // If not found, try to match by Display Name from driversData
                if (!dataPoints && driversData[driverKey]) {
                    const dispName = driversData[driverKey].display_name;
                    // Trends might rely on "Name" or "#Num Name"
                    // We try to find a key in trends that includes the name
                    const match = Object.keys(sData.drivers).find(k => k.includes(dispName));
                    if (match) dataPoints = sData.drivers[match];
                }

                if (dataPoints) {
                    const hue = (i * 360) / selectedDrivers.size;
                    const color = `hsl(${hue}, 70%, 50%)`;
                    
                    // Get clean name for legend
                    let legendName = driverKey;
                    if(driversData[driverKey]) legendName = driversData[driverKey].display_name || driverKey;

                    datasets.push({
                        label: legendName,
                        data: dataPoints,
                        borderColor: color,
                        backgroundColor: color,
                        tension: 0.3,
                        pointRadius: 4,
                        pointHoverRadius: 7
                    });
                    i++;
                }
            });

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: sData.labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#fff', font: { family: 'sans-serif' } } },
                        tooltip: { titleColor: '#c00', bodyFont: { size: 14 } }
                    },
                    scales: {
                        x: { ticks: { color: '#888' }, grid: { color: '#333' } },
                        y: { ticks: { color: '#888' }, grid: { color: '#333' }, title: { display: true, text: 'Cumulative Points', color: '#666' } }
                    }
                }
            });
        }

        init();
    </script>
</body>
</html>
