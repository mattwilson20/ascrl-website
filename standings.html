<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings & Stats | American Stock Car Racing League</title>
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #050505;
            --card-bg: #111;
            --border: #222;
            --text-muted: #888;
            
            --cup-blue: #0077ff;
            --xfinity-purple: #8000b0;
            --truck-red: #c00;
            --menards-yellow: #fff200;
        }

        body { 
            margin: 0; font-family: 'Arial Black', sans-serif; 
            background-color: #080808; color: #fff;
            background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            background-attachment: fixed;
        }

        /* --- NAVIGATION FIX --- */
        #nav-placeholder { position: relative; z-index: 9999; }

        /* --- HERO --- */
        .hero {
            padding: 8rem 1rem 4rem; text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), #080808), 
                        url("https://www.transparenttextures.com/patterns/cubes.png");
            border-bottom: 2px solid #222;
        }
        h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin: 0; letter-spacing: -2px; text-transform: uppercase; color: #fff; }
        .subtitle { letter-spacing: 4px; color: var(--primary); text-transform: uppercase; font-size: 0.8rem; display: block; margin-bottom: 10px; }

        /* --- CONTROLS --- */
        .controls-bar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8, 8, 8, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #222;
            padding: 1rem 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .controls-inner {
            max-width: 1200px; margin: 0 auto; padding: 0 1rem;
            display: flex; flex-direction: column; gap: 1rem; align-items: center;
        }

        .season-select {
            padding: 10px 25px; background: #151515; color: #fff;
            border: 1px solid #333; border-radius: 50px;
            font-family: 'Arial Black', sans-serif; font-size: 0.8rem;
            cursor: pointer; text-align: center; width: 100%; max-width: 300px;
            text-transform: uppercase; letter-spacing: 1px;
            transition: 0.3s;
        }
        .season-select:hover { border-color: var(--primary); background: #1a1a1a; }

        .tabs-container { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .series-btn {
            background: transparent; border: 1px solid #333; color: #666;
            padding: 8px 20px; border-radius: 4px; cursor: pointer;
            font-family: 'Arial Black', sans-serif; font-size: 0.75rem;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .series-btn:hover { color: #fff; border-color: #fff; }
        
        .series-btn[data-series="Cup"].active { background: var(--cup-blue); border-color: var(--cup-blue); color: #fff; }
        .series-btn[data-series="Xfinity"].active { background: var(--xfinity-purple); border-color: var(--xfinity-purple); color: #fff; }
        .series-btn[data-series="Truck"].active { background: var(--truck-red); border-color: var(--truck-red); color: #fff; }
        .series-btn[data-series="Menards"].active { background: var(--menards-yellow); border-color: var(--menards-yellow); color: #000; }

        /* --- STATS TABLE --- */
        .container { max-width: 1300px; margin: 0 auto; padding: 3rem 1rem; }
        
        .table-wrapper { overflow-x: auto; background: #111; border: 1px solid #222; border-radius: 8px; }
        
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        
        th { 
            background: #080808; color: #666; font-size: 0.7rem; 
            text-transform: uppercase; letter-spacing: 2px; text-align: center;
            padding: 20px 10px; border-bottom: 2px solid #222;
        }
        th:nth-child(2) { text-align: left; }

        td { 
            padding: 15px 10px; border-bottom: 1px solid #1a1a1a; 
            text-align: center; font-family: sans-serif; font-size: 0.9rem; color: #ccc;
        }
        
        tr:hover { background: rgba(255,255,255,0.03); }

        .rank-cell { font-family: 'Arial Black'; font-size: 1.2rem; color: #444; width: 60px; }
        .driver-cell { text-align: left; display: flex; align-items: center; gap: 15px; }
        .driver-name { font-family: 'Arial Black'; color: #fff; font-size: 1rem; text-transform: uppercase; }
        .team-tag { font-size: 0.7rem; color: #666; margin-left: 10px; font-weight: normal; }
        
        .pts-cell { font-family: 'Arial Black'; font-size: 1.1rem; color: var(--accent); }
        .win-cell { color: #fff; font-weight: bold; }

        .top3-row .rank-cell { color: var(--primary); }
        .top3-row { background: linear-gradient(90deg, rgba(204,0,0,0.05), transparent); }

        /* FOOTER */
        footer { padding: 4rem 1rem; text-align: center; border-top: 1px solid var(--border); color: #333; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
        .social-links { display: flex; gap: 2rem; justify-content: center; }
        .social-icon { color: #555; font-size: 1.8rem; transition: 0.3s ease; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .social-icon:hover { transform: translateY(-3px); }

        @media (max-width: 768px) {
            .hero { padding: 6rem 1rem 3rem; }
            .rank-cell { width: 40px; font-size: 1rem; }
            .driver-name { font-size: 0.9rem; }
            td, th { padding: 12px 5px; font-size: 0.8rem; }
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <header class="hero">
        <span class="subtitle">Official League Data</span>
        <h1>Standings</h1>
    </header>

    <div class="controls-bar">
        <div class="controls-inner">
            <select id="seasonSelect" class="season-select" onchange="loadStats()">
                <option value="2026">2026 Season (Current)</option>
                <option value="2025-26">2025-26 Season (Archive)</option>
            </select>

            <div class="tabs-container">
                <button class="series-btn active" data-series="Cup" onclick="switchSeries('Cup')">Cup</button>
                <button class="series-btn" data-series="Xfinity" onclick="switchSeries('Xfinity')">Xfinity</button>
                <button class="series-btn" data-series="Truck" onclick="switchSeries('Truck')">Trucks</button>
                <button class="series-btn" data-series="Menards" onclick="switchSeries('Menards')">Menards</button>
            </div>
        </div>
    </div>

    <main class="container">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Driver</th>
                        <th>Points</th>
                        <th>Wins</th>
                        <th>Top 5</th>
                        <th>Top 10</th>
                        <th class="hide-mobile">Poles</th>
                        <th class="hide-mobile">Starts</th>
                        <th class="hide-mobile">Avg Fin</th>
                    </tr>
                </thead>
                <tbody id="stats-body">
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <div>© 2025-2026 AMERICAN STOCK CAR RACING LEAGUE</div>
        <div class="social-links">
            <a href="https://www.facebook.com/share/14PeZVCH1hL/" target="_blank" class="social-icon facebook"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://x.com/ASCRWeekly" target="_blank" class="social-icon x-twitter"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="mailto:contact.ascrl@gmail.com" class="social-icon email"><i class="fa-solid fa-envelope"></i></a>
        </div>
    </footer>

    <script>
        // 1. NAV LOADER
        fetch('nav.html')
            .then(r => r.text())
            .then(d => {
                document.getElementById('nav-placeholder').innerHTML = d;
                
                const currentPage = window.location.pathname.split("/").pop() || "index.html";
                const navID = "nav-" + currentPage.split(".")[0];
                const activeLink = document.getElementById(navID);
                if(activeLink) {
                    activeLink.style.color = "var(--primary)";
                    activeLink.style.borderLeft = "4px solid var(--primary)";
                    activeLink.style.paddingLeft = "15px";
                }
            });

        // 2. GLOBAL TOGGLE FUNCTION
        function toggleMenu() {
            const m = document.getElementById('nav-menu');
            if(m) m.classList.toggle('open');
        }

        // 3. API DATA LOGIC
        const API_BASE_URL = 'http://127.0.0.1:8000'; // Change to production domain when hosted
        let currentSeries = 'Cup Series';

        function switchSeries(seriesName) {
            // Map button names to backend series names
            if (seriesName === 'Cup') currentSeries = 'Cup Series';
            else if (seriesName === 'Xfinity') currentSeries = 'Xfinity Series';
            else if (seriesName === 'Truck') currentSeries = 'Truck Series';
            else currentSeries = seriesName;

            document.querySelectorAll('.series-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.series === seriesName) btn.classList.add('active');
            });
            
            loadStats();
        }

        async function loadStats() {
            const tbody = document.getElementById('stats-body');
            tbody.innerHTML = '<tr><td colspan="9" style="padding:3rem;">Loading Live Standings...</td></tr>';

            try {
                const response = await fetch(`${API_BASE_URL}/api/stats/${encodeURIComponent(currentSeries)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const standings = await response.json();
                renderTable(standings);

            } catch (err) {
                console.error("API connection error:", err);
                tbody.innerHTML = `<tr><td colspan="9" style="color:#c00; padding:3rem;">Unable to connect to live API server. Make sure Python FastAPI is running!</td></tr>`;
            }
        }

        function renderTable(standings) {
            const tbody = document.getElementById('stats-body');
            tbody.innerHTML = '';

            if(!standings || standings.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="padding:3rem;">No active standings data found for ${currentSeries}.</td></tr>`;
                return;
            }

            standings.forEach((driver, index) => {
                const rank = index + 1;
                const rowClass = rank <= 3 ? 'top3-row' : '';
                
                let avg = driver.avg_finish || 0;
                if(typeof avg === 'number') avg = avg.toFixed(1);

                const html = `
                    <tr class="${rowClass}">
                        <td class="rank-cell">${rank}</td>
                        <td class="driver-cell">
                            <div>
                                <div class="driver-name">${driver.driver_id} <span style="color:#666; font-size:0.8rem;">#${driver.car_number || ''}</span></div>
                            </div>
                        </td>
                        <td class="pts-cell">${driver.points || 0}</td>
                        <td class="win-cell">${driver.wins || 0}</td>
                        <td>${driver.top5 || 0}</td>
                        <td>${driver.top10 || 0}</td>
                        <td class="hide-mobile">${driver.poles || 0}</td>
                        <td class="hide-mobile">${driver.starts || 0}</td>
                        <td class="hide-mobile">${avg}</td>
                    </tr>
                `;
                tbody.innerHTML += html;
            });
        }

        // Initialize on load
        loadStats();
    </script>

    <script>
        // Security Protections
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key.toLowerCase()) {
                    case 'u': case 's': case 'a': case 'c':
                        e.preventDefault();
                        return false;
                }
                if (e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j')) {
                    e.preventDefault();
                    return false;
                }
            }
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
