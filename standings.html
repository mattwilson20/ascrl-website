<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Championship Standings | American Stock Car Racing League</title>
    
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1445100562960879760.png?size=96">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --primary: #c00;
            --accent: #ff0;
            --bg-dark: #000;
            --card-bg: #0d0d0d;
            --border: #1a1a1a;
            --text-muted: #a0a0a0;
            --transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            
            /* Series Colors */
            --cup-blue: #0077ff;
            --xfinity-purple: #8000b0;
            --truck-red: #c00;
            --menards-yellow: #fff200;
        }

        body { 
            margin: 0; 
            font-family: 'Arial Black', sans-serif; 
            
            /* --- NASHVILLE (CONCRETE) TEXTURE --- */
            background-color: #333333; 
            
            background-image: 
                radial-gradient(transparent 0%, #000 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.35'/%3E%3C/svg%3E");
            
            background-attachment: fixed;
            color: #fff; 
            overflow-x: hidden; 
        }

        /* --- MODULAR NAVIGATION STYLES --- */
        #nav-placeholder { position: relative; z-index: 2000; }
        
        .nav-overlay { 
            position: fixed; top: 0; left: -100%; width: 100%; max-width: 350px; 
            height: 100vh; background: #050505; transition: left 0.5s ease; 
            z-index: 1999; padding-top: 100px; border-right: 1px solid var(--primary); 
        }
        .nav-overlay.open { left: 0; }
        .nav-links { display: flex; flex-direction: column; padding: 0 3rem; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-size: 1.2rem; padding: 1.2rem 0; 
            border-bottom: 1px solid var(--border); transition: var(--transition); letter-spacing: 2px; 
        }
        .nav-links a:hover { color: var(--primary); padding-left: 10px; }

        /* --- HERO --- */
        .hero { 
            background: radial-gradient(circle at center, #222 0%, #000 100%); 
            padding: 12rem 1rem 8rem; 
            text-align: center; 
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: clamp(3rem, 10vw, 5rem); margin: 0; letter-spacing: -2px; line-height: 0.9; }
        .hero p { color: var(--primary); letter-spacing: 5px; text-transform: uppercase; font-size: 0.9rem; margin-top: 1rem; }

        /* --- CONTROLS --- */
        .controls { 
            background: #050505; padding: 2rem 1rem; border-bottom: 1px solid var(--border); 
            position: sticky; top: 0; z-index: 100; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
        }
        .tabs-container { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }

        /* SERIES BUTTONS */
        .series-btn {
            background: #111; border: 1px solid #333; color: #fff; 
            padding: 15px 30px; font-family: 'Arial Black', sans-serif; 
            text-transform: uppercase; font-size: 1rem; letter-spacing: 1px;
            cursor: pointer; transition: var(--transition); min-width: 150px;
            position: relative; overflow: hidden;
        }
        .series-btn:hover { transform: translateY(-3px); }
        .series-btn.active { border-color: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        .series-btn[data-series="Cup"].active { background: var(--cup-blue); border-color: var(--cup-blue); }
        .series-btn[data-series="Xfinity"].active { background: var(--xfinity-purple); border-color: var(--xfinity-purple); }
        .series-btn[data-series="Truck"].active { background: var(--truck-red); border-color: var(--truck-red); }
        .series-btn[data-series="Menards"].active { background: var(--menards-yellow); border-color: var(--menards-yellow); color: #000; }

        /* COMPARE BUTTON */
        #compareBtn {
            display: none; padding: 12px 30px; background-color: #fff; color: #000;
            border: 1px solid #fff; font-family: 'Arial Black'; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: 0.3s; animation: popIn 0.3s ease;
        }
        #compareBtn:hover { background-color: var(--primary); color: #fff; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- TABLE --- */
        .container { max-width: 1000px; margin: 0 auto; padding: 4rem 2rem; overflow-x: auto; }

        .standings-table { width: 100%; border-collapse: collapse; min-width: 700px; }
        .standings-table th { 
            text-align: left; padding: 1.5rem; color: var(--primary); 
            border-bottom: 1px solid var(--border); font-size: 0.8rem; letter-spacing: 2px;
        }
        .standings-table td { 
            padding: 1.5rem; border-bottom: 1px solid var(--border); 
            font-family: sans-serif; font-size: 1rem; color: #ccc;
        }
        .standings-table tr:hover td { background: #0a0a0a; color: #fff; }

        .rank-cell { font-family: 'Arial Black'; color: #fff; width: 60px; text-align: center; font-size: 1.2rem; }
        .driver-cell { font-family: 'Arial Black'; color: #fff; font-size: 1.1rem; letter-spacing: 1px; }
        .points-cell { font-family: 'Arial Black'; color: var(--accent); font-size: 1.1rem; }
        .checkbox-cell { text-align: center; width: 50px; }
        
        .select-box { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); }

        /* --- RANK ARROWS --- */
        .move-up { color: #0f0; font-size: 0.8rem; margin-left: 5px; }
        .move-down { color: #f00; font-size: 0.8rem; margin-left: 5px; }
        .move-same { color: #555; font-size: 0.8rem; margin-left: 5px; }

        /* --- GRAPH MODAL --- */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.98); z-index: 3000; justify-content: center; align-items: center; 
        }
        .modal-content { 
            background: #000; border: 1px solid var(--primary); padding: 4rem; width: 90%; max-width: 1000px; 
            position: relative; 
        }
        .close { 
            position: absolute; top: 2rem; right: 2rem; font-size: 1rem; cursor: pointer; 
            color: #fff; border: 1px solid #fff; padding: 5px 15px; opacity: 0.5;
        }
        .close:hover { opacity: 1; background: #fff; color: #000; }
        .chart-container { position: relative; height: 60vh; width: 100%; margin-top: 20px; }

        /* --- FOOTER & SOCIALS --- */
        footer { 
            padding: 4rem 1rem; 
            text-align: center; 
            border-top: 1px solid var(--border); 
            color: #333; 
            font-size: 0.8rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 1.5rem; 
        }

        .social-links { display: flex; gap: 2rem; justify-content: center; }

        .social-icon { 
            color: #555; font-size: 1.8rem; transition: 0.3s ease; 
            display: flex; align-items: center; justify-content: center; text-decoration: none;
        }
        .social-icon:hover { transform: translateY(-3px); }
        .social-icon.facebook:hover { color: #1877F2; } 
        .social-icon.x-twitter:hover { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .social-icon.email:hover { color: var(--primary); }

        /* Error Log */
        #error-log { display:none; background:#300; color:#f88; padding:15px; margin: 20px auto; max-width:800px; border:1px solid red; text-align:center; font-family: sans-serif; }
        
        /* Spinner */
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .hero { padding: 10rem 1rem 4rem; }
        }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="spinner"></div></div>

    <div id="nav-placeholder"></div>

    <header class="hero">
        <p>Season 2025-26</p>
        <h1>STANDINGS</h1>
    </header>

    <div id="error-log"></div>

    <div class="controls">
        <div class="tabs-container">
            <button class="series-btn active" data-series="Cup" onclick="switchSeries('Cup')">Cup Series</button>
            <button class="series-btn" data-series="Xfinity" onclick="switchSeries('Xfinity')">Xfinity</button>
            <button class="series-btn" data-series="Truck" onclick="switchSeries('Truck')">Trucks</button>
            <button class="series-btn" data-series="Menards" onclick="switchSeries('Menards')">Menards</button>
        </div>
        
        <button id="compareBtn" onclick="openGraph()">
            COMPARE DRIVERS (<span id="selCount">0</span>/10)
        </button>
    </div>

    <main class="container">
        <div style="overflow-x: auto;">
            <table class="standings-table">
                <thead>
                    <tr>
                        <th style="text-align:center;">COMPARE</th>
                        <th style="text-align:center;">RANK</th>
                        <th>DRIVER</th>
                        <th>POINTS</th>
                        <th>WINS</th>
                        <th>TOP 5</th>
                        <th>TOP 10</th>
                        <th>AVG</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <div id="graphModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('graphModal').style.display='none'">CLOSE</span>
            <h2 style="text-align:center; text-transform:uppercase; color:#fff; letter-spacing:2px; margin:0;">Season Trends</h2>
            <div class="chart-container"><canvas id="trendChart"></canvas></div>
        </div>
    </div>

    <footer>
        <div style="margin-bottom: 0.5rem; letter-spacing: 2px; color: #fff;">
            © 2025-2026 AMERICAN STOCK CAR RACING LEAGUE
        </div>
        
        <div style="font-size: 0.65rem; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 2rem; text-transform: uppercase;">
            OWNED AND OPERATED BY <span style="color: #fff; font-weight: bold;">A&M PRODUCTIONS LLC</span>
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/share/14PeZVCH1hL/" target="_blank" class="social-icon facebook" aria-label="Facebook">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="https://x.com/ASCRWeekly" target="_blank" class="social-icon x-twitter" aria-label="X (Twitter)">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            
            <a href="mailto:contact.ascrl@gmail.com" class="social-icon email" aria-label="Email A&M Productions">
                <i class="fa-solid fa-envelope"></i>
            </a>
        </div>
        
        <div style="font-size: 0.6rem; color: #444; margin-top: 20px; font-style: italic;">*ai generated images may be used</div>
    </footer>

    <script>
        // CONFIG - UPDATED FILES
        const STANDINGS_FILE = 'ASCRL_Standings_Season_1.json';
        const TRENDS_FILE = 'ASCRL_Trends_Season_1.json';

        let standingsData = {}; 
        let trendsData = {};
        let currentSeries = 'Cup';
        let selectedDrivers = new Set();
        let myChart = null;

        // 1. NAVIGATION LOADER
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                const activeLink = document.getElementById('nav-standings');
                if (activeLink) {
                    activeLink.style.color = "var(--primary)";
                    activeLink.style.borderLeft = "4px solid var(--primary)";
                    activeLink.style.paddingLeft = "15px";
                }
            })
            .catch(err => console.error("Nav load failed"));

        // Global toggle for the menu loaded from nav.html
        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            if (menu) menu.classList.toggle('open');
        }

        // 2. DATA LOADER
        async function init() {
            try {
                const [sRes, tRes] = await Promise.all([
                    fetch(STANDINGS_FILE),
                    fetch(TRENDS_FILE)
                ]);

                if (!sRes.ok) throw new Error("Standings file not found.");
                
                standingsData = await sRes.json();
                
                if (tRes.ok) trendsData = await tRes.json();
                else console.warn("Trends file missing - comparison disabled.");

                renderTable();
                
                // Remove Spinner
                document.getElementById('loading-screen').style.opacity = 0;
                setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);

            } catch (err) {
                document.getElementById('loading-screen').style.display = 'none';
                const el = document.getElementById('error-log');
                el.style.display = 'block';
                el.innerText = `ERROR: ${err.message}`;
            }
        }

        // 3. SERIES SWITCHER
        function switchSeries(seriesName) {
            currentSeries = seriesName;
            document.querySelectorAll('.series-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.series === seriesName) btn.classList.add('active');
            });
            selectedDrivers.clear();
            updateCompareButton();
            renderTable();
        }

        // 4. RENDER TABLE
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // Use the array directly from ASCRL_Standings_Season_1.json
            const rows = standingsData[currentSeries] || [];

            // Calculate Previous Ranks using Trend Data
            let prevRanks = [];
            if (trendsData && trendsData[currentSeries]) {
                const tData = trendsData[currentSeries].drivers;
                const raceCount = trendsData[currentSeries].labels.length;

                if (raceCount > 0) {
                    rows.forEach(r => {
                        // The 'driver' field in Standings matches the key in Trends (e.g. "#1 mattwilson20")
                        const hist = tData[r.driver];
                        let prevPoints = 0;
                        if (hist) {
                             if (hist.length >= 2) prevPoints = hist[hist.length - 2];
                             else if (hist.length === 1) prevPoints = 0;
                        }
                        
                        prevRanks.push({ driver: r.driver, pts: prevPoints });
                    });
                    prevRanks.sort((a, b) => b.pts - a.pts);
                }
            }

            if (rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:4rem; color:#666;">No data found.</td></tr>';
                return;
            }

            rows.forEach((r, index) => {
                const tr = document.createElement('tr');
                const currentRank = index + 1;
                
                let arrowHtml = '<span class="move-same">-</span>';
                if (prevRanks.length > 0) {
                    const prevIndex = prevRanks.findIndex(p => p.driver === r.driver);
                    if (prevIndex !== -1) {
                        const prevRank = prevIndex + 1;
                        if (prevRank > currentRank) arrowHtml = `<span class="move-up">▲${prevRank - currentRank}</span>`;
                        else if (prevRank < currentRank) arrowHtml = `<span class="move-down">▼${currentRank - prevRank}</span>`;
                    } else arrowHtml = '<span class="move-up">NEW</span>';
                }

                // Clean up Average for display
                const avgDisplay = (typeof r.avg === 'number') ? r.avg.toFixed(2) : r.avg;

                // Use r.driver (the name string) as the value for the checkbox
                tr.innerHTML = `
                    <td class="checkbox-cell">
                        <input type="checkbox" class="select-box" value="${r.driver}" onchange="toggleDriver(this)">
                    </td>
                    <td class="rank-cell">
                        ${currentRank} ${arrowHtml}
                    </td>
                    <td class="driver-cell">${r.driver}</td>
                    <td class="points-cell">${r.points}</td>
                    <td>${r.wins}</td>
                    <td>${r.top5}</td>
                    <td>${r.top10}</td>
                    <td>${avgDisplay}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 5. CHECKBOX LOGIC
        function toggleDriver(cb) {
            if (cb.checked) {
                if (selectedDrivers.size >= 10) { alert("Maximum 10 drivers allowed."); cb.checked = false; return; }
                selectedDrivers.add(cb.value);
            } else {
                selectedDrivers.delete(cb.value);
            }
            updateCompareButton();
        }

        function updateCompareButton() {
            const btn = document.getElementById('compareBtn');
            document.getElementById('selCount').innerText = selectedDrivers.size;
            const hasData = Object.keys(trendsData).length > 0;
            if (selectedDrivers.size >= 2 && hasData) btn.style.display = 'block';
            else btn.style.display = 'none';
        }

        // 6. GRAPH LOGIC
        function openGraph() {
            document.getElementById('graphModal').style.display = 'flex';
            drawChart();
        }

        function closeModal(e) {
            if (e.target.id === 'graphModal') document.getElementById('graphModal').style.display = 'none';
        }

        function drawChart() {
            const tKey = Object.keys(trendsData).find(k => k.toLowerCase() === currentSeries.toLowerCase());
            if (!tKey) return;

            const sData = trendsData[tKey];
            const ctx = document.getElementById('trendChart').getContext('2d');
            const datasets = [];
            let i = 0;

            selectedDrivers.forEach(driverName => {
                // driverName matches the key in trendsData.drivers
                const dataPoints = sData.drivers[driverName];
                
                if (dataPoints) {
                    const hue = (i * 360) / selectedDrivers.size;
                    const color = `hsl(${hue}, 70%, 50%)`;
                    
                    datasets.push({
                        label: driverName,
                        data: dataPoints,
                        borderColor: color,
                        backgroundColor: color,
                        tension: 0.3,
                        pointRadius: 4,
                        pointHoverRadius: 7
                    });
                    i++;
                }
            });

            if (myChart) myChart.destroy();
            
            let delayed = false;
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: sData.labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        onComplete: () => { delayed = true; },
                        delay: (context) => {
                            let delay = 0;
                            if (context.type === 'data' && context.mode === 'default' && !delayed) {
                                delay = context.dataIndex * 150; 
                            }
                            return delay;
                        },
                    },
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#fff', font: { family: 'sans-serif' } } },
                        tooltip: { titleColor: '#c00', bodyFont: { size: 14 } }
                    },
                    scales: {
                        x: { ticks: { color: '#888' }, grid: { color: '#333' } },
                        y: { ticks: { color: '#888' }, grid: { color: '#333' }, title: { display: true, text: 'Cumulative Points', color: '#666' } }
                    }
                }
            });
        }

        init();
    </script>

    <script>
        // 1. Disable Right Click
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // 2. Disable Keyboard Shortcuts (Ctrl+U, F12, Ctrl+Shift+I, etc.)
        document.addEventListener('keydown', (e) => {
            // Check for Ctrl (or Command on Mac)
            if (e.ctrlKey || e.metaKey) {
                switch (e.key.toLowerCase()) {
                    case 'u': // View Source
                    case 's': // Save Page
                    case 'a': // Select All
                    case 'c': // Copy
                        e.preventDefault();
                        return false;
                }
                // Check for Ctrl+Shift+I or J (Developer Tools)
                if (e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j')) {
                    e.preventDefault();
                    return false;
                }
            }
            
            // Check for F12 (Developer Tools)
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });
    </script>

</body>
</html>
